<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>nuonuo小窝</title>
  <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="18" fill="%23eaf4ff"/%3E%3Cpath fill="%237199c9" d="M32 49 15 32c-6-6-2-17 7-17 5 0 8 3 10 7 2-4 5-7 10-7 9 0 13 11 7 17L32 49z"/%3E%3C/svg%3E' />
  <link rel="preload" href="./assets/work/photo-wall.webp" as="image" />
  <link rel="preload" href="./assets/work/anniversary.webp" as="image" />
  <link rel="preload" href="./assets/work/message-wall.webp" as="image" />
  <link rel="preload" href="./assets/work/heart-game.webp" as="image" />
  <link rel="preload" href="./assets/work/coco-diary.webp" as="image" />
  <link rel="preload" href="./assets/work/drink-game.webp" as="image" />
  <link rel="preload" href="./assets/work/nuonuo-academy.webp" as="image" />
  <style>
    :root {
      color-scheme: light;
      --ink: #0c1422;
      --text: #142036;
      --muted: rgba(36, 48, 70, .66);
      --soft: rgba(255, 255, 255, .66);
      --strong: rgba(255, 255, 255, .86);
      --line: rgba(116, 135, 160, .24);
      --blue: #7199c9;
      --blue-2: #dfeaf8;
      --gold: #c4a66f;
      --shadow: 0 28px 90px rgba(92, 111, 138, .18);
      --shadow-strong: 0 36px 120px rgba(73, 92, 118, .26);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: #f4f8fd;
    }

    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(180, 210, 244, .72), transparent 30%),
        radial-gradient(circle at 88% 18%, rgba(255, 250, 235, .9), transparent 28%),
        radial-gradient(circle at 42% 92%, rgba(212, 227, 246, .9), transparent 36%),
        linear-gradient(140deg, #f9fbff 0%, #eef5fb 48%, #ffffff 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
    }

    body::before {
      background:
        linear-gradient(90deg, rgba(126, 149, 178, .07) 1px, transparent 1px),
        linear-gradient(rgba(126, 149, 178, .06) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at 50% 36%, rgba(0,0,0,.68), transparent 70%);
    }

    body::after {
      z-index: -1;
      background:
        radial-gradient(circle at calc(50% + var(--mx, 0) * 10%) calc(36% + var(--my, 0) * 8%), rgba(255,255,255,.9), transparent 26%),
        linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0));
      opacity: .72;
    }

    button,
    input {
      font: inherit;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 34% 30%, rgba(255,255,255,1), transparent 28%),
        linear-gradient(135deg, #f8fbff, #e8f1fb);
      transition: opacity .55s ease, visibility .55s ease;
    }

    .loader.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(380px, 88vw);
      padding: 26px;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: var(--radius);
      background: rgba(255,255,255,.5);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
    }

    .loader-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: rgba(23, 32, 51, .78);
      font-size: 13px;
      letter-spacing: 0;
    }

    .loader-title {
      font-weight: 720;
    }

    .loader-track {
      height: 3px;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(105, 128, 156, .15);
    }

    .loader-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #9bb9d8, #ffffff, #c4a66f);
      box-shadow: 0 0 18px rgba(113, 153, 201, .42);
      transition: width .24s ease;
    }

    .site-shell {
      position: relative;
      min-height: 100dvh;
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s ease;
    }

    body.site-ready .site-shell {
      opacity: 1;
      visibility: visible;
    }

    .topbar {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      pointer-events: none;
    }

    .brand,
    .auth-box,
    .section-nav {
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.76);
      background: rgba(255,255,255,.52);
      box-shadow: 0 18px 58px rgba(77, 97, 123, .13);
      backdrop-filter: blur(22px) saturate(155%);
      -webkit-backdrop-filter: blur(22px) saturate(155%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 0 13px;
      border-radius: 999px;
      color: rgba(12, 20, 34, .9);
      font-weight: 760;
      line-height: 1;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #fff;
      box-shadow:
        0 0 0 1px rgba(113,153,201,.18),
        0 0 15px rgba(113,153,201,.5),
        0 0 34px rgba(196,166,111,.24);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .section-nav {
      position: fixed;
      top: 50%;
      right: max(18px, env(safe-area-inset-right));
      z-index: 42;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-height: auto;
      padding: 14px 8px;
      border-radius: 999px;
      transform: translateY(-50%);
    }

    .section-nav::before {
      content: "";
      position: absolute;
      top: 22px;
      bottom: 22px;
      left: 50%;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(23, 32, 51, .22), transparent);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .nav-dot {
      position: relative;
      z-index: 1;
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      color: transparent;
      background: rgba(23, 32, 51, .3);
      cursor: pointer;
      font-size: 0;
      line-height: 1;
      box-shadow: 0 0 0 1px rgba(255,255,255,.62);
      transition: width .24s ease, border-radius .24s ease, background .24s ease, transform .24s ease, box-shadow .24s ease;
    }

    .nav-dot.is-active {
      width: 28px;
      border-radius: 999px;
      background: rgba(23, 32, 51, .84);
      transform: scale(1.02);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.82),
        0 10px 24px rgba(73, 92, 118, .22);
    }

    .auth-box {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      color: var(--ink);
    }

    .auth-status {
      max-width: min(28vw, 170px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-left: 8px;
      color: rgba(23, 32, 51, .66);
      font-size: 13px;
      line-height: 1;
    }

    .btn {
      min-height: 30px;
      border: 0;
      border-radius: 999px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      background: rgba(255,255,255,.48);
      box-shadow: inset 0 0 0 1px rgba(23,32,51,.08);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.82);
      box-shadow: inset 0 0 0 1px rgba(23,32,51,.12), 0 10px 24px rgba(77,97,123,.12);
    }

    .primary-btn {
      color: #fff;
      background: rgba(23, 32, 51, .86);
    }

    .danger-btn {
      color: #7e2730;
      background: rgba(255,255,255,.54);
    }

    .story-pin {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      overflow: hidden;
      pointer-events: auto;
      background:
        linear-gradient(115deg, rgba(255,255,255,.18), transparent 34%),
        radial-gradient(circle at 74% 21%, rgba(255,255,255,.58), transparent 30%),
        linear-gradient(180deg, rgba(232,243,255,.18), rgba(235,244,253,.34));
    }

    .exhibit-space {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .exhibit-space::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(113,153,201,.105) 1px, transparent 1px),
        linear-gradient(90deg, rgba(113,153,201,.08) 1px, transparent 1px);
      background-size: 92px 92px, 92px 92px;
      mask-image: radial-gradient(circle at 62% 42%, black, transparent 72%);
      opacity: .42;
    }

    .exhibit-space::after {
      content: "";
      position: absolute;
      inset: 12vh 7vw 10vh 8vw;
      border-left: 1px solid rgba(255,255,255,.68);
      border-right: 1px solid rgba(113,153,201,.14);
      background:
        linear-gradient(90deg, rgba(255,255,255,.34), transparent 14%, transparent 84%, rgba(255,255,255,.18)),
        linear-gradient(180deg, transparent, rgba(255,255,255,.32), transparent);
      box-shadow:
        inset 1px 0 0 rgba(113,153,201,.12),
        0 0 80px rgba(255,255,255,.2);
      opacity: .48;
    }

    .exhibit-line {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.88), rgba(113,153,201,.22), transparent);
      opacity: .62;
    }

    .exhibit-line.line-a {
      top: 25vh;
      left: 12vw;
      width: 44vw;
    }

    .exhibit-line.line-b {
      right: 9vw;
      bottom: 21vh;
      width: 38vw;
    }

    .exhibit-column {
      position: absolute;
      top: 13vh;
      bottom: 10vh;
      width: min(13vw, 160px);
      border: 1px solid rgba(255,255,255,.42);
      border-top: 0;
      border-bottom: 0;
      background: linear-gradient(90deg, rgba(255,255,255,.22), rgba(255,255,255,.04), rgba(113,153,201,.07));
      filter: blur(.2px);
      opacity: .42;
    }

    .exhibit-column.column-a {
      left: 6vw;
    }

    .exhibit-column.column-b {
      right: 5vw;
      opacity: .32;
    }

    .scroll-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .scroll-stage::before {
      content: "";
      position: absolute;
      inset: 11vh 4vw auto auto;
      width: min(46vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.86), rgba(221,235,250,.38) 38%, transparent 70%);
      filter: blur(8px);
      transform: translate3d(calc(var(--mx, 0) * 22px), calc(var(--my, 0) * 18px), 0);
      opacity: .8;
      pointer-events: none;
    }

    .scroll-stage::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 9vh;
      width: min(760px, 58vw);
      height: 18px;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, rgba(73, 92, 118, .18), rgba(73, 92, 118, 0) 68%);
      transform: translateX(-2%);
      filter: blur(8px);
      opacity: .55;
      pointer-events: none;
    }

    .text-track {
      position: relative;
      z-index: 4;
    }

    .story-copy-stage {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .text-scene {
      min-height: 100dvh;
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(94px, 13vh, 136px) clamp(18px, 5vw, 70px) clamp(36px, 8vh, 78px);
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(360px, 1.08fr);
      gap: clamp(30px, 6vw, 86px);
      align-items: center;
    }

    .hero-text {
      width: 100%;
      margin: 0;
      padding-top: clamp(92px, 12vh, 120px);
      grid-template-columns: minmax(0, 860px);
      justify-content: start;
      align-items: start;
    }

    .text-copy {
      grid-column: 1;
      color: var(--ink);
    }

    .story-copy {
      position: absolute;
      inset: 0;
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(94px, 13vh, 136px) clamp(18px, 5vw, 70px) clamp(36px, 8vh, 78px);
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(360px, 1.08fr);
      gap: clamp(30px, 6vw, 86px);
      align-items: center;
      color: var(--ink);
      opacity: 0;
      visibility: hidden;
    }

    .story-copy-inner {
      grid-column: 1;
      max-width: 620px;
    }

    .entry-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: var(--layer-opacity, 0);
      transition: opacity .18s linear;
      pointer-events: none;
    }

    .entry-layer {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(94px, 13vh, 136px) clamp(18px, 5vw, 70px) clamp(36px, 8vh, 78px);
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(360px, 1.08fr);
      gap: clamp(30px, 6vw, 86px);
      align-items: center;
      left: 50%;
      transform: translateX(-50%);
      z-index: var(--layer-z, 1);
    }

    .entry-layer.is-active {
      pointer-events: auto;
    }

    .entry-layer.is-active .visual {
      pointer-events: auto;
    }

    h1,
    h2 {
      margin: 0;
      color: var(--ink);
      letter-spacing: 0;
      font-weight: 760;
      line-height: .95;
    }

    h1 {
      max-width: 790px;
      font-size: clamp(54px, 8.8vw, 128px);
      text-shadow: 0 22px 70px rgba(73, 92, 118, .18);
    }

    h1 span {
      display: block;
    }

    h2 {
      font-size: clamp(50px, 8.4vw, 122px);
      text-shadow:
        0 18px 58px rgba(73, 92, 118, .18),
        0 1px 0 rgba(255,255,255,.5);
    }

    .story-title-mask,
    .reveal-line {
      display: block;
      overflow: hidden;
      clip-path: inset(-12% 0 -16% 0);
    }

    .story-title-text,
    .reveal-text {
      display: block;
      will-change: transform, opacity;
    }

    .story-narrative {
      display: grid;
      gap: clamp(10px, 1.3vw, 16px);
      max-width: 520px;
      margin-top: clamp(18px, 3.6vh, 34px);
      color: rgba(23,32,51,.72);
      font-size: clamp(16px, 1.35vw, 20px);
      line-height: 1.72;
      letter-spacing: 0;
    }

    .story-narrative::before {
      content: "";
      width: min(104px, 24vw);
      height: 1px;
      margin-bottom: clamp(2px, .8vh, 8px);
      background: linear-gradient(90deg, rgba(23,32,51,.42), rgba(113,153,201,.18), transparent);
    }

    .reveal-line {
      padding-bottom: .04em;
    }

    .copy {
      max-width: 540px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.6vw, 21px);
      line-height: 1.75;
    }

    .visual {
      position: relative;
      grid-column: 2;
      min-height: clamp(420px, 60vh, 650px);
      padding: 0;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.58), rgba(255,255,255,.22)),
        rgba(255,255,255,.45);
      box-shadow:
        0 42px 120px rgba(73, 92, 118, .25),
        0 8px 0 rgba(255,255,255,.28),
        inset 0 0 0 1px rgba(255,255,255,.45),
        inset 0 -40px 70px rgba(23,32,51,.08);
      overflow: hidden;
      backdrop-filter: blur(28px) saturate(145%);
      -webkit-backdrop-filter: blur(28px) saturate(145%);
      cursor: pointer;
      transform:
        translate3d(calc(var(--mx, 0) * -10px), 0, 0)
        rotateX(calc(var(--my, 0) * -2deg))
        rotateY(calc(var(--mx, 0) * 2.5deg))
        scale(var(--visual-scale, 1));
      transform-style: preserve-3d;
      opacity: var(--visual-opacity, 0);
      pointer-events: none;
      transition: transform .75s cubic-bezier(.19, 1, .22, 1), opacity .55s ease, box-shadow .35s ease, filter .35s ease;
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.48), transparent 34%),
        linear-gradient(90deg, rgba(255,255,255,.2), transparent 20%, transparent 78%, rgba(255,255,255,.22)),
        var(--section-image) center / cover no-repeat;
      transform: scale(1.06);
      transition: transform 1.2s cubic-bezier(.19, 1, .22, 1), filter .75s ease;
      filter: saturate(.94) contrast(.98);
    }

    .entry-layer.is-active .visual::before {
      transform: scale(1);
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.24), transparent 36%, rgba(255,255,255,.34)),
        linear-gradient(108deg, transparent 0 34%, rgba(255,255,255,.34) 35%, transparent 47%),
        radial-gradient(circle at 22% 20%, rgba(255,255,255,.74), transparent 24%);
      pointer-events: none;
    }

    .visual:hover,
    .visual:focus-visible {
      box-shadow:
        0 42px 130px rgba(73, 92, 118, .3),
        inset 0 0 0 1px rgba(255,255,255,.88);
      filter: saturate(1.04) contrast(1.02);
      outline: none;
    }

    .visual:hover::before,
    .visual:focus-visible::before {
      transform: scale(1.035);
      filter: saturate(1.03) contrast(1.02);
    }

    .visual:active {
      transform:
        translate3d(calc(var(--mx, 0) * -6px), 2px, 0)
        rotateX(calc(var(--my, 0) * -1.2deg))
        rotateY(calc(var(--mx, 0) * 1.6deg))
        scale(.985);
    }

    .visual-card {
      position: absolute;
      left: clamp(18px, 3vw, 34px);
      right: clamp(18px, 3vw, 34px);
      bottom: clamp(18px, 3vw, 34px);
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(255,255,255,.8), rgba(255,255,255,.5)),
        rgba(255,255,255,.56);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      box-shadow:
        0 22px 58px rgba(73, 92, 118, .18),
        inset 0 1px 0 rgba(255,255,255,.72);
    }

    .visual-card strong {
      display: block;
      color: var(--ink);
      font-size: clamp(20px, 2.3vw, 32px);
      line-height: 1.05;
    }

    .visual-card span {
      display: block;
      margin-top: 8px;
      color: rgba(23,32,51,.58);
      font-size: 13px;
      line-height: 1.45;
    }

    .index-number {
      color: rgba(23,32,51,.34);
      font-size: clamp(36px, 5vw, 78px);
      font-weight: 760;
      line-height: .9;
      white-space: nowrap;
    }

    .section-copy {
      opacity: 1;
    }

    body.gsap-story .entry-layer,
    body.gsap-story .visual,
    body.gsap-story .visual::before,
    body.gsap-story .story-copy {
      transition: none;
    }

    body.gsap-story .story-copy {
      will-change: transform, opacity;
    }

    body.gsap-story .story-title-text,
    body.gsap-story .reveal-text {
      will-change: transform, opacity;
    }

    body.gsap-story .visual {
      will-change: transform, opacity;
    }

    body.gsap-story .entry-layer.is-active,
    body.gsap-story .entry-layer.is-active .visual {
      pointer-events: auto;
    }

    .section-image-1 { --section-image: url("./assets/work/photo-wall.webp"); }
    .section-image-2 { --section-image: url("./assets/work/anniversary.webp"); }
    .section-image-3 { --section-image: url("./assets/work/message-wall.webp"); }
    .section-image-4 { --section-image: url("./assets/work/heart-game.webp"); }
    .section-image-5 { --section-image: url("./assets/work/coco-diary.webp"); }
    .section-image-6 { --section-image: url("./assets/work/drink-game.webp"); }
    .section-image-7 { --section-image: url("./assets/work/nuonuo-academy.webp"); }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(237, 244, 251, .58);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .auth-modal.show {
      display: flex;
    }

    .auth-modal-card {
      width: min(420px, 100%);
      border: 1px solid rgba(255,255,255,.84);
      border-radius: var(--radius);
      background: rgba(255,255,255,.72);
      color: var(--ink);
      box-shadow: var(--shadow-strong);
      overflow: hidden;
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
    }

    .auth-modal-head {
      padding: 24px 24px 10px;
    }

    .auth-modal-head h3 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 760;
    }

    .auth-modal-head p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .auth-modal-body {
      padding: 12px 24px 24px;
    }

    .auth-field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    .auth-field label {
      color: rgba(23,32,51,.64);
      font-size: 13px;
    }

    .auth-input {
      width: 100%;
      border: 1px solid rgba(23,32,51,.12);
      border-radius: var(--radius);
      min-height: 43px;
      padding: 0 12px;
      background: rgba(255,255,255,.62);
      color: var(--ink);
      outline: none;
    }

    .auth-input:focus {
      border-color: rgba(113,153,201,.7);
      box-shadow: 0 0 0 4px rgba(113,153,201,.14);
    }

    .auth-modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .auth-modal-actions button {
      flex: 1;
      min-height: 42px;
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--ink);
    }

    .auth-modal-actions .ok {
      background: rgba(23,32,51,.9);
      color: #fff;
    }

    .auth-modal-actions .cancel {
      background: rgba(255,255,255,.62);
    }

    .auth-switch {
      margin-top: 14px;
      color: rgba(67, 106, 152, .92);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    @media (max-width: 920px) {
      .section-nav {
        right: 10px;
        gap: 8px;
        padding: 10px 6px;
        background: rgba(255,255,255,.36);
      }

      .text-scene,
      .story-copy {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .entry-layer {
        grid-template-columns: 1fr;
        display: block;
        width: 100%;
        left: 0;
        transform: none;
        padding: 0 16px 28px;
      }

      .visual {
        position: absolute;
        grid-column: auto;
        left: 16px;
        right: 16px;
        bottom: max(28px, env(safe-area-inset-bottom));
        min-height: clamp(330px, 44vh, 520px);
      }

    }

    @media (max-width: 640px) {
      .topbar {
        align-items: flex-start;
        gap: 8px;
      }

      .topbar-right {
        display: contents;
        position: static;
        max-width: none;
        gap: 6px;
      }

      .brand {
        min-height: 38px;
        padding: 0 11px;
        font-size: 14px;
      }

      .auth-box {
        position: fixed;
        top: 14px;
        right: auto;
        left: 118px;
        width: 78px;
        min-height: 38px;
        gap: 6px;
        padding: 5px;
        max-width: 78px;
        overflow: visible;
        justify-content: center;
      }

      .auth-status {
        display: none;
      }

      .auth-box .ghost-btn {
        display: none;
      }

      .btn {
        min-height: 29px;
        padding: 0 10px;
        font-size: 12px;
      }

      .auth-box .btn {
        min-width: 58px;
      }

      .text-scene {
        min-height: 100svh;
        align-items: start;
        padding: 112px 16px 60svh;
      }

      .story-copy {
        padding: 106px 16px 55svh;
        align-items: start;
      }

      .story-copy-inner {
        max-width: 100%;
      }

      .hero-text {
        padding-top: 104px;
        padding-bottom: 34px;
      }

      h1 {
        font-size: clamp(48px, 15vw, 66px);
      }

      h2 {
        max-width: 92vw;
        font-size: clamp(42px, 14.5vw, 64px);
        line-height: .98;
      }

      .story-narrative {
        gap: 8px;
        max-width: min(360px, 88vw);
        margin-top: 16px;
        font-size: clamp(14px, 3.65vw, 16px);
        line-height: 1.58;
      }

      .story-narrative::before {
        width: 72px;
        margin-bottom: 2px;
      }

      .copy {
        margin-top: 18px;
        font-size: 15px;
        line-height: 1.72;
      }

      .visual {
        top: 40svh;
        bottom: auto;
        min-height: min(300px, 35svh);
      }

      .exhibit-space::before {
        background-size: 68px 68px, 68px 68px;
        opacity: .26;
      }

      .exhibit-space::after {
        inset: 15vh 7vw 18vh 7vw;
        opacity: .28;
      }

      .exhibit-column {
        opacity: .22;
      }

      .exhibit-line {
        opacity: .38;
      }

      .visual-card {
        display: grid;
        padding: 14px;
      }

      .index-number {
        font-size: 34px;
      }

      .visual:hover::before,
      .visual:focus-visible::before {
        transform: scale(1.015);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader" aria-live="polite">
    <div class="loader-card">
      <div class="loader-top">
        <span class="loader-title">正在加载 nuonuo</span>
        <span id="loaderPercent">0%</span>
      </div>
      <div class="loader-track"><div class="loader-bar" id="loaderBar"></div></div>
    </div>
  </div>

  <div class="site-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span><span>nuonuo</span></div>
      <div class="topbar-right">
        <nav class="section-nav" id="sectionNav" aria-label="章节导航"></nav>
        <div class="auth-box" id="authBox"></div>
      </div>
    </header>

    <main class="text-track" id="textTrack">
      <section class="text-scene hero-text" id="top">
        <div class="text-copy">
          <h1><span>nuonuo</span><span>小窝</span></h1>
        </div>
      </section>
      <section class="story-pin" id="storyPin" aria-label="入口故事舞台">
        <div class="exhibit-space" aria-hidden="true">
          <span class="exhibit-column column-a"></span>
          <span class="exhibit-column column-b"></span>
          <span class="exhibit-line line-a"></span>
          <span class="exhibit-line line-b"></span>
        </div>
        <div class="scroll-stage" id="scrollStage" aria-label="入口图片舞台"></div>
        <div class="story-copy-stage" id="storyCopyStage"></div>
      </section>
    </main>
  </div>

  <div id="authModal" class="auth-modal" aria-hidden="true">
    <div class="auth-modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="auth-modal-head">
        <h3 id="authTitle">登录</h3>
        <p id="authDesc">登录后进入需要权限的内容就不用再次登录了。</p>
      </div>
      <div class="auth-modal-body">
        <div class="auth-field">
          <label for="authUsername">用户名</label>
          <input id="authUsername" class="auth-input" type="text" maxlength="20" placeholder="请输入用户名" autocomplete="username" autocapitalize="off" spellcheck="false" />
        </div>
        <div class="auth-field">
          <label for="authPassword">密码</label>
          <input id="authPassword" class="auth-input" type="password" maxlength="50" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <div class="auth-field" id="authPassword2Wrap" style="display:none;">
          <label for="authPassword2">确认密码</label>
          <input id="authPassword2" class="auth-input" type="password" maxlength="50" placeholder="再次输入密码" autocomplete="new-password" />
        </div>
        <div class="auth-modal-actions">
          <button class="ok" id="authSubmitBtn" type="button">登录</button>
          <button class="cancel" id="authCancelBtn" type="button">取消</button>
        </div>
        <div class="auth-switch" id="authSwitchBtn">没有账号？去注册</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5/dist/cos-js-sdk-v5.min.js"></script>
  <script src="./assets/site-auth.js"></script>
  <script src="./assets/vendor/gsap/gsap.min.js"></script>
  <script src="./assets/vendor/gsap/ScrollTrigger.min.js"></script>
  <script>
    const shared = window.NuonuoShared;
    const getCurrentUser = shared.getCurrentUser;
    const getUserByName = shared.getUserByName;
    const createPasswordRecord = shared.createPasswordRecord;
    const verifyPassword = shared.verifyPassword;
    const upgradePasswordIfNeeded = shared.upgradePasswordIfNeeded;
    const putJsonToCos = shared.putJsonToCos;
    const makeUserKey = shared.makeUserKey;
    const setCurrentUser = (user) => {
      shared.setCurrentUser(user, { notify: false });
      renderAuthState();
    };

    const sectionImageSources = [
      './assets/work/photo-wall.webp',
      './assets/work/anniversary.webp',
      './assets/work/message-wall.webp',
      './assets/work/heart-game.webp',
      './assets/work/coco-diary.webp',
      './assets/work/drink-game.webp',
      './assets/work/nuonuo-academy.webp'
    ];

    const sections = [
      {
        key: 'photo',
        title: '照片墙',
        href: './photo.html',
        image: 1,
        story: [
          '把喜欢的瞬间收进同一面玻璃墙。',
          '每一张照片，都是重新回到那天的入口。'
        ]
      },
      {
        key: 'days',
        title: '纪念日',
        href: './days.html',
        image: 2,
        story: [
          '重要的日子不只被记住，也被认真陈列。',
          '时间向前走，纪念会在这里慢慢发光。'
        ]
      },
      {
        key: 'message',
        title: '留言墙',
        href: './message.html',
        image: 3,
        story: [
          '把想说的话放下来，让它们安静地留在墙上。',
          '短短几行字，也可以成为很久以后的证据。'
        ]
      },
      {
        key: 'game',
        title: '爱心小游戏',
        href: './game.html',
        image: 4,
        requiresAuth: true,
        story: [
          '用一点点互动，把心情变成可以点击的小游戏。',
          '登录后进入，进度和惊喜都会继续留着。'
        ]
      },
      {
        key: 'pet',
        title: 'CoCo日记',
        href: './pet.html',
        image: 5,
        requiresAuth: true,
        story: [
          '记录 CoCo 的小动作、小情绪和每天的可爱。',
          '像一本轻轻翻开的日记，只给熟悉的人看。'
        ]
      },
      {
        key: 'drink',
        title: '酒桌游戏',
        href: './drinkgame.html',
        image: 6,
        story: [
          '把聚会里的热闹变成随手可开的游戏局。',
          '规则简单一点，气氛就可以更快到位。'
        ]
      },
      {
        key: 'video',
        title: 'nuonuo学堂',
        href: './video.html',
        image: 7,
        story: [
          '把学习、资料和视频课程收进一块轻盈的屏幕。',
          '需要的时候打开，就能继续上一段进度。'
        ]
      }
    ];

    const authBox = document.getElementById('authBox');
    const authModal = document.getElementById('authModal');
    const authTitle = document.getElementById('authTitle');
    const authDesc = document.getElementById('authDesc');
    const authUsername = document.getElementById('authUsername');
    const authPassword = document.getElementById('authPassword');
    const authPassword2 = document.getElementById('authPassword2');
    const authPassword2Wrap = document.getElementById('authPassword2Wrap');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authCancelBtn = document.getElementById('authCancelBtn');
    const authSwitchBtn = document.getElementById('authSwitchBtn');
    const scrollStage = document.getElementById('scrollStage');
    const storyPin = document.getElementById('storyPin');
    const storyCopyStage = document.getElementById('storyCopyStage');
    const textTrack = document.getElementById('textTrack');
    const sectionNav = document.getElementById('sectionNav');
    const loader = document.getElementById('loader');
    const loaderBar = document.getElementById('loaderBar');
    const loaderPercent = document.getElementById('loaderPercent');
    let pendingRedirect = null;
    let progress = 0;
    let storyScrollTrigger = null;
    let storyNavProgress = null;

    function setProgress(value) {
      progress = Math.max(progress, Math.min(100, value));
      loaderBar.style.width = `${progress}%`;
      loaderPercent.textContent = `${Math.round(progress)}%`;
    }

    function finishLoading() {
      setProgress(100);
      setTimeout(() => loader.classList.add('is-done'), 180);
      setTimeout(() => {
        document.body.classList.add('site-ready');
        if (window.ScrollTrigger) {
          setTimeout(() => ScrollTrigger.refresh(), 80);
        }
      }, 760);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizeUsername(name) {
      return String(name || '').trim();
    }

    function setAuthMode(mode) {
      const isRegister = mode === 'register';
      authModal.dataset.mode = mode;
      authTitle.textContent = isRegister ? '注册' : '登录';
      authDesc.textContent = isRegister ? '注册后即可使用同一账号进入各个页面。' : '登录后可打开小游戏并保存你的进度。';
      authSubmitBtn.textContent = isRegister ? '注册' : '登录';
      authSwitchBtn.textContent = isRegister ? '已有账号？去登录' : '没有账号？去注册';
      authPassword2Wrap.style.display = isRegister ? '' : 'none';
      authPassword.value = '';
      authPassword2.value = '';
    }

    function openAuthModal(mode = 'login') {
      setAuthMode(mode);
      authModal.classList.add('show');
      authModal.setAttribute('aria-hidden', 'false');
      setTimeout(() => authUsername.focus(), 0);
    }

    function closeAuthModal() {
      authModal.classList.remove('show');
      authModal.setAttribute('aria-hidden', 'true');
    }

    function renderAuthState() {
      const user = getCurrentUser();
      if (user) {
        authBox.innerHTML = `
          <div class="auth-status">当前登录：${escapeHtml(user.username)}</div>
          <button class="btn danger-btn logout-btn" id="logoutBtn" type="button">退出登录</button>
        `;
      } else {
        authBox.innerHTML = `
          <div class="auth-status">未登录</div>
          <button class="btn primary-btn" id="loginBtn" type="button">登录</button>
          <button class="btn ghost-btn" id="registerBtn" type="button">注册</button>
        `;
      }

      const loginBtn = document.getElementById('loginBtn');
      const registerBtn = document.getElementById('registerBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      if (loginBtn) loginBtn.onclick = () => openAuthModal('login');
      if (registerBtn) registerBtn.onclick = () => openAuthModal('register');
      if (logoutBtn) {
        logoutBtn.onclick = () => {
          if (!confirm('确定要退出登录吗？')) return;
          setCurrentUser(null);
          alert('已退出登录');
        };
      }
    }

    function enterSection(section) {
      if (section.requiresAuth && !getCurrentUser()) {
        pendingRedirect = section.href;
        openAuthModal('login');
        return;
      }
      location.href = section.href;
    }

    function renderStoryLines(lines) {
      return (lines || [])
        .map(line => `
          <span class="reveal-line">
            <span class="reveal-text">${escapeHtml(line)}</span>
          </span>
        `)
        .join('');
    }

    function buildSections() {
      sections.forEach((section, index) => {
        const number = section.number || String(index + 1).padStart(2, '0');
        const layer = document.createElement('section');
        layer.className = 'entry-layer';
        layer.id = section.key;
        layer.dataset.key = section.key;
        layer.setAttribute('aria-label', section.title);
        layer.innerHTML = `
          <div class="visual section-image-${section.image}" role="button" tabindex="-1" aria-label="进入${section.title}">
            <div class="visual-card">
              <div><strong>${section.title}</strong></div>
              <div class="index-number">${number}</div>
            </div>
          </div>
        `;
        const visual = layer.querySelector('.visual');
        visual.addEventListener('click', () => enterSection(section));
        visual.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          enterSection(section);
        });
        scrollStage.appendChild(layer);

        const textScene = document.createElement('section');
        textScene.className = 'story-copy';
        textScene.dataset.key = section.key;
        textScene.innerHTML = `
          <div class="story-copy-inner section-copy">
            <h2 class="story-title-mask"><span class="story-title-text">${escapeHtml(section.title)}</span></h2>
            <div class="story-narrative" aria-label="${escapeHtml(section.title)}介绍">
              ${renderStoryLines(section.story)}
            </div>
          </div>
        `;
        storyCopyStage.appendChild(textScene);
        section.titleText = textScene.querySelector('.story-title-text');
        section.storyLines = Array.from(textScene.querySelectorAll('.reveal-text'));

        const dot = document.createElement('button');
        dot.className = 'nav-dot';
        dot.type = 'button';
        dot.textContent = String(index + 1);
        dot.setAttribute('aria-label', section.title);
        dot.addEventListener('click', () => {
          scrollToStoryIndex(index);
        });
        sectionNav.appendChild(dot);
        section.layer = layer;
        section.visual = visual;
        section.textScene = textScene;
        section.dot = dot;
      });
    }

    function clamp(value, min = 0, max = 1) {
      return Math.min(max, Math.max(min, value));
    }

    function smoothstep(edge0, edge1, value) {
      const x = clamp((value - edge0) / (edge1 - edge0));
      return x * x * (3 - 2 * x);
    }

    function setupScrollStory() {
      let ticking = false;

      const update = () => {
        const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
        const viewportCenter = viewportHeight * .5;
        let activeIndex = 0;
        let nearestDistance = Infinity;

        sections.forEach((section, index) => {
          const rect = section.textScene.getBoundingClientRect();
          const sceneCenter = rect.top + rect.height * .5;
          const distance = Math.abs(sceneCenter - viewportCenter);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            activeIndex = index + 1;
          }
        });

        sections.forEach((section, index) => {
          const rect = section.textScene.getBoundingClientRect();
          const sceneCenter = rect.top + rect.height * .5;
          const normalizedDistance = Math.abs(sceneCenter - viewportCenter) / Math.max(1, viewportHeight);
          const visualOpacity = 1 - smoothstep(.28, .68, normalizedDistance);
          const isActive = activeIndex === index + 1 && visualOpacity > .42;
          section.layer.style.setProperty('--layer-opacity', visualOpacity.toFixed(3));
          section.layer.style.setProperty('--visual-opacity', visualOpacity.toFixed(3));
          section.layer.style.setProperty('--visual-scale', (0.992 + visualOpacity * .008).toFixed(3));
          section.layer.style.setProperty('--layer-z', String(Math.round(visualOpacity * 100) + 1));
          section.textScene.style.opacity = visualOpacity.toFixed(3);
          section.textScene.style.visibility = visualOpacity > .04 ? 'visible' : 'hidden';
          section.layer.classList.toggle('is-active', isActive);
          section.visual.tabIndex = isActive ? 0 : -1;
          section.dot.classList.toggle('is-active', isActive);
        });
        ticking = false;
      };

      const requestUpdate = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(update);
      };

      update();
      window.addEventListener('scroll', requestUpdate, { passive: true });
      window.addEventListener('resize', requestUpdate, { passive: true });
      window.addEventListener('load', requestUpdate, { once: true });
    }

    function setActiveStory(index) {
      const activeIndex = Math.max(0, Math.min(sections.length - 1, index));
      sections.forEach((section, sectionIndex) => {
        const isActive = sectionIndex === activeIndex;
        section.layer.classList.toggle('is-active', isActive);
        section.layer.style.setProperty('--layer-z', isActive ? '100' : String(sectionIndex + 1));
        section.visual.tabIndex = isActive ? 0 : -1;
        section.visual.setAttribute('aria-hidden', String(!isActive));
        section.textScene.setAttribute('aria-hidden', String(!isActive));
        section.dot.classList.toggle('is-active', isActive);
      });
    }

    function getStorySnapProgress(index) {
      const clamped = Math.max(0, Math.min(sections.length - 1, index));
      if (sections.length <= 1 || clamped === 0) return 0;
      return (clamped + 0.14) / sections.length;
    }

    function scrollToStoryIndex(index) {
      if (storyScrollTrigger) {
        const clamped = Math.max(0, Math.min(sections.length - 1, index));
        const progressTarget = getStorySnapProgress(clamped);
        const y = storyScrollTrigger.start + (storyScrollTrigger.end - storyScrollTrigger.start) * progressTarget;
        storyNavProgress = progressTarget;
        window.scrollTo({ top: y, left: 0, behavior: 'auto' });
        if (storyScrollTrigger.animation) {
          storyScrollTrigger.animation.progress(progressTarget);
        }
        storyScrollTrigger.update();
        requestAnimationFrame(() => {
          if (storyScrollTrigger.animation) {
            storyScrollTrigger.animation.progress(progressTarget);
          }
          storyScrollTrigger.update();
          setActiveStory(clamped);
        });
        setActiveStory(clamped);
        return;
      }
      setActiveStory(index);
      storyPin.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function setupGsapStory() {
      if (!window.gsap || !window.ScrollTrigger) {
        setupScrollStory();
        return;
      }

      gsap.registerPlugin(ScrollTrigger);
      document.body.classList.add('gsap-story');

      const mm = gsap.matchMedia();
      const layerItems = sections.map(section => section.layer);
      const visualItems = sections.map(section => section.visual);
      const copyItems = sections.map(section => section.textScene);
      const cardItems = sections.map(section => section.visual.querySelector('.visual-card'));
      const titleItems = sections.map(section => section.titleText);
      const lineItems = sections.flatMap(section => section.storyLines);
      const exhibitItems = gsap.utils.toArray('.exhibit-column, .exhibit-line');
      mm.add({
        isDesktop: '(min-width: 921px)',
        isMobile: '(max-width: 920px)',
        reduceMotion: '(prefers-reduced-motion: reduce)'
      }, (context) => {
        const { isDesktop, isMobile, reduceMotion } = context.conditions;
        const sceneCount = sections.length;
        const lastIndex = sceneCount - 1;
        const snapPoints = sections.map((section, index) => getStorySnapProgress(index)).concat(1);
        const travel = () => Math.max(window.innerHeight * sceneCount, 1);

        gsap.set(layerItems, { autoAlpha: 0, zIndex: 1 });
        gsap.set(visualItems, {
          autoAlpha: 0,
          y: isMobile ? 34 : 70,
          scale: isMobile ? 0.965 : 0.92,
          rotationX: 0,
          rotationY: 0,
          transformOrigin: '50% 58%'
        });
        gsap.set(copyItems, {
          autoAlpha: 0,
          y: isMobile ? 34 : 86,
          scale: isMobile ? 0.985 : 0.94,
          transformOrigin: '0% 50%'
        });
        gsap.set(titleItems, {
          autoAlpha: 0,
          yPercent: 118
        });
        gsap.set(lineItems, {
          autoAlpha: 0,
          yPercent: 112
        });
        gsap.set(cardItems, {
          autoAlpha: 0,
          y: isMobile ? 16 : 28,
          scale: 0.96
        });
        gsap.set(exhibitItems, {
          autoAlpha: isMobile ? 0.42 : 0.62,
          y: 0,
          x: 0
        });

        gsap.set(layerItems[0], { autoAlpha: 1, zIndex: 100 });
        gsap.set(visualItems[0], { autoAlpha: 1, y: 0, scale: 1, rotationX: 0, rotationY: 0 });
        gsap.set(copyItems[0], { autoAlpha: 1, y: 0, scale: 1 });
        gsap.set(titleItems[0], { autoAlpha: 1, yPercent: 0 });
        gsap.set(cardItems[0], { autoAlpha: 1, y: 0, scale: 1 });
        setActiveStory(0);

        if (reduceMotion) {
          gsap.set(layerItems, { clearProps: 'transform' });
          gsap.set(visualItems, { autoAlpha: 0, clearProps: 'transform' });
          gsap.set(copyItems, { autoAlpha: 0, clearProps: 'transform' });
          gsap.set(titleItems, { autoAlpha: 1, yPercent: 0 });
          gsap.set(lineItems, { autoAlpha: 1, yPercent: 0 });
          gsap.set(layerItems[0], { autoAlpha: 1 });
          gsap.set(visualItems[0], { autoAlpha: 1 });
          gsap.set(copyItems[0], { autoAlpha: 1 });
          return () => {};
        }

        gsap.to(exhibitItems, {
          x: (index) => (index % 2 === 0 ? 10 : -8),
          y: (index) => (index % 2 === 0 ? -8 : 8),
          autoAlpha: isMobile ? 0.34 : 0.52,
          duration: 5.5,
          ease: 'sine.inOut',
          repeat: -1,
          yoyo: true,
          stagger: 0.32
        });

        const tl = gsap.timeline({
          defaults: { ease: 'power2.inOut' },
          scrollTrigger: {
            trigger: storyPin,
            start: 'top top',
            end: () => `+=${travel()}`,
            pin: true,
            scrub: 0.8,
            anticipatePin: 1,
            invalidateOnRefresh: true,
            snap: {
              snapTo: (value) => {
                if (storyNavProgress !== null) {
                  const target = storyNavProgress;
                  storyNavProgress = null;
                  return target;
                }
                return snapPoints.reduce((closest, point) => (
                  Math.abs(point - value) < Math.abs(closest - value) ? point : closest
                ), snapPoints[0]);
              },
              duration: { min: 0.18, max: 0.42 },
              delay: 0.04,
              directional: false,
              inertia: false,
              ease: 'power2.inOut'
            },
            onUpdate: (self) => {
              setActiveStory(Math.floor(self.progress * sceneCount + 0.0001));
            },
            onRefresh: (self) => {
              storyScrollTrigger = self;
              setActiveStory(Math.floor(self.progress * sceneCount + 0.0001));
            }
          }
        });

        sections.forEach((section, index) => {
          const lineStart = index + 0.16;
          const lineGap = isMobile ? 0.2 : 0.22;
          const lineDuration = isMobile ? 0.34 : 0.38;

          section.storyLines.forEach((line, lineIndex) => {
            tl.to(line, {
              autoAlpha: 1,
              yPercent: 0,
              duration: lineDuration,
              ease: 'power3.out'
            }, lineStart + lineIndex * lineGap);
          });
        });

        for (let i = 0; i < lastIndex; i += 1) {
          const current = sections[i];
          const next = sections[i + 1];
          const at = i + 0.78;
          const nextTilt = isDesktop ? (i % 2 === 0 ? -4 : 4) : 0;

          tl.set(next.layer, { zIndex: 100 + i + 1 }, at - 0.02)
            .to(current.storyLines.slice().reverse(), {
              autoAlpha: 0,
              yPercent: -112,
              duration: 0.42,
              stagger: isMobile ? 0.035 : 0.055,
              ease: 'power3.inOut'
            }, at)
            .to(current.titleText, {
              autoAlpha: 0,
              yPercent: -116,
              duration: 0.5,
              ease: 'power3.inOut'
            }, at + 0.06)
            .to(current.textScene, {
              autoAlpha: 0,
              y: isMobile ? -28 : -70,
              scale: isMobile ? 0.985 : 0.94,
              duration: 0.42
            }, at + 0.08)
            .to(current.visual, {
              autoAlpha: 0,
              y: isMobile ? -16 : -54,
              scale: isMobile ? 1.045 : 1.09,
              rotationY: isDesktop ? -nextTilt : 0,
              duration: 0.48
            }, at + 0.02)
            .to(current.layer, { autoAlpha: 0, duration: 0.38 }, at + 0.1)
            .fromTo(next.layer,
              { autoAlpha: 0 },
              { autoAlpha: 1, duration: 0.26 },
              at + 0.04
            )
            .fromTo(next.visual,
              {
                autoAlpha: 0,
                y: isMobile ? 38 : 76,
                scale: isMobile ? 0.955 : 0.9,
                rotationX: isDesktop ? 2 : 0,
                rotationY: isDesktop ? nextTilt : 0
              },
              {
                autoAlpha: 1,
                y: 0,
                scale: 1,
                rotationX: 0,
                rotationY: 0,
                duration: 0.34
              },
              at + 0.06
            )
            .fromTo(next.textScene,
              {
                autoAlpha: 0,
                y: isMobile ? 36 : 92,
                scale: isMobile ? 0.985 : 0.93
              },
              {
                autoAlpha: 1,
                y: 0,
                scale: 1,
                duration: 0.22
              },
              at + 0.08
            )
            .fromTo(next.titleText,
              {
                autoAlpha: 0,
                yPercent: 118
              },
              {
                autoAlpha: 1,
                yPercent: 0,
                duration: 0.2,
                ease: 'power3.out'
              },
              at + 0.08
            )
            .fromTo(next.visual.querySelector('.visual-card'),
              {
                autoAlpha: 0,
                y: isMobile ? 16 : 30,
                scale: 0.96
              },
              {
                autoAlpha: 1,
                y: 0,
                scale: 1,
                duration: 0.26
              },
              at + 0.12
            );
        }

        tl.to({}, { duration: 0.01 }, sceneCount);
        storyScrollTrigger = tl.scrollTrigger;

        return () => {
          storyScrollTrigger = null;
          gsap.killTweensOf([exhibitItems, titleItems, lineItems]);
          tl.kill();
        };
      });
    }

    function setupMotion() {
      window.addEventListener('pointermove', (event) => {
        const mx = (event.clientX / window.innerWidth - .5) * 2;
        const my = (event.clientY / window.innerHeight - .5) * 2;
        document.body.style.setProperty('--mx', mx.toFixed(3));
        document.body.style.setProperty('--my', my.toFixed(3));
      }, { passive: true });
    }

    authCancelBtn.addEventListener('click', () => {
      pendingRedirect = null;
      closeAuthModal();
    });

    authSwitchBtn.addEventListener('click', () => {
      const mode = authModal.dataset.mode === 'register' ? 'login' : 'register';
      setAuthMode(mode);
    });

    authSubmitBtn.addEventListener('click', async () => {
      const mode = authModal.dataset.mode || 'login';
      const username = sanitizeUsername(authUsername.value);
      const password = authPassword.value;
      const password2 = authPassword2.value;

      if (!username || !password) {
        alert('请输入用户名和密码');
        return;
      }
      if (username.length < 2) {
        alert('用户名至少 2 个字符');
        return;
      }

      if (mode === 'register') {
        if (password.length < 4) {
          alert('密码至少 4 位');
          return;
        }
        if (password !== password2) {
          alert('两次密码不一致');
          return;
        }
        try {
          const oldUser = await getUserByName(username);
          if (oldUser) {
            alert('这个用户名已经存在了');
            return;
          }
          const userData = {
            username,
            ...(await createPasswordRecord(password)),
            createdAt: new Date().toISOString()
          };
          await putJsonToCos(makeUserKey(username), userData);
          setCurrentUser({ username });
          closeAuthModal();
          alert('注册成功，已自动登录');
          if (pendingRedirect) {
            const target = pendingRedirect;
            pendingRedirect = null;
            setTimeout(() => { location.href = target; }, 120);
          }
        } catch (err) {
          console.error(err);
          alert('注册失败，请检查密钥、Bucket、Region、CORS 或网络');
        }
        return;
      }

      try {
        const userData = await getUserByName(username);
        if (!userData || !(await verifyPassword(userData, password))) {
          alert('用户名或密码错误');
          return;
        }
        try {
          await upgradePasswordIfNeeded(userData, password);
        } catch (upgradeErr) {
          console.warn('密码记录升级失败，将继续登录', upgradeErr);
        }
        setCurrentUser({ username });
        closeAuthModal();
        alert('登录成功');
        if (pendingRedirect) {
          const target = pendingRedirect;
          pendingRedirect = null;
          setTimeout(() => { location.href = target; }, 120);
        }
      } catch (err) {
        console.error(err);
        alert('登录失败，请检查密钥、Bucket、Region、CORS 或网络');
      }
    });

    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) {
        pendingRedirect = null;
        closeAuthModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        pendingRedirect = null;
        closeAuthModal();
      }
    });

    setProgress(18);
    buildSections();
    setProgress(42);
    renderAuthState();
    setupGsapStory();
    setupMotion();
    setProgress(68);

    let loadedImages = 0;
    let loadFinished = false;

    function finishLoadingOnce() {
      if (loadFinished) return;
      loadFinished = true;
      finishLoading();
    }

    const imagePreloads = sectionImageSources.map((src) => new Promise((resolve) => {
      const image = new Image();
      image.decoding = 'async';
      image.onload = async () => {
        try {
          if (image.decode) await image.decode();
        } catch {}
        loadedImages += 1;
        setProgress(68 + Math.round((loadedImages / sectionImageSources.length) * 22));
        resolve();
      };
      image.onerror = () => {
        loadedImages += 1;
        setProgress(68 + Math.round((loadedImages / sectionImageSources.length) * 22));
        resolve();
      };
      image.src = src;
    }));

    Promise.all(imagePreloads).then(finishLoadingOnce);
    window.addEventListener('load', () => setProgress(86), { once: true });
  </script>
</body>
</html>
