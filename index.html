<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>nuonuo小窝</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030508;
      --text: #f7fbff;
      --muted: rgba(226, 238, 255, .64);
      --line: rgba(255, 255, 255, .15);
      --glass: rgba(5, 9, 16, .42);
      --glass-strong: rgba(10, 16, 26, .78);
      --cyan: #8fe9ff;
      --gold: #f4c982;
      --danger: #ff6978;
      --shadow: 0 24px 80px rgba(0, 0, 0, .38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100dvh;
      position: relative;
      isolation: isolate;
    }

    button,
    input {
      font: inherit;
    }

    .experience {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 52%, rgba(63, 199, 255, .18), transparent 34%),
        radial-gradient(circle at 78% 22%, rgba(244, 201, 130, .1), transparent 28%),
        linear-gradient(180deg, #03050a 0%, #05070d 48%, #010205 100%);
    }

    .experience::before,
    .experience::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .experience::before {
      background:
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 74px 74px;
      mask-image: radial-gradient(circle at 50% 52%, rgba(0,0,0,.7), transparent 66%);
      opacity: .55;
      transform: translate3d(calc(var(--mx, 0) * -10px), calc(var(--my, 0) * -8px), 0);
    }

    .experience::after {
      background:
        radial-gradient(circle at 50% 52%, transparent 0 46%, rgba(0,0,0,.42) 78%, rgba(0,0,0,.82) 100%),
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 18%, transparent 75%, rgba(255,255,255,.04));
      mix-blend-mode: normal;
    }

    .webgl {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .brand {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      color: rgba(247, 251, 255, .9);
      letter-spacing: 0;
      text-shadow: 0 1px 22px rgba(143, 233, 255, .18);
    }

    .brand-mark {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow:
        0 0 10px rgba(255, 255, 255, .95),
        0 0 34px rgba(143, 233, 255, .66),
        0 0 72px rgba(244, 201, 130, .3);
    }

    .brand-name {
      font-size: clamp(15px, 1.4vw, 18px);
      font-weight: 650;
    }

    .auth-box {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 20;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(7, 12, 20, .44);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      pointer-events: auto;
    }

    .auth-status {
      max-width: min(34vw, 190px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 4px 0 10px;
      color: rgba(247, 251, 255, .72);
      font-size: 13px;
      line-height: 1;
    }

    .btn {
      min-height: 28px;
      border: 0;
      border-radius: 999px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      cursor: pointer;
      background: rgba(255, 255, 255, .1);
      transition: transform .18s ease, background .18s ease, opacity .18s ease;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, .18);
    }

    .primary-btn {
      background: rgba(255, 255, 255, .9);
      color: #07101b;
    }

    .ghost-btn {
      border: 1px solid rgba(255,255,255,.16);
    }

    .danger-btn {
      color: #ffeef1;
      background: rgba(255, 105, 120, .16);
    }

    .portal {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 9;
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: transparent;
      color: var(--text);
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
      transform: translate(-50%, -50%) scale(var(--portal-scale, 1));
      opacity: var(--portal-opacity, 1);
      transition: opacity .18s ease, filter .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .portal::before,
    .portal::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .portal::before {
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, .98);
      box-shadow:
        0 0 12px rgba(255, 255, 255, 1),
        0 0 34px rgba(143, 233, 255, .82),
        0 0 76px rgba(244, 201, 130, .34);
      animation: blink 1.7s ease-in-out infinite;
    }

    .portal::after {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, .28);
      box-shadow: inset 0 0 20px rgba(143, 233, 255, .08);
      opacity: .76;
      animation: ring 2.4s ease-in-out infinite;
    }

    .portal:hover,
    .portal.is-active,
    .portal:focus-visible {
      filter: brightness(1.35);
      outline: none;
    }

    .portal:hover::after,
    .portal.is-active::after,
    .portal:focus-visible::after {
      border-color: rgba(255, 255, 255, .72);
      box-shadow:
        inset 0 0 22px rgba(143, 233, 255, .16),
        0 0 34px rgba(255, 255, 255, .18);
    }

    .portal-label {
      position: absolute;
      left: 50%;
      top: calc(50% + 34px);
      transform: translate(-50%, 10px);
      min-width: max-content;
      max-width: 132px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(6, 10, 17, .64);
      color: rgba(247, 251, 255, .92);
      box-shadow: 0 14px 42px rgba(0, 0, 0, .32);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 13px;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      white-space: nowrap;
    }

    .portal:hover .portal-label,
    .portal.is-active .portal-label,
    .portal:focus-visible .portal-label {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes blink {
      0%, 100% { opacity: .72; transform: translate(-50%, -50%) scale(.88); }
      45% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      62% { opacity: .5; transform: translate(-50%, -50%) scale(.78); }
    }

    @keyframes ring {
      0%, 100% { opacity: .34; transform: translate(-50%, -50%) scale(.9); }
      50% { opacity: .76; transform: translate(-50%, -50%) scale(1.1); }
    }

    .scene-caption {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 7;
      width: min(420px, calc(100vw - 36px));
      transform: translateX(-50%);
      pointer-events: none;
      text-align: center;
      color: rgba(247, 251, 255, .48);
      font-size: clamp(12px, 1.2vw, 14px);
      line-height: 1.5;
    }

    .scene-caption span {
      color: rgba(247, 251, 255, .82);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, .62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .auth-modal.show {
      display: flex;
    }

    .auth-modal-card {
      width: min(420px, 100%);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .16);
      background:
        linear-gradient(180deg, rgba(16, 24, 36, .96), rgba(7, 10, 17, .94));
      color: var(--text);
      box-shadow: 0 30px 110px rgba(0, 0, 0, .58);
      overflow: hidden;
    }

    .auth-modal-head {
      padding: 24px 24px 10px;
    }

    .auth-modal-head h3 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 720;
    }

    .auth-modal-head p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .auth-modal-body {
      padding: 12px 24px 24px;
    }

    .auth-field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    .auth-field label {
      color: rgba(247, 251, 255, .72);
      font-size: 13px;
    }

    .auth-input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      min-height: 43px;
      padding: 0 12px;
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      outline: none;
    }

    .auth-input:focus {
      border-color: rgba(143, 233, 255, .64);
      box-shadow: 0 0 0 4px rgba(143, 233, 255, .12);
    }

    .auth-modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .auth-modal-actions button {
      flex: 1;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
    }

    .auth-modal-actions .ok {
      background: rgba(255, 255, 255, .92);
      color: #07101b;
    }

    .auth-modal-actions .cancel {
      background: rgba(255, 255, 255, .1);
    }

    .auth-switch {
      margin-top: 14px;
      color: rgba(143, 233, 255, .86);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .fallback {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 48%, rgba(143, 233, 255, .2), transparent 30%),
        #030508;
      color: rgba(247, 251, 255, .75);
      line-height: 1.7;
    }

    .no-webgl .fallback {
      display: flex;
    }

    @media (max-width: 720px) {
      .brand {
        top: max(12px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
      }

      .auth-box {
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        gap: 6px;
        padding: 6px;
      }

      .auth-status {
        display: none;
      }

      .btn {
        min-height: 30px;
        padding: 0 10px;
        font-size: 12px;
      }

      .portal {
        width: 70px;
        height: 70px;
      }

      .portal-label {
        top: calc(50% + 38px);
        font-size: 12px;
        max-width: 116px;
      }

      .scene-caption {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .portal::before,
      .portal::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="experience" id="experience" aria-label="nuonuo小窝主页">
    <canvas class="webgl" id="webgl" aria-hidden="true"></canvas>
    <div class="fallback">你的设备暂时无法打开 3D 首页，仍可以通过页面入口进入功能。</div>
  </main>

  <div class="ui-layer" id="portalLayer" aria-label="功能入口"></div>

  <div class="brand" aria-hidden="true">
    <span class="brand-mark"></span>
    <span class="brand-name">nuonuo</span>
  </div>

  <div class="auth-box" id="authBox"></div>
  <div class="scene-caption"><span>move</span> to bend the field · <span>tap</span> a light point</div>

  <div id="authModal" class="auth-modal" aria-hidden="true">
    <div class="auth-modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="auth-modal-head">
        <h3 id="authTitle">登录</h3>
        <p id="authDesc">登录后进入需要权限的内容就不用再次登录了。</p>
      </div>
      <div class="auth-modal-body">
        <div class="auth-field">
          <label for="authUsername">用户名</label>
          <input id="authUsername" class="auth-input" type="text" maxlength="20" placeholder="请输入用户名" autocomplete="username" autocapitalize="off" spellcheck="false" />
        </div>
        <div class="auth-field">
          <label for="authPassword">密码</label>
          <input id="authPassword" class="auth-input" type="password" maxlength="50" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <div class="auth-field" id="authPassword2Wrap" style="display:none;">
          <label for="authPassword2">确认密码</label>
          <input id="authPassword2" class="auth-input" type="password" maxlength="50" placeholder="再次输入密码" autocomplete="new-password" />
        </div>
        <div class="auth-modal-actions">
          <button class="ok" id="authSubmitBtn" type="button">登录</button>
          <button class="cancel" id="authCancelBtn" type="button">取消</button>
        </div>
        <div class="auth-switch" id="authSwitchBtn">没有账号？去注册</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5/dist/cos-js-sdk-v5.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <script>
    const SECRET_ID = 'AKIDhojT7ey61jEkHhw0830qVyGUWSDpFnEW';
    const SECRET_KEY = 'GNIAMaieZyOehhWBi9QWUL4czCHAsQuG';
    const BUCKET = 'photoalbum-123456-1395234423';
    const REGION = 'ap-beijing';

    const AUTH_USER_PREFIX = 'users/';
    const LS_CURRENT_USER = 'site_current_user_v1';
    const cos = window.COS ? new COS({ SecretId: SECRET_ID, SecretKey: SECRET_KEY }) : null;

    const entries = [
      { key: 'photo', label: '照片墙', href: './photo.html', position: [-3.8, .82, .15], accent: 0x8fe9ff },
      { key: 'days', label: '纪念日', href: './days.html', position: [-2.15, 1.64, -.45], accent: 0xf4c982 },
      { key: 'message', label: '留言墙', href: './message.html', position: [-.68, .2, .45], accent: 0xffffff },
      { key: 'game', label: '爱心小游戏', href: './game.html', requiresAuth: true, position: [.82, 1.74, -.38], accent: 0xff9fb4 },
      { key: 'pet', label: 'CoCo日记', href: './pet.html', requiresAuth: true, position: [2.28, .34, .18], accent: 0xc8f7ff },
      { key: 'drink', label: '酒桌游戏', href: './drinkgame.html', position: [3.55, 1.14, -.18], accent: 0xf8ddaa },
      { key: 'video', label: '视频快放', href: './video.html', position: [.18, 2.62, -.72], accent: 0x9ea8ff }
    ];
    window.homeEntries = entries;

    const authBox = document.getElementById('authBox');
    const authModal = document.getElementById('authModal');
    const authTitle = document.getElementById('authTitle');
    const authDesc = document.getElementById('authDesc');
    const authUsername = document.getElementById('authUsername');
    const authPassword = document.getElementById('authPassword');
    const authPassword2 = document.getElementById('authPassword2');
    const authPassword2Wrap = document.getElementById('authPassword2Wrap');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authCancelBtn = document.getElementById('authCancelBtn');
    const authSwitchBtn = document.getElementById('authSwitchBtn');
    const portalLayer = document.getElementById('portalLayer');
    let pendingRedirect = null;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizeUsername(name) {
      return String(name || '').trim();
    }

    const PASSWORD_ITERATIONS = 120000;

    function bytesToBase64(bytes) {
      let binary = '';
      bytes.forEach((byte) => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function hashPassword(password, saltBase64) {
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(password),
        'PBKDF2',
        false,
        ['deriveBits']
      );
      const bits = await crypto.subtle.deriveBits({
        name: 'PBKDF2',
        hash: 'SHA-256',
        salt: base64ToBytes(saltBase64),
        iterations: PASSWORD_ITERATIONS,
      }, keyMaterial, 256);
      return bytesToBase64(new Uint8Array(bits));
    }

    async function createPasswordRecord(password) {
      const salt = new Uint8Array(16);
      crypto.getRandomValues(salt);
      const passwordSalt = bytesToBase64(salt);
      return {
        passwordAlgo: 'PBKDF2-SHA256',
        passwordIterations: PASSWORD_ITERATIONS,
        passwordSalt,
        passwordHash: await hashPassword(password, passwordSalt),
      };
    }

    async function verifyPassword(user, password) {
      if (!user) return false;
      if (user.passwordHash && user.passwordSalt) {
        return await hashPassword(password, user.passwordSalt) === user.passwordHash;
      }
      return typeof user.password === 'string' && user.password === password;
    }

    async function upgradePasswordIfNeeded(user, password) {
      if (!user || user.passwordHash || user.password !== password) return;
      const upgradedUser = {
        ...user,
        ...(await createPasswordRecord(password)),
      };
      delete upgradedUser.password;
      await putJsonToCos(makeUserKey(user.username), upgradedUser);
    }

    function getCurrentUser() {
      try {
        const raw = localStorage.getItem(LS_CURRENT_USER);
        if (!raw) return null;
        const user = JSON.parse(raw);
        if (!user || !user.username) return null;
        return user;
      } catch {
        return null;
      }
    }

    function setCurrentUser(user) {
      if (!user) {
        localStorage.removeItem(LS_CURRENT_USER);
      } else {
        localStorage.setItem(LS_CURRENT_USER, JSON.stringify(user));
      }
      renderAuthState();
    }

    function makeUserKey(username) {
      return `${AUTH_USER_PREFIX}${encodeURIComponent(username)}.json`;
    }

    function putJsonToCos(key, obj) {
      if (!cos) return Promise.reject(new Error('COS SDK 未加载'));
      return new Promise((resolve, reject) => {
        cos.putObject({
          Bucket: BUCKET,
          Region: REGION,
          Key: key,
          Body: JSON.stringify(obj, null, 2),
          ContentType: 'application/json; charset=utf-8',
        }, function (err, data) {
          if (err) return reject(err);
          resolve(data);
        });
      });
    }

    function getObjectText(key) {
      if (!cos) return Promise.reject(new Error('COS SDK 未加载'));
      return new Promise((resolve, reject) => {
        cos.getObject({
          Bucket: BUCKET,
          Region: REGION,
          Key: key,
        }, async function (err, data) {
          if (err) return reject(err);
          try {
            const body = data.Body;
            if (typeof body === 'string') return resolve(body);
            if (body instanceof Blob) return resolve(await body.text());
            if (body && typeof body.text === 'function') return resolve(await body.text());
            if (body instanceof ArrayBuffer) {
              return resolve(new TextDecoder('utf-8').decode(body));
            }
            if (ArrayBuffer.isView(body)) {
              return resolve(new TextDecoder('utf-8').decode(body));
            }
            resolve(String(body || ''));
          } catch (e) {
            reject(e);
          }
        });
      });
    }

    async function getUserByName(username) {
      const key = makeUserKey(username);
      try {
        const text = await getObjectText(key);
        return JSON.parse(text);
      } catch (err) {
        if (err && (err.statusCode === 404 || (err.error && err.error.Code === 'NoSuchKey'))) {
          return null;
        }
        if (String(err && err.message || '').includes('404')) return null;
        throw err;
      }
    }

    function setAuthMode(mode) {
      const isRegister = mode === 'register';
      authModal.dataset.mode = mode;
      authTitle.textContent = isRegister ? '注册' : '登录';
      authDesc.textContent = isRegister
        ? '注册后即可使用同一账号进入各个页面。'
        : '登录后可打开小游戏并保存你的进度。';
      authSubmitBtn.textContent = isRegister ? '注册' : '登录';
      authSwitchBtn.textContent = isRegister ? '已有账号？去登录' : '没有账号？去注册';
      authPassword2Wrap.style.display = isRegister ? '' : 'none';
      authPassword.value = '';
      authPassword2.value = '';
    }

    function openAuthModal(mode = 'login') {
      setAuthMode(mode);
      authModal.classList.add('show');
      authModal.setAttribute('aria-hidden', 'false');
      setTimeout(() => authUsername.focus(), 0);
    }

    function closeAuthModal() {
      authModal.classList.remove('show');
      authModal.setAttribute('aria-hidden', 'true');
    }

    function renderAuthState() {
      const user = getCurrentUser();
      if (user) {
        authBox.innerHTML = `
          <div class="auth-status">当前登录：${escapeHtml(user.username)}</div>
          <button class="btn danger-btn logout-btn" id="logoutBtn" type="button">退出登录</button>
        `;
      } else {
        authBox.innerHTML = `
          <div class="auth-status">未登录</div>
          <button class="btn primary-btn" id="loginBtn" type="button">登录</button>
          <button class="btn ghost-btn" id="registerBtn" type="button">注册</button>
        `;
      }

      const loginBtn = document.getElementById('loginBtn');
      const registerBtn = document.getElementById('registerBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      if (loginBtn) loginBtn.onclick = () => openAuthModal('login');
      if (registerBtn) registerBtn.onclick = () => openAuthModal('register');
      if (logoutBtn) {
        logoutBtn.onclick = () => {
          if (!confirm('确定要退出登录吗？')) return;
          setCurrentUser(null);
          alert('已退出登录');
        };
      }
    }

    function navigateEntry(entry) {
      if (entry.requiresAuth && !getCurrentUser()) {
        pendingRedirect = entry.href;
        openAuthModal('login');
        return;
      }
      location.href = entry.href;
    }

    function createPortals() {
      const coarse = window.matchMedia('(hover: none), (pointer: coarse)').matches;
      let activeKey = '';
      let activeTimer = 0;

      entries.forEach((entry) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'portal';
        button.dataset.key = entry.key;
        button.setAttribute('aria-label', entry.label);
        if (entry.requiresAuth) button.dataset.requiresAuth = 'true';
        button.innerHTML = `<span class="sr-only">${entry.label}</span><span class="portal-label">${entry.label}</span>`;
        button.addEventListener('pointerenter', () => button.classList.add('is-active'));
        button.addEventListener('pointerleave', () => button.classList.remove('is-active'));
        button.addEventListener('focus', () => button.classList.add('is-active'));
        button.addEventListener('blur', () => button.classList.remove('is-active'));
        button.addEventListener('click', () => {
          if (coarse && activeKey !== entry.key) {
            activeKey = entry.key;
            document.querySelectorAll('.portal.is-active').forEach((item) => item.classList.remove('is-active'));
            button.classList.add('is-active');
            clearTimeout(activeTimer);
            activeTimer = window.setTimeout(() => {
              activeKey = '';
              button.classList.remove('is-active');
            }, 1300);
            return;
          }
          navigateEntry(entry);
        });
        portalLayer.appendChild(button);
        entry.element = button;
      });
    }

    authCancelBtn.addEventListener('click', () => {
      pendingRedirect = null;
      closeAuthModal();
    });

    authSwitchBtn.addEventListener('click', () => {
      const mode = authModal.dataset.mode === 'register' ? 'login' : 'register';
      setAuthMode(mode);
    });

    authSubmitBtn.addEventListener('click', async () => {
      const mode = authModal.dataset.mode || 'login';
      const username = sanitizeUsername(authUsername.value);
      const password = authPassword.value;
      const password2 = authPassword2.value;

      if (!username || !password) {
        alert('请输入用户名和密码');
        return;
      }

      if (username.length < 2) {
        alert('用户名至少 2 个字符');
        return;
      }

      if (mode === 'register') {
        if (password.length < 4) {
          alert('密码至少 4 位');
          return;
        }
        if (password !== password2) {
          alert('两次密码不一致');
          return;
        }

        try {
          const oldUser = await getUserByName(username);
          if (oldUser) {
            alert('这个用户名已经存在了');
            return;
          }

          const userData = {
            username,
            ...(await createPasswordRecord(password)),
            createdAt: new Date().toISOString()
          };

          await putJsonToCos(makeUserKey(username), userData);
          setCurrentUser({ username });
          closeAuthModal();
          alert('注册成功，已自动登录');

          if (pendingRedirect) {
            const target = pendingRedirect;
            pendingRedirect = null;
            setTimeout(() => {
              location.href = target;
            }, 120);
          }
        } catch (err) {
          console.error(err);
          alert('注册失败，请检查密钥、Bucket、Region、CORS 或网络');
        }
        return;
      }

      try {
        const userData = await getUserByName(username);
        if (!userData || !(await verifyPassword(userData, password))) {
          alert('用户名或密码错误');
          return;
        }
        try {
          await upgradePasswordIfNeeded(userData, password);
        } catch (upgradeErr) {
          console.warn('密码记录升级失败，将继续登录', upgradeErr);
        }
        setCurrentUser({ username });
        closeAuthModal();
        alert('登录成功');

        if (pendingRedirect) {
          const target = pendingRedirect;
          pendingRedirect = null;
          setTimeout(() => {
            location.href = target;
          }, 120);
        }
      } catch (err) {
        console.error(err);
        alert('登录失败，请检查密钥、Bucket、Region、CORS 或网络');
      }
    });

    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) {
        pendingRedirect = null;
        closeAuthModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        pendingRedirect = null;
        closeAuthModal();
      }
    });

    renderAuthState();
    createPortals();
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const canvas = document.getElementById('webgl');
    const experience = document.getElementById('experience');
    const canWebGL = (() => {
      try {
        const test = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (test.getContext('webgl') || test.getContext('experimental-webgl')));
      } catch {
        return false;
      }
    })();

    if (!canWebGL) {
      document.body.classList.add('no-webgl');
    } else {
      const coarse = window.matchMedia('(hover: none), (pointer: coarse)').matches;
      const small = window.matchMedia('(max-width: 720px)').matches;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const memory = navigator.deviceMemory || 4;
      const cores = navigator.hardwareConcurrency || 4;
      const quality = small || memory <= 3 || cores <= 4
        ? 'low'
        : coarse
          ? 'medium'
          : 'high';

      const profile = {
        low: { pixelRatio: 1.05, particles: 900, bloom: false, strands: 5 },
        medium: { pixelRatio: 1.35, particles: 1500, bloom: true, strands: 7 },
        high: { pixelRatio: 1.75, particles: 2400, bloom: true, strands: 9 }
      }[quality];

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: quality !== 'low',
        alpha: false,
        powerPreference: quality === 'low' ? 'default' : 'high-performance'
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030508);
      scene.fog = new THREE.FogExp2(0x030508, .055);

      const camera = new THREE.PerspectiveCamera(42, 1, .1, 80);
      camera.position.set(0, 1.15, 8.2);

      const renderPass = new RenderPass(scene, camera);
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), .72, .56, .06);
      bloomPass.enabled = profile.bloom;
      const composer = new EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);

      const group = new THREE.Group();
      scene.add(group);

      const ambient = new THREE.HemisphereLight(0x9fefff, 0x0b0712, 1.28);
      scene.add(ambient);

      const key = new THREE.PointLight(0x8fe9ff, 34, 18);
      key.position.set(-2.8, 2.2, 3.8);
      scene.add(key);

      const gold = new THREE.PointLight(0xf4c982, 18, 14);
      gold.position.set(3.2, -.4, 2.7);
      scene.add(gold);

      const coreMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xd9fbff,
        emissive: 0x6edcff,
        emissiveIntensity: .42,
        roughness: .18,
        metalness: .36,
        transmission: .18,
        transparent: true,
        opacity: .78
      });
      const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 6), coreMaterial);
      group.add(core);

      const wire = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.25, 2),
        new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: .08 })
      );
      group.add(wire);

      const particleGeometry = new THREE.BufferGeometry();
      const positions = new Float32Array(profile.particles * 3);
      const colors = new Float32Array(profile.particles * 3);
      const colorA = new THREE.Color(0x8fe9ff);
      const colorB = new THREE.Color(0xf4c982);
      const colorC = new THREE.Color(0xffffff);
      for (let i = 0; i < profile.particles; i++) {
        const t = i / profile.particles;
        const angle = t * Math.PI * 12.8;
        const band = Math.sin(t * Math.PI * 6);
        const radius = 1.85 + Math.sin(t * Math.PI * 15) * .42 + Math.random() * 1.35;
        positions[i * 3] = Math.cos(angle) * radius + (Math.random() - .5) * .45;
        positions[i * 3 + 1] = band * 1.35 + (Math.random() - .5) * 2.35;
        positions[i * 3 + 2] = Math.sin(angle) * radius * .62 + (Math.random() - .5) * 1.1;

        const mixed = (i % 5 === 0 ? colorB : i % 7 === 0 ? colorC : colorA).clone();
        mixed.multiplyScalar(.62 + Math.random() * .38);
        colors[i * 3] = mixed.r;
        colors[i * 3 + 1] = mixed.g;
        colors[i * 3 + 2] = mixed.b;
      }
      particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const particles = new THREE.Points(
        particleGeometry,
        new THREE.PointsMaterial({
          size: quality === 'low' ? .026 : .022,
          vertexColors: true,
          transparent: true,
          opacity: .86,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        })
      );
      group.add(particles);

      const strandGroup = new THREE.Group();
      group.add(strandGroup);
      for (let i = 0; i < profile.strands; i++) {
        const points = [];
        const phase = i / profile.strands * Math.PI * 2;
        for (let j = 0; j < 150; j++) {
          const t = j / 149;
          const angle = t * Math.PI * 2.4 + phase;
          const radius = 1.55 + Math.sin(t * Math.PI * 4 + phase) * .38;
          points.push(new THREE.Vector3(
            Math.cos(angle) * radius * (1.15 + i * .018),
            (t - .5) * 4.4 + Math.sin(angle * 1.7) * .22,
            Math.sin(angle) * radius * .55
          ));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        const tube = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 160, i % 3 === 0 ? .012 : .008, 8, false),
          new THREE.MeshBasicMaterial({
            color: i % 3 === 0 ? 0xf4c982 : 0x8fe9ff,
            transparent: true,
            opacity: i % 3 === 0 ? .24 : .34,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          })
        );
        strandGroup.add(tube);
      }

      const portalObjects = [];
      const glowMaterial = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: .94,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const haloGeometry = new THREE.SphereGeometry(.16, 32, 16);
      const ringGeometry = new THREE.TorusGeometry(.32, .006, 8, 80);
      window.homeEntries.forEach((entry) => {
        const anchor = new THREE.Group();
        anchor.position.set(...entry.position);
        const glow = new THREE.Mesh(haloGeometry, glowMaterial.clone());
        glow.material.color.setHex(entry.accent);
        const ring = new THREE.Mesh(
          ringGeometry,
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: .32,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          })
        );
        ring.rotation.x = Math.PI / 2.8;
        const lineGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(...entry.position).multiplyScalar(.72)]);
        const line = new THREE.Line(
          lineGeometry,
          new THREE.LineBasicMaterial({ color: entry.accent, transparent: true, opacity: .22, blending: THREE.AdditiveBlending })
        );
        anchor.add(glow, ring);
        group.add(anchor, line);
        portalObjects.push({ entry, anchor, glow, ring });
      });

      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      const pointer = new THREE.Vector2();
      const viewport = new THREE.Vector3();
      let last = performance.now();

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const portrait = height > width;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, profile.pixelRatio));
        renderer.setSize(width, height, false);
        composer.setSize(width, height);
        bloomPass.setSize(width, height);
        camera.aspect = width / height;
        camera.position.z = portrait ? (width < 500 ? 11.8 : 10.4) : 8.2;
        camera.fov = portrait ? (width < 500 ? 44 : 42) : 42;
        group.scale.setScalar(portrait ? (width < 500 ? .7 : .86) : 1);
        camera.updateProjectionMatrix();
      }

      function updatePortals(time) {
        const width = window.innerWidth;
        const height = window.innerHeight;
        portalObjects.forEach(({ entry, anchor, glow, ring }, index) => {
          const pulse = .5 + Math.sin(time * 2.2 + index) * .5;
          glow.scale.setScalar(1 + pulse * .2);
          ring.rotation.z += .006 + index * .0004;
          anchor.getWorldPosition(viewport);
          viewport.project(camera);
          const visible = viewport.z > -1 && viewport.z < 1;
          if (entry.element) {
            const x = (viewport.x * .5 + .5) * width;
            const y = (-viewport.y * .5 + .5) * height;
            const scale = THREE.MathUtils.clamp(1.12 - viewport.z * .34, .72, 1.18);
            entry.element.style.left = `${x}px`;
            entry.element.style.top = `${y}px`;
            entry.element.style.setProperty('--portal-scale', scale.toFixed(3));
            entry.element.style.setProperty('--portal-opacity', visible ? '1' : '0');
            entry.element.style.pointerEvents = visible ? 'auto' : 'none';
          }
        });
      }

      function animate(now) {
        const dt = Math.min(.04, (now - last) / 1000);
        last = now;
        const time = now * .001;
        currentX += (targetX - currentX) * .055;
        currentY += (targetY - currentY) * .055;

        group.rotation.y = time * .085 + currentX * .34;
        group.rotation.x = Math.sin(time * .32) * .035 + currentY * .12;
        particles.rotation.y -= dt * .055;
        particles.rotation.z = Math.sin(time * .2) * .08;
        strandGroup.rotation.y = -time * .055;
        core.rotation.x += dt * .18;
        core.rotation.y += dt * .24;
        wire.rotation.y -= dt * .12;

        camera.position.x = currentX * .64;
        camera.position.y = 1.12 - currentY * .36;
        camera.lookAt(currentX * .28, .74 - currentY * .22, 0);

        updatePortals(time);
        if (profile.bloom) {
          composer.render();
        } else {
          renderer.render(scene, camera);
        }
        if (!reducedMotion) requestAnimationFrame(animate);
      }

      experience.addEventListener('pointermove', (event) => {
        pointer.x = (event.clientX / window.innerWidth - .5) * 2;
        pointer.y = (event.clientY / window.innerHeight - .5) * 2;
        targetX = THREE.MathUtils.clamp(pointer.x, -1, 1);
        targetY = THREE.MathUtils.clamp(pointer.y, -1, 1);
        document.body.style.setProperty('--mx', targetX.toFixed(3));
        document.body.style.setProperty('--my', targetY.toFixed(3));
      }, { passive: true });

      experience.addEventListener('pointerleave', () => {
        targetX = 0;
        targetY = 0;
        document.body.style.setProperty('--mx', '0');
        document.body.style.setProperty('--my', '0');
      });

      window.addEventListener('resize', resize);
      resize();
      updatePortals(0);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
  </script>
