<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>nuonuo小窝</title>
  <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="18" fill="%23eaf4ff"/%3E%3Cpath fill="%237199c9" d="M32 49 15 32c-6-6-2-17 7-17 5 0 8 3 10 7 2-4 5-7 10-7 9 0 13 11 7 17L32 49z"/%3E%3C/svg%3E' />
  <link rel="preload" href="./assets/work/photo-wall.webp" as="image" />
  <link rel="preload" href="./assets/work/anniversary.webp" as="image" />
  <link rel="preload" href="./assets/work/message-wall.webp" as="image" />
  <link rel="preload" href="./assets/work/heart-game.webp" as="image" />
  <link rel="preload" href="./assets/work/coco-diary.webp" as="image" />
  <link rel="preload" href="./assets/work/drink-game.webp" as="image" />
  <link rel="preload" href="./assets/work/nuonuo-academy.webp" as="image" />
  <link rel="stylesheet" href="./assets/site-motion.css" />
  <style>
    :root {
      color-scheme: light;
      --ink: #0c1422;
      --text: #142036;
      --muted: rgba(36, 48, 70, .66);
      --soft: rgba(255, 255, 255, .66);
      --strong: rgba(255, 255, 255, .86);
      --line: rgba(116, 135, 160, .24);
      --blue: #7199c9;
      --blue-2: #dfeaf8;
      --gold: #c4a66f;
      --shadow: 0 28px 90px rgba(92, 111, 138, .18);
      --shadow-strong: 0 36px 120px rgba(73, 92, 118, .26);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: #f4f8fd;
    }

    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 206, 219, .34), transparent 30%),
        radial-gradient(circle at 84% 16%, rgba(255, 224, 190, .48), transparent 30%),
        radial-gradient(circle at 46% 88%, rgba(181, 216, 246, .68), transparent 38%),
        linear-gradient(140deg, #fffafd 0%, #eef6ff 46%, #fffdf7 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
    }

    body::before {
      background:
        linear-gradient(90deg, rgba(126, 149, 178, .07) 1px, transparent 1px),
        linear-gradient(rgba(126, 149, 178, .06) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at 50% 36%, rgba(0,0,0,.68), transparent 70%);
    }

    body::after {
      z-index: -1;
      background:
        radial-gradient(circle at calc(50% + var(--mx, 0) * 10%) calc(36% + var(--my, 0) * 8%), rgba(255,255,255,.92), transparent 26%),
        radial-gradient(circle at 22% 72%, rgba(255, 235, 207, .28), transparent 30%),
        radial-gradient(circle at 76% 76%, rgba(255, 210, 224, .2), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0));
      opacity: .72;
    }

    button,
    input {
      font: inherit;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      --loader-mask-y: 0%;
      background:
        radial-gradient(circle at 34% 30%, rgba(255,255,255,1), transparent 28%),
        radial-gradient(circle at 76% 24%, rgba(255, 220, 190, .5), transparent 32%),
        radial-gradient(circle at 24% 78%, rgba(255, 207, 222, .28), transparent 30%),
        linear-gradient(135deg, #fffafd, #eaf5ff);
      -webkit-mask-image: linear-gradient(180deg, #fff 50%, rgba(255,255,255,.98) 58%, rgba(255,255,255,.84) 68%, rgba(255,255,255,.38) 84%, transparent 100%);
      mask-image: linear-gradient(180deg, #fff 50%, rgba(255,255,255,.98) 58%, rgba(255,255,255,.84) 68%, rgba(255,255,255,.38) 84%, transparent 100%);
      -webkit-mask-size: 100% 210%;
      mask-size: 100% 210%;
      -webkit-mask-position: 0 var(--loader-mask-y);
      mask-position: 0 var(--loader-mask-y);
      transition: opacity .55s ease, visibility .55s ease;
    }

    .loader.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      position: relative;
      width: min(380px, 88vw);
      min-height: 220px;
      padding: 26px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: var(--radius);
      background: rgba(255,255,255,.5);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
    }

    .loader-cover-title {
      position: relative;
      z-index: 1;
      margin-top: 30px;
      color: rgba(12, 20, 34, .9);
      font-size: clamp(36px, 11vw, 58px);
      font-weight: 820;
      line-height: .94;
    }

    .loader-cover-copy {
      position: relative;
      z-index: 1;
      max-width: 260px;
      margin: 16px 0 24px;
      color: rgba(48, 62, 84, .62);
      font-size: 13px;
      line-height: 1.65;
    }

    .loader-mini-scene {
      position: absolute;
      right: 20px;
      bottom: 54px;
      width: 118px;
      height: 76px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.52), rgba(255,255,255,.12)),
        radial-gradient(circle at 28% 42%, rgba(255, 220, 190, .42), transparent 32%),
        radial-gradient(circle at 72% 36%, rgba(180, 214, 246, .58), transparent 38%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.82), 0 24px 54px rgba(92, 111, 138, .12);
    }

    .loader-mini-scene::before,
    .loader-mini-scene::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 6px;
      background: rgba(255,255,255,.22);
    }

    .loader-mini-scene::before {
      left: 18px;
      top: 20px;
      width: 34px;
      height: 24px;
    }

    .loader-mini-scene::after {
      right: 16px;
      bottom: 16px;
      width: 42px;
      height: 28px;
    }

    .loader-card::before {
      content: "";
      position: absolute;
      inset: -28% -40%;
      background: linear-gradient(110deg, transparent 32%, rgba(255,255,255,.86) 48%, transparent 64%);
      transform: translateX(-58%) skewX(-14deg);
      animation: loaderSheen 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    .loader-shard {
      position: absolute;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 8px;
      background: rgba(255,255,255,.24);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.76), 0 20px 42px rgba(95, 118, 146, .13);
      pointer-events: none;
    }

    .loader-shard.shard-a {
      right: 22px;
      top: 14px;
      width: 68px;
      height: 42px;
    }

    .loader-shard.shard-b {
      left: 28px;
      bottom: 14px;
      width: 58px;
      height: 34px;
    }

    .loader-shard.shard-c {
      right: 92px;
      bottom: 18px;
      width: 44px;
      height: 30px;
    }

    @keyframes loaderSheen {
      0%, 38% { transform: translateX(-58%) skewX(-14deg); opacity: .18; }
      72% { transform: translateX(68%) skewX(-14deg); opacity: .7; }
      100% { transform: translateX(68%) skewX(-14deg); opacity: 0; }
    }

    .loader-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: rgba(23, 32, 51, .78);
      font-size: 13px;
      letter-spacing: 0;
    }

    .loader-title {
      font-weight: 720;
    }

    .loader-track {
      height: 3px;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(105, 128, 156, .15);
    }

    .loader-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #9bb9d8, #ffffff, #c4a66f);
      box-shadow: 0 0 18px rgba(113, 153, 201, .42);
      transition: width .24s ease;
    }

    .site-shell {
      position: relative;
      min-height: 100dvh;
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s ease;
    }

    body.site-ready .site-shell {
      opacity: 1;
      visibility: visible;
    }

    .topbar {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      pointer-events: none;
    }

    .brand,
    .auth-box,
    .section-nav {
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.76);
      background: rgba(255,255,255,.52);
      box-shadow: 0 18px 58px rgba(77, 97, 123, .13);
      backdrop-filter: blur(22px) saturate(155%);
      -webkit-backdrop-filter: blur(22px) saturate(155%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 0 13px;
      border-radius: 999px;
      color: rgba(12, 20, 34, .9);
      font-weight: 760;
      line-height: 1;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #fff;
      box-shadow:
        0 0 0 1px rgba(113,153,201,.18),
        0 0 15px rgba(113,153,201,.5),
        0 0 34px rgba(196,166,111,.24);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .section-nav {
      position: fixed;
      top: 50%;
      right: max(18px, env(safe-area-inset-right));
      z-index: 42;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-height: auto;
      padding: 14px 8px;
      border-radius: 999px;
      transform: translateY(-50%);
    }

    .section-nav::before {
      content: "";
      position: absolute;
      top: 22px;
      bottom: 22px;
      left: 50%;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(23, 32, 51, .22), transparent);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .nav-dot {
      position: relative;
      z-index: 1;
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      color: transparent;
      background: rgba(23, 32, 51, .3);
      cursor: pointer;
      font-size: 0;
      line-height: 1;
      box-shadow: 0 0 0 1px rgba(255,255,255,.62);
      transition: width .24s ease, border-radius .24s ease, background .24s ease, transform .24s ease, box-shadow .24s ease;
    }

    .nav-dot.is-active {
      width: 28px;
      border-radius: 999px;
      background: rgba(23, 32, 51, .84);
      transform: scale(1.02);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.82),
        0 10px 24px rgba(73, 92, 118, .22);
    }

    .auth-box {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      color: var(--ink);
    }

    .auth-status {
      max-width: min(28vw, 170px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-left: 8px;
      color: rgba(23, 32, 51, .66);
      font-size: 13px;
      line-height: 1;
    }

    .btn {
      min-height: 30px;
      border: 0;
      border-radius: 999px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      background: rgba(255,255,255,.48);
      box-shadow: inset 0 0 0 1px rgba(23,32,51,.08);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.82);
      box-shadow: inset 0 0 0 1px rgba(23,32,51,.12), 0 10px 24px rgba(77,97,123,.12);
    }

    .primary-btn {
      color: #fff;
      background: rgba(23, 32, 51, .86);
    }

    .danger-btn {
      color: #7e2730;
      background: rgba(255,255,255,.54);
    }

    .story-pin {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      overflow: hidden;
      pointer-events: auto;
      background:
        linear-gradient(115deg, rgba(255,255,255,.18), transparent 34%),
        radial-gradient(circle at 74% 21%, rgba(255,255,255,.58), transparent 30%),
        linear-gradient(180deg, rgba(232,243,255,.18), rgba(235,244,253,.34));
    }

    .exhibit-space {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .exhibit-space::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(113,153,201,.105) 1px, transparent 1px),
        linear-gradient(90deg, rgba(113,153,201,.08) 1px, transparent 1px);
      background-size: 92px 92px, 92px 92px;
      mask-image: radial-gradient(circle at 62% 42%, black, transparent 72%);
      opacity: .42;
    }

    .exhibit-space::after {
      content: "";
      position: absolute;
      inset: 12vh 7vw 10vh 8vw;
      border-left: 1px solid rgba(255,255,255,.68);
      border-right: 1px solid rgba(113,153,201,.14);
      background:
        linear-gradient(90deg, rgba(255,255,255,.34), transparent 14%, transparent 84%, rgba(255,255,255,.18)),
        linear-gradient(180deg, transparent, rgba(255,255,255,.32), transparent);
      box-shadow:
        inset 1px 0 0 rgba(113,153,201,.12),
        0 0 80px rgba(255,255,255,.2);
      opacity: .48;
    }

    .exhibit-line {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.88), rgba(113,153,201,.22), transparent);
      opacity: .62;
    }

    .exhibit-line.line-a {
      top: 25vh;
      left: 12vw;
      width: 44vw;
    }

    .exhibit-line.line-b {
      right: 9vw;
      bottom: 21vh;
      width: 38vw;
    }

    .exhibit-column {
      position: absolute;
      top: 13vh;
      bottom: 10vh;
      width: min(13vw, 160px);
      border: 1px solid rgba(255,255,255,.42);
      border-top: 0;
      border-bottom: 0;
      background: linear-gradient(90deg, rgba(255,255,255,.22), rgba(255,255,255,.04), rgba(113,153,201,.07));
      filter: blur(.2px);
      opacity: .42;
    }

    .exhibit-column.column-a {
      left: 6vw;
    }

    .exhibit-column.column-b {
      right: 5vw;
      opacity: .32;
    }

    .scroll-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .scroll-stage::before {
      content: "";
      position: absolute;
      inset: 11vh 4vw auto auto;
      width: min(46vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.86), rgba(221,235,250,.38) 38%, transparent 70%);
      filter: blur(8px);
      transform: translate3d(calc(var(--mx, 0) * 22px), calc(var(--my, 0) * 18px), 0);
      opacity: .8;
      pointer-events: none;
    }

    .scroll-stage::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 9vh;
      width: min(760px, 58vw);
      height: 18px;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, rgba(73, 92, 118, .18), rgba(73, 92, 118, 0) 68%);
      transform: translateX(-2%);
      filter: blur(8px);
      opacity: .55;
      pointer-events: none;
    }

    .text-track {
      position: relative;
      z-index: 4;
    }

    .story-copy-stage {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .text-scene {
      min-height: 100dvh;
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(94px, 13vh, 136px) clamp(18px, 5vw, 70px) clamp(36px, 8vh, 78px);
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(360px, 1.08fr);
      gap: clamp(30px, 6vw, 86px);
      align-items: center;
    }

    .hero-text {
      position: relative;
      width: 100%;
      margin: 0;
      padding-top: clamp(92px, 12vh, 120px);
      grid-template-columns: minmax(0, 860px);
      justify-content: start;
      align-items: start;
      overflow: hidden;
    }

    .text-copy {
      position: relative;
      z-index: 3;
      grid-column: 1;
      color: var(--ink);
    }

    .hero-bridge {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      --bridge-light: 0;
    }

    .hero-flow-line,
    .hero-sheen {
      position: absolute;
      pointer-events: none;
    }

    .hero-flow-line {
      left: clamp(18px, 5vw, 70px);
      right: clamp(18px, 5vw, 70px);
      top: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(23,32,51,.34), rgba(255,255,255,.86), rgba(113,153,201,.3), transparent);
      opacity: calc(.18 + var(--bridge-light) * .62);
      transform-origin: left center;
      filter: drop-shadow(0 0 16px rgba(255,255,255,.6));
    }

    .hero-sheen {
      left: -18vw;
      top: 18vh;
      width: 34vw;
      height: 58vh;
      border-radius: 999px;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,.74), rgba(184,214,246,.24), transparent);
      opacity: calc(.08 + var(--bridge-light) * .52);
      filter: blur(20px);
      transform: skewX(-18deg);
    }

    .hero-glass-shard {
      position: absolute;
      width: clamp(82px, 12vw, 168px);
      aspect-ratio: 1.34;
      border: 1px solid rgba(255,255,255,.66);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(255,255,255,.62), rgba(255,255,255,.16)),
        linear-gradient(90deg, rgba(113,153,201,.18), rgba(255,255,255,.05));
      box-shadow:
        0 28px 80px rgba(73,92,118,.16),
        inset 0 1px 0 rgba(255,255,255,.76),
        inset 0 -20px 42px rgba(113,153,201,.08);
      backdrop-filter: blur(18px) saturate(148%);
      -webkit-backdrop-filter: blur(18px) saturate(148%);
      opacity: .68;
    }

    .hero-glass-shard::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: inherit;
      background:
        linear-gradient(120deg, rgba(255,255,255,.7), transparent 42%),
        radial-gradient(circle at 72% 28%, rgba(196,166,111,.24), transparent 24%);
      opacity: .68;
    }

    .hero-glass-shard.shard-a {
      right: 12vw;
      top: 18vh;
      transform: rotate(-8deg);
    }

    .hero-glass-shard.shard-b {
      right: 30vw;
      bottom: 20vh;
      width: clamp(74px, 10vw, 136px);
      transform: rotate(10deg);
    }

    .hero-glass-shard.shard-c {
      left: 12vw;
      bottom: 18vh;
      width: clamp(68px, 9vw, 126px);
      transform: rotate(-14deg);
    }

    .hero-glass-shard.shard-d {
      right: 7vw;
      bottom: 34vh;
      width: clamp(56px, 8vw, 108px);
      transform: rotate(16deg);
    }

    .hero-glass-shard.shard-e {
      left: 44vw;
      top: 30vh;
      width: clamp(54px, 7vw, 98px);
      transform: rotate(7deg);
    }

    .story-copy {
      position: absolute;
      inset: 0;
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(94px, 13vh, 136px) clamp(18px, 5vw, 70px) clamp(36px, 8vh, 78px);
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(360px, 1.08fr);
      gap: clamp(30px, 6vw, 86px);
      align-items: center;
      color: var(--ink);
      opacity: 0;
      visibility: hidden;
    }

    .story-copy-inner {
      grid-column: 1;
      max-width: 620px;
    }

    .entry-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: var(--layer-opacity, 0);
      transition: opacity .18s linear;
      pointer-events: none;
    }

    .entry-layer {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(94px, 13vh, 136px) clamp(18px, 5vw, 70px) clamp(36px, 8vh, 78px);
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(360px, 1.08fr);
      gap: clamp(30px, 6vw, 86px);
      align-items: center;
      left: 50%;
      transform: translateX(-50%);
      z-index: var(--layer-z, 1);
    }

    .entry-layer.is-active {
      pointer-events: auto;
    }

    .entry-layer.is-active .visual {
      pointer-events: auto;
    }

    h1,
    h2 {
      margin: 0;
      color: var(--ink);
      letter-spacing: 0;
      font-weight: 760;
      line-height: .95;
    }

    h1 {
      max-width: 790px;
      font-size: clamp(54px, 8.8vw, 128px);
      text-shadow: 0 22px 70px rgba(73, 92, 118, .18);
    }

    h1 span {
      display: block;
    }

    h2 {

    let storyScrollTrigger = null;
    let storyNavProgress = null;
    let returnSectionKey = window.NuonuoMotion?.getReturnSection?.() || null;
    // Tuning values for the scroll story timeline: reveal, hold, and exit windows inside each card's span.
    const SCENE_SPAN = 1.32;
    const REVEAL_START = 0.16;
    const REVEAL_END = 0.72;
    const HOLD_END = 1.02;
    const EXIT_START = 1.06;

    function getStoryDuration() {
      return sections.length * SCENE_SPAN;
    }

    function getStoryTime(index, offset = 0) {
      return Math.max(0, Math.min(getStoryDuration(), index * SCENE_SPAN + offset));
    }

    function storyTimeToProgress(time) {
      return clamp(time / getStoryDuration(), 0, 1);
    }

    function progressToStoryIndex(progressValue) {
      return Math.max(0, Math.min(sections.length - 1, Math.floor((progressValue * getStoryDuration()) / SCENE_SPAN + 0.0001)));
    }

    function setProgress(value) {
      progress = Math.max(progress, Math.min(100, value));
      loaderBar.style.width = `${progress}%`;
      loaderPercent.textContent = `${Math.round(progress)}%`;
    }

    function playLoaderBridge(done) {
      // Turns the loading card into the first hero animation; falls back instantly for reduced motion.
      if (!window.gsap || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        loader.classList.add('is-done');
        done();
        return;
      }

      const loaderCard = loader.querySelector('.loader-card');
      const loaderShards = loader.querySelectorAll('.loader-shard');
      const loaderCover = loader.querySelectorAll('.loader-cover-title, .loader-cover-copy, .loader-mini-scene');
      const heroShards = document.querySelectorAll('.hero-glass-shard');
      const tl = gsap.timeline({
        defaults: { ease: 'power3.inOut' },
        onComplete: () => {
          loader.classList.add('is-done');
          gsap.set(loader, { autoAlpha: 0, pointerEvents: 'none' });
          done();
        }
      });

      tl.to(loaderBar, { boxShadow: '0 0 30px rgba(255, 216, 186, .72)', duration: 0.18 }, 0)
        .to(loaderCover, {
          y: -22,
          autoAlpha: 0,
          duration: 0.36,
          stagger: 0.025
        }, 0.08)
        .to(loaderCard, {
          y: -16,
          scale: 0.94,
          autoAlpha: 0.24,
          duration: 0.5
        }, 0.22)
        .to(loaderShards, {
          x: (index) => [-140, 94, 42][index] || 0,
          y: (index) => [96, 138, 68][index] || 0,
          rotation: (index) => [-12, 10, 8][index] || 0,
          scale: (index) => [1.06, 0.92, 0.82][index] || 1,
          autoAlpha: 0.76,
          duration: 0.54,
          stagger: 0.035
        }, 0.08)
        .to(loader, { '--loader-mask-y': '100%', duration: 0.72, ease: 'power3.inOut' }, 0.18)
        .fromTo(heroShards,
          { autoAlpha: 0, scale: 0.62 },
          { autoAlpha: 0.72, scale: 1, duration: 0.46, stagger: 0.035 },
          0.26
        )
        .to(loader, { autoAlpha: 0, duration: 0.42 }, 0.52);
    }

    function finishLoading() {
      setProgress(100);
      document.body.classList.add('site-ready');
      playLoaderBridge(() => {
        if (window.ScrollTrigger) {
          setTimeout(() => ScrollTrigger.refresh(), 80);
        }
        handleReturnToSection();
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizeUsername(name) {
      return String(name || '').trim();
    }

    function setAuthMode(mode) {
      const isRegister = mode === 'register';
      authModal.dataset.mode = mode;
      authTitle.textContent = isRegister ? '注册' : '登录';
      authDesc.textContent = isRegister ? '注册后即可使用同一账号进入各个页面。' : '登录后可打开小游戏并保存你的进度。';
      authSubmitBtn.textContent = isRegister ? '注册' : '登录';
      authSwitchBtn.textContent = isRegister ? '已有账号？去登录' : '没有账号？去注册';
      authPassword2Wrap.style.display = isRegister ? '' : 'none';
      authPassword.value = '';
      authPassword2.value = '';
    }

    function openAuthModal(mode = 'login') {
      setAuthMode(mode);
      authModal.classList.add('show');
      authModal.setAttribute('aria-hidden', 'false');
      setTimeout(() => authUsername.focus(), 0);
    }

    function closeAuthModal() {
      authModal.classList.remove('show');
      authModal.setAttribute('aria-hidden', 'true');
    }

    function renderAuthState() {
      // Repaint login/register/logout controls whenever the shared auth user changes.
      const user = getCurrentUser();
      if (user) {
        authBox.innerHTML = `
          <div class="auth-status">当前登录：${escapeHtml(user.username)}</div>
          <button class="btn danger-btn logout-btn" id="logoutBtn" type="button">退出登录</button>
        `;
      } else {
        authBox.innerHTML = `
          <div class="auth-status">未登录</div>
          <button class="btn primary-btn" id="loginBtn" type="button">登录</button>
          <button class="btn ghost-btn" id="registerBtn" type="button">注册</button>
        `;
      }

      const loginBtn = document.getElementById('loginBtn');
      const registerBtn = document.getElementById('registerBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      if (loginBtn) loginBtn.onclick = () => openAuthModal('login');
      if (registerBtn) registerBtn.onclick = () => openAuthModal('register');
      if (logoutBtn) {
        logoutBtn.onclick = () => {
          if (!confirm('确定要退出登录吗？')) return;
          setCurrentUser(null);
          alert('已退出登录');
        };
      }
    }

    function enterSection(section) {
      // Protected sections remember the target, open login, then continue after a successful login/register.
      if (section.requiresAuth && !getCurrentUser()) {
        pendingRedirect = section.href;
        pendingRedirectSection = section;
        openAuthModal('login');
        return;
      }
      navigateToSection(section);
    }

    function navigateToSection(section) {
      if (window.NuonuoMotion?.navigateToPage) {
        window.NuonuoMotion.navigateToPage(section.href, { sectionKey: section.key });
        return;
      }
      location.href = section.href;
    }

    function splitTextToChars(text) {
      return Array.from(String(text || ''));
    }

    function renderStoryChars(line) {
      return splitTextToChars(line)
        .map(char => `<span class="reveal-char" aria-hidden="true">${char === ' ' ? '&nbsp;' : escapeHtml(char)}</span>`)
        .join('');
    }

    function renderStoryLines(lines) {
      return (lines || [])
        .map(line => `
          <span class="reveal-line" aria-label="${escapeHtml(line)}">
            <span class="reveal-text">
              ${renderStoryChars(line)}
              <span class="line-sheen" aria-hidden="true"></span>
            </span>
          </span>
        `)
        .join('');
    }

    function buildSections() {
      sections.forEach((section, index) => {
        const number = section.number || String(index + 1).padStart(2, '0');
        const layer = document.createElement('section');
        layer.className = 'entry-layer';
        layer.id = section.key;
        layer.dataset.key = section.key;
        layer.setAttribute('aria-label', section.title);
        layer.innerHTML = `
          <div class="visual section-image-${section.image}" role="button" tabindex="0" aria-label="进入${section.title}">
            <div class="visual-card">
              <div><strong>${section.title}</strong></div>
              <div class="index-number">${number}</div>
            </div>
          </div>
        `;
        const visual = layer.querySelector('.visual');
        visual.addEventListener('click', () => enterSection(section));
        visual.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          enterSection(section);
        });
        scrollStage.appendChild(layer);

        const textScene = document.createElement('section');
        textScene.className = 'story-copy';
        textScene.dataset.key = section.key;
        textScene.innerHTML = `
          <div class="story-copy-inner section-copy">
            <h2 class="story-title-mask"><span class="story-title-text">${escapeHtml(section.title)}</span></h2>
            <div class="story-narrative" aria-label="${escapeHtml(section.title)}介绍">
              ${renderStoryLines(section.story)}
            </div>
          </div>
        `;
        storyCopyStage.appendChild(textScene);
        section.titleText = textScene.querySelector('.story-title-text');
        section.storyLines = Array.from(textScene.querySelectorAll('.reveal-text'));
        section.storyChars = Array.from(textScene.querySelectorAll('.reveal-char'));
        section.storySheens = Array.from(textScene.querySelectorAll('.line-sheen'));

        const dot = document.createElement('button');
        dot.className = 'nav-dot';
        dot.type = 'button';
        dot.textContent = String(index + 1);
        dot.setAttribute('aria-label', section.title);
        dot.addEventListener('click', () => {
          scrollToStoryIndex(index);
        });
        sectionNav.appendChild(dot);
        section.layer = layer;
        section.visual = visual;
        section.textScene = textScene;
        section.dot = dot;
      });
    }

    function clamp(value, min = 0, max = 1) {
      return Math.min(max, Math.max(min, value));
    }

    function smoothstep(edge0, edge1, value) {
      const x = clamp((value - edge0) / (edge1 - edge0));
      return x * x * (3 - 2 * x);
    }

    function setupScrollStory() {
      // Lightweight fallback when GSAP ScrollTrigger is unavailable: map window scroll to story progress.
      let ticking = false;

      const update = () => {
        const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
        const viewportCenter = viewportHeight * .5;
        let activeIndex = 0;
        let nearestDistance = Infinity;

        sections.forEach((section, index) => {
          const rect = section.textScene.getBoundingClientRect();
          const sceneCenter = rect.top + rect.height * .5;
          const distance = Math.abs(sceneCenter - viewportCenter);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            activeIndex = index + 1;
          }
        });

        sections.forEach((section, index) => {
          const rect = section.textScene.getBoundingClientRect();
          const sceneCenter = rect.top + rect.height * .5;
          const normalizedDistance = Math.abs(sceneCenter - viewportCenter) / Math.max(1, viewportHeight);
          const visualOpacity = 1 - smoothstep(.28, .68, normalizedDistance);
          const isActive = activeIndex === index + 1 && visualOpacity > .42;
          section.layer.style.setProperty('--layer-opacity', visualOpacity.toFixed(3));
          section.layer.style.setProperty('--visual-opacity', visualOpacity.toFixed(3));
          section.layer.style.setProperty('--visual-scale', (0.992 + visualOpacity * .008).toFixed(3));
          section.layer.style.setProperty('--layer-z', String(Math.round(visualOpacity * 100) + 1));
          section.textScene.style.opacity = visualOpacity.toFixed(3);
          section.textScene.style.visibility = visualOpacity > .04 ? 'visible' : 'hidden';
          section.layer.classList.toggle('is-active', isActive);
          section.visual.tabIndex = isActive ? 0 : -1;
          section.dot.classList.toggle('is-active', isActive);
        });
        ticking = false;
      };

      const requestUpdate = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(update);
      };

      update();
      window.addEventListener('scroll', requestUpdate, { passive: true });
      window.addEventListener('resize', requestUpdate, { passive: true });
      window.addEventListener('load', requestUpdate, { once: true });
    }

    function setActiveStory(index) {
      const activeIndex = Math.max(0, Math.min(sections.length - 1, index));
      sections.forEach((section, sectionIndex) => {
        const isActive = sectionIndex === activeIndex;
        section.layer.classList.toggle('is-active', isActive);
        section.layer.style.setProperty('--layer-z', isActive ? '100' : String(sectionIndex + 1));
        section.visual.tabIndex = isActive ? 0 : -1;
        section.visual.setAttribute('aria-hidden', String(!isActive));
        section.textScene.setAttribute('aria-hidden', String(!isActive));
        section.textScene.classList.toggle('is-active', isActive);
        section.dot.classList.toggle('is-active', isActive);
      });
    }

    function getStorySnapProgress(index) {
      const clamped = Math.max(0, Math.min(sections.length - 1, index));
      if (sections.length <= 1 || clamped === 0) return 0;
      return storyTimeToProgress(getStoryTime(clamped, 0.08));
    }

    function getProgressiveSnapPoints() {
      const points = [0, 1];
      sections.forEach((section, index) => {
        points.push(getStorySnapProgress(index));
        points.push(storyTimeToProgress(getStoryTime(index, REVEAL_END)));
        points.push(storyTimeToProgress(getStoryTime(index, HOLD_END)));
        points.push(storyTimeToProgress(getStoryTime(index, EXIT_START)));
      });
      return Array.from(new Set(points.map(point => clamp(point, 0, 1).toFixed(5))))
        .map(Number)
        .sort((a, b) => a - b);
    }

    function scrollToStoryIndex(index) {
      if (storyScrollTrigger) {
        const clamped = Math.max(0, Math.min(sections.length - 1, index));
        const progressTarget = getStorySnapProgress(clamped);
        const y = storyScrollTrigger.start + (storyScrollTrigger.end - storyScrollTrigger.start) * progressTarget;
        storyNavProgress = progressTarget;
        window.scrollTo({ top: y, left: 0, behavior: 'auto' });
        if (storyScrollTrigger.animation) {
          storyScrollTrigger.animation.progress(progressTarget);
        }
        storyScrollTrigger.update();
        requestAnimationFrame(() => {
          if (storyScrollTrigger.animation) {
            storyScrollTrigger.animation.progress(progressTarget);
          }
          storyScrollTrigger.update();
          setActiveStory(clamped);
        });
        setActiveStory(clamped);
        return;
      }
      setActiveStory(index);
      storyPin.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function handleReturnToSection() {
      const key = returnSectionKey || window.NuonuoMotion?.consumeReturnSection?.();
      if (!key) return;
      returnSectionKey = null;
      window.NuonuoMotion?.consumeReturnSection?.();
      const index = sections.findIndex(section => section.key === key);
      if (index < 0) return;
      const run = () => {
        scrollToStoryIndex(index);
        if (window.gsap) {
          const section = sections[index];
          const isMobile = window.matchMedia('(max-width: 920px)').matches;
          gsap.fromTo([section.visual, section.textScene],
            { scale: isMobile ? 1.012 : 1.018, ...(isMobile ? {} : { filter: 'brightness(1.16)' }) },
            { scale: 1, ...(isMobile ? {} : { filter: 'brightness(1)' }), duration: 0.62, ease: 'power3.out', clearProps: isMobile ? 'scale' : 'filter,scale' }
          );
        }
      };
      setTimeout(run, 140);
    }

    function setupGsapStory() {
      // Main desktop/mobile scroll interaction. It pins the stage and animates cards/text by timeline progress.
      if (!window.gsap || !window.ScrollTrigger) {
        setupScrollStory();
        return;
      }

      gsap.registerPlugin(ScrollTrigger);
      document.body.classList.add('gsap-story');

      const mm = gsap.matchMedia();
      const layerItems = sections.map(section => section.layer);
      const visualItems = sections.map(section => section.visual);
      const copyItems = sections.map(section => section.textScene);
      const cardItems = sections.map(section => section.visual.querySelector('.visual-card'));
      const titleItems = sections.map(section => section.titleText);
      const charItems = sections.flatMap(section => section.storyChars);
      const sheenItems = sections.flatMap(section => section.storySheens);
      const exhibitItems = gsap.utils.toArray('.exhibit-column, .exhibit-line');
      mm.add({
        isDesktop: '(min-width: 921px)',
        isMobile: '(max-width: 920px)',
        reduceMotion: '(prefers-reduced-motion: reduce)'
      }, (context) => {
        const { isDesktop, isMobile, reduceMotion } = context.conditions;
        const lastIndex = sections.length - 1;
        const sceneDuration = getStoryDuration();
        const snapPoints = getProgressiveSnapPoints();
        const travel = () => Math.max(window.innerHeight * sceneDuration, 1);

        gsap.set(layerItems, { autoAlpha: 0, zIndex: 1 });
        gsap.set(visualItems, {
          autoAlpha: 0,
          y: isMobile ? 34 : 70,
          scale: isMobile ? 0.965 : 0.92,
          rotationX: 0,
          rotationY: 0,
          transformOrigin: '50% 58%'
        });
        gsap.set(copyItems, {
          autoAlpha: 0,
          y: isMobile ? 34 : 86,
          scale: isMobile ? 0.985 : 0.94,
          transformOrigin: '0% 50%'
        });
        gsap.set(titleItems, {
          autoAlpha: 0,
          yPercent: 118
        });
        gsap.set(charItems, {
          autoAlpha: 0,
          yPercent: 115,
          scale: 0.96,
          filter: isMobile ? 'none' : 'blur(5px)'
        });
        gsap.set(sheenItems, {
          autoAlpha: 0,
          xPercent: -140
        });
        gsap.set(cardItems, {
          autoAlpha: 0,
          y: isMobile ? 16 : 28,
          scale: 0.96
        });
        gsap.set(exhibitItems, {
          autoAlpha: isMobile ? 0.42 : 0.62,
          y: 0,
          x: 0
        });

        gsap.set(layerItems[0], { autoAlpha: 1, zIndex: 100 });
        gsap.set(visualItems[0], { autoAlpha: 1, y: 0, scale: 1, rotationX: 0, rotationY: 0 });
        gsap.set(copyItems[0], { autoAlpha: 1, y: 0, scale: 1 });
        gsap.set(titleItems[0], { autoAlpha: 1, yPercent: 0 });
        gsap.set(cardItems[0], { autoAlpha: 1, y: 0, scale: 1 });
        setActiveStory(0);

        if (reduceMotion) {
          gsap.set(layerItems, { clearProps: 'transform' });
          gsap.set(visualItems, { autoAlpha: 0, clearProps: 'transform' });
          gsap.set(copyItems, { autoAlpha: 0, clearProps: 'transform' });
          gsap.set(titleItems, { autoAlpha: 1, yPercent: 0 });
          gsap.set(charItems, { autoAlpha: 1, yPercent: 0, scale: 1, filter: 'none' });
          gsap.set(sheenItems, { autoAlpha: 0 });
          gsap.set(layerItems[0], { autoAlpha: 1 });
          gsap.set(visualItems[0], { autoAlpha: 1 });
          gsap.set(copyItems[0], { autoAlpha: 1 });
          return () => {};
        }

        gsap.to(exhibitItems, {
          x: (index) => (index % 2 === 0 ? 10 : -8),
          y: (index) => (index % 2 === 0 ? -8 : 8),
          autoAlpha: isMobile ? 0.34 : 0.52,
          duration: 5.5,
          ease: 'sine.inOut',
          repeat: -1,
          yoyo: true,
          stagger: 0.32
        });

        const tl = gsap.timeline({
          defaults: { ease: 'power2.inOut' },
          scrollTrigger: {
            trigger: storyPin,
            start: 'top top',
            end: () => `+=${travel()}`,
            pin: true,
            scrub: isMobile ? 0.45 : 0.8,
            anticipatePin: 1,
            invalidateOnRefresh: true,
            snap: {
              snapTo: (value) => {
                if (storyNavProgress !== null) {
                  const target = storyNavProgress;
                  storyNavProgress = null;
                  return target;
                }
                return snapPoints.reduce((closest, point) => (
                  Math.abs(point - value) < Math.abs(closest - value) ? point : closest
                ), snapPoints[0]);
              },
              duration: { min: 0.18, max: 0.42 },
              delay: 0.04,
              directional: false,
              inertia: false,
              ease: 'power2.inOut'
            },
            onUpdate: (self) => {
              setActiveStory(progressToStoryIndex(self.progress));
            },
            onRefresh: (self) => {
              storyScrollTrigger = self;
              setActiveStory(progressToStoryIndex(self.progress));
            }
          }
        });

        sections.forEach((section, index) => {
          const lineStart = getStoryTime(index, REVEAL_START);
          const lineGap = isMobile ? 0.2 : 0.24;
          const lineDuration = isMobile ? 0.32 : 0.38;

          section.storyLines.forEach((line, lineIndex) => {
            const chars = Array.from(line.querySelectorAll('.reveal-char'));
            const sheen = line.querySelector('.line-sheen');
            const at = lineStart + lineIndex * lineGap;
            const charBatch = isMobile ? Math.max(0.004, 0.12 / Math.max(chars.length, 1)) : 0.01;
            tl.fromTo(sheen,
              { autoAlpha: 0, xPercent: -135 },
              {
                autoAlpha: isMobile ? 0.58 : 0.95,
                xPercent: 285,
                duration: isMobile ? lineDuration : lineDuration + 0.12,
                ease: 'power2.inOut'
              },
              at - 0.04
            )
            .to(sheen, {
              autoAlpha: 0,
              xPercent: 335,
              duration: 0.08,
              ease: 'power1.out'
            }, at + lineDuration + 0.08)
            .to(chars, {
              autoAlpha: 1,
              yPercent: 0,
              scale: 1,
              filter: isMobile ? 'none' : 'blur(0px)',
              duration: lineDuration,
              stagger: {
                each: charBatch,
                from: 'start'
              },
              ease: 'power3.out'
            }, at);
          });
        });

        for (let i = 0; i < lastIndex; i += 1) {
          const current = sections[i];
          const next = sections[i + 1];
          const at = getStoryTime(i, EXIT_START);
          const nextIn = getStoryTime(i, EXIT_START + 0.1);
          const nextTilt = isDesktop ? (i % 2 === 0 ? -4 : 4) : 0;

          tl.set(next.layer, { zIndex: 100 + i + 1 }, at - 0.02)
            .to(current.storyChars.slice().reverse(), {
              autoAlpha: 0,
              yPercent: -112,
              scale: 0.98,
              filter: isMobile ? 'none' : 'blur(4px)',
              duration: isMobile ? 0.24 : 0.28,
              stagger: isMobile ? 0.0015 : 0.003,
              ease: 'power3.inOut'
            }, at)
            .to(current.titleText, {
              autoAlpha: 0,
              yPercent: -116,
              duration: 0.5,
              ease: 'power3.inOut'
            }, at + 0.06)
            .to(current.textScene, {
              autoAlpha: 0,
              y: isMobile ? -28 : -70,
              scale: isMobile ? 0.985 : 0.94,
              duration: 0.42
            }, at + 0.08)
            .to(current.visual, {
              autoAlpha: 0,
              y: isMobile ? -16 : -54,
              scale: isMobile ? 1.045 : 1.09,
              rotationY: isDesktop ? -nextTilt : 0,
              duration: 0.48
            }, at + 0.02)
            .to(current.layer, { autoAlpha: 0, duration: 0.38 }, at + 0.1)
            .set(current.storySheens, { autoAlpha: 0, xPercent: -140 }, at + 0.44)
            .fromTo(next.layer,
              { autoAlpha: 0 },
              { autoAlpha: 1, duration: 0.26 },
              nextIn
            )
            .fromTo(next.visual,
              {
                autoAlpha: 0,
                y: isMobile ? 38 : 76,
                scale: isMobile ? 0.955 : 0.9,
                rotationX: isDesktop ? 2 : 0,
                rotationY: isDesktop ? nextTilt : 0
              },
              {
                autoAlpha: 1,
                y: 0,
                scale: 1,
                rotationX: 0,
                rotationY: 0,
                duration: 0.34
              },
              nextIn + 0.02
            )
            .fromTo(next.textScene,
              {
                autoAlpha: 0,
                y: isMobile ? 36 : 92,
                scale: isMobile ? 0.985 : 0.93
              },
              {
                autoAlpha: 1,
                y: 0,
                scale: 1,
                duration: 0.22
              },
              nextIn + 0.04
            )
            .fromTo(next.titleText,
              {
                autoAlpha: 0,
                yPercent: 118
              },
              {
                autoAlpha: 1,
                yPercent: 0,
                duration: 0.2,
                ease: 'power3.out'
              },
              nextIn + 0.04
            )
            .fromTo(next.visual.querySelector('.visual-card'),
              {
                autoAlpha: 0,
                y: isMobile ? 16 : 30,
                scale: 0.96
              },
              {
                autoAlpha: 1,
                y: 0,
                scale: 1,
                duration: 0.26
              },
              nextIn + 0.08
            );
        }

        tl.to({}, { duration: 0.01 }, sceneDuration);
        storyScrollTrigger = tl.scrollTrigger;

        return () => {
          storyScrollTrigger = null;
          gsap.killTweensOf([exhibitItems, titleItems, charItems, sheenItems]);
          tl.kill();
        };
      });
    }

    function setupHeroBridge() {
      if (!window.gsap || !window.ScrollTrigger) return;

      const hero = document.getElementById('top');
      const title = hero?.querySelector('h1');
      const bridge = document.getElementById('heroBridge');
      if (!hero || !title || !bridge) return;

      const shards = gsap.utils.toArray('.hero-glass-shard');
      const flowLine = bridge.querySelector('.hero-flow-line');
      const sheen = bridge.querySelector('.hero-sheen');

      const mm = gsap.matchMedia();
      mm.add({
        isDesktop: '(min-width: 921px)',
        isMobile: '(max-width: 920px)',
        reduceMotion: '(prefers-reduced-motion: reduce)'
      }, (context) => {
        const { isDesktop, isMobile, reduceMotion } = context.conditions;
        if (reduceMotion) return () => {};

        gsap.set(bridge, { '--bridge-light': 0 });
        gsap.set(shards, {
          autoAlpha: isMobile ? 0.42 : 0.66,
          y: (index) => (index % 2 === 0 ? 18 : -18),
          x: (index) => (index % 2 === 0 ? -10 : 12),
          scale: isMobile ? 0.9 : 0.86,
          transformOrigin: '50% 50%'
        });
        gsap.set(flowLine, { scaleX: 0.12, autoAlpha: 0.42 });
        gsap.set(sheen, { xPercent: -35, autoAlpha: 0.18 });

        const tl = gsap.timeline({
          defaults: { ease: 'power2.inOut' },
          scrollTrigger: {
            trigger: hero,
            start: 'top top',
            end: 'bottom top',
            scrub: isMobile ? 0.5 : 0.9,
            invalidateOnRefresh: true
          }
        });

        tl.to(bridge, { '--bridge-light': 1, duration: 0.72 }, 0)
          .to(title, {
            y: isMobile ? -34 : -64,
            scale: isMobile ? 0.92 : 0.88,
            autoAlpha: 0.38,
            duration: 0.9
          }, 0.08)
          .to(flowLine, {
            scaleX: 1,
            autoAlpha: 0.95,
            duration: 0.82
          }, 0.02)
          .to(sheen, {
            xPercent: 235,
            autoAlpha: 0.72,
            duration: 0.9
          }, 0.08)
          .to(shards, {
            x: (index) => {
              const desktop = [-260, -120, 180, 260, 44];
              const mobile = [-88, 48, 112, 0, 0];
              return isDesktop ? desktop[index] || 0 : mobile[index] || 0;
            },
            y: (index) => {
              const desktop = [260, 310, 250, 150, 290];
              const mobile = [270, 248, 226, 0, 0];
              return isDesktop ? desktop[index] || 220 : mobile[index] || 220;
            },
            rotation: (index) => {
              const desktop = [10, -8, 8, -12, 16];
              const mobile = [8, -7, 11, 0, 0];
              return isDesktop ? desktop[index] || 0 : mobile[index] || 0;
            },
            scale: (index) => (isDesktop ? [1.08, 0.96, 0.9, 0.82, 0.76][index] || 0.8 : [0.72, 0.66, 0.62][index] || 0.6),
            autoAlpha: (index) => (isMobile && index > 2 ? 0 : 0.88),
            duration: 0.9,
            stagger: 0.035
          }, 0.04);

        return () => {
          tl.kill();
        };
      });
    }

    function setupMotion() {
      window.addEventListener('pointermove', (event) => {
        const mx = (event.clientX / window.innerWidth - .5) * 2;
        const my = (event.clientY / window.innerHeight - .5) * 2;
        document.body.style.setProperty('--mx', mx.toFixed(3));
        document.body.style.setProperty('--my', my.toFixed(3));
      }, { passive: true });
    }

    authCancelBtn.addEventListener('click', () => {
      pendingRedirect = null;
      pendingRedirectSection = null;
      closeAuthModal();
    });

    authSwitchBtn.addEventListener('click', () => {
      const mode = authModal.dataset.mode === 'register' ? 'login' : 'register';
      setAuthMode(mode);
    });

    authSubmitBtn.addEventListener('click', async () => {
      // Register/login both end by setting shared auth state; pendingRedirect handles protected card continuation.
      const mode = authModal.dataset.mode || 'login';
      const username = sanitizeUsername(authUsername.value);
      const password = authPassword.value;
      const password2 = authPassword2.value;

      if (!username || !password) {
        alert('请输入用户名和密码');
        return;
      }
      if (username.length < 2) {
        alert('用户名至少 2 个字符');
        return;
      }

      if (mode === 'register') {
        if (password.length < 4) {
          alert('密码至少 4 位');
          return;
        }
        if (password !== password2) {
          alert('两次密码不一致');
          return;
        }
        try {
          const oldUser = await getUserByName(username);
          if (oldUser) {
            alert('这个用户名已经存在了');
            return;
          }
          const userData = {
            username,
            ...(await createPasswordRecord(password)),
            createdAt: new Date().toISOString()
          };
          await putJsonToCos(makeUserKey(username), userData);
          setCurrentUser({ username });
        closeAuthModal();
        alert('注册成功，已自动登录');
        if (pendingRedirect) {
            const targetSection = pendingRedirectSection || sections.find(section => section.href === pendingRedirect);
            const target = pendingRedirect;
            pendingRedirect = null;
            pendingRedirectSection = null;
            setTimeout(() => {
              if (targetSection) navigateToSection(targetSection);
              else location.href = target;
            }, 120);
          }
        } catch (err) {
          console.error(err);
          alert('注册失败，请检查密钥、Bucket、Region、CORS 或网络');
        }
        return;
      }

      try {
        const userData = await getUserByName(username);
        if (!userData || !(await verifyPassword(userData, password))) {
          alert('用户名或密码错误');
          return;
        }
        try {
          await upgradePasswordIfNeeded(userData, password);
        } catch (upgradeErr) {
          console.warn('密码记录升级失败，将继续登录', upgradeErr);
        }
        setCurrentUser({ username });
        closeAuthModal();
        alert('登录成功');
        if (pendingRedirect) {
          const targetSection = pendingRedirectSection || sections.find(section => section.href === pendingRedirect);
          const target = pendingRedirect;
          pendingRedirect = null;
          pendingRedirectSection = null;
          setTimeout(() => {
            if (targetSection) navigateToSection(targetSection);
            else location.href = target;
          }, 120);
        }
      } catch (err) {
        console.error(err);
        alert('登录失败，请检查密钥、Bucket、Region、CORS 或网络');
      }
    });

    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) {
        pendingRedirect = null;
        pendingRedirectSection = null;
        closeAuthModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        pendingRedirect = null;
        pendingRedirectSection = null;
        closeAuthModal();
      }
    });

    setProgress(18);
    buildSections();
    setProgress(42);
    renderAuthState();
    setupGsapStory();
    setupHeroBridge();
    setupMotion();
    setProgress(68);

    let loadedImages = 0;
    let loadFinished = false;

    function finishLoadingOnce() {
      if (loadFinished) return;
      loadFinished = true;
      finishLoading();
    }

    const imagePreloads = sectionImageSources.map((src) => new Promise((resolve) => {
      const image = new Image();
      image.decoding = 'async';
      image.onload = async () => {
        try {
          if (image.decode) await image.decode();
        } catch {}
        loadedImages += 1;
        setProgress(68 + Math.round((loadedImages / sectionImageSources.length) * 22));
        resolve();
      };
      image.onerror = () => {
        loadedImages += 1;
        setProgress(68 + Math.round((loadedImages / sectionImageSources.length) * 22));
        resolve();
      };
      image.src = src;
    }));

    Promise.all(imagePreloads).then(finishLoadingOnce);
    window.addEventListener('load', () => setProgress(86), { once: true });
  </script>
</body>
</html>
