<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nuonuo小窝</title>
  <style>
    :root {
      --bg1: #f7f8fb;
      --bg2: #eef5ff;
      --bg3: #fff7fb;
      --text: #1d1d1f;
      --subtext: #6e6e73;
      --panel: rgba(255, 255, 255, 0.66);
      --panel-strong: rgba(255, 255, 255, 0.88);
      --stroke: rgba(255, 255, 255, 0.78);
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.10);
      --shadow-soft: 0 12px 32px rgba(15, 23, 42, 0.07);
      --primary: #0a84ff;
      --primary-2: #0071e3;
      --danger: #ff3b30;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      background:
        radial-gradient(circle at 18% 12%, rgba(10, 132, 255, 0.12), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(191, 90, 242, 0.10), transparent 22%),
        radial-gradient(circle at 74% 90%, rgba(48, 209, 88, 0.09), transparent 24%),
        linear-gradient(180deg, #fbfbfd 0%, #f2f4f8 100%);
      overflow-x: hidden;
    }

    body {
      padding: 18px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -22vh -18vw auto -18vw;
      height: 58vh;
      background:
        radial-gradient(circle at 28% 44%, rgba(10, 132, 255, 0.18), transparent 24%),
        radial-gradient(circle at 58% 22%, rgba(255, 159, 10, 0.10), transparent 20%),
        radial-gradient(circle at 76% 56%, rgba(255, 55, 95, 0.10), transparent 22%);
      filter: blur(28px);
      opacity: .82;
      pointer-events: none;
      animation: ambientDrift 13s ease-in-out infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.38) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.28) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.24), transparent 58%);
      pointer-events: none;
    }

    @keyframes ambientDrift {
      from { transform: translate3d(-2%, 0, 0) scale(1); }
      to { transform: translate3d(2%, 4%, 0) scale(1.06); }
    }

    .page {
      max-width: 880px;
      margin: 0 auto;
      min-height: calc(100vh - 36px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
      animation: pageIn .55s ease both;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .topbar {
      background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.54));
      backdrop-filter: saturate(180%) blur(28px);
      -webkit-backdrop-filter: saturate(180%) blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 22px;
      box-shadow: var(--shadow-soft);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-dot {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,.92), rgba(255,255,255,.18) 24%, transparent 25%),
        linear-gradient(145deg, #8ec5ff 0%, #b389ff 48%, #ff9fb8 100%);
      box-shadow:
        0 9px 18px rgba(84, 112, 255, 0.18),
        inset 0 1px 0 rgba(255,255,255,.62);
      flex: 0 0 auto;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 760;
      color: var(--text);
      white-space: nowrap;
    }

    .hero-wrap {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 2px;
    }

    .hero {
      width: min(100%, 720px);
      background:
        linear-gradient(180deg, rgba(255,255,255,.76), rgba(255,255,255,.58)),
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.72), transparent 28%);
      backdrop-filter: saturate(190%) blur(30px);
      -webkit-backdrop-filter: saturate(190%) blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 32px 30px 26px;
      overflow: hidden;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: auto -80px -120px auto;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(10,132,255,.13) 0%, rgba(10,132,255,0) 68%);
      pointer-events: none;
      animation: haloFloat 9s ease-in-out infinite alternate;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,.42) 42%, transparent 64%);
      transform: translateX(-78%);
      opacity: .42;
      pointer-events: none;
      animation: sheen 7s ease-in-out infinite;
    }

    @keyframes haloFloat {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(-16px, -10px, 0) scale(1.05); }
    }

    @keyframes sheen {
      0%, 42% { transform: translateX(-82%); }
      68%, 100% { transform: translateX(82%); }
    }

    .hero h1 {
      margin: 0;
      font-size: 44px;
      line-height: 1.12;
      letter-spacing: 0;
      font-weight: 850;
      position: relative;
      z-index: 1;
    }

    .hero p {
      margin: 10px 0 0;
      color: var(--subtext);
      font-size: 15px;
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }

    .app-grid {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(4, minmax(82px, 1fr));
      gap: 18px 12px;
      max-width: 620px;
      position: relative;
      z-index: 1;
    }

    .app-link {
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      animation: appIn .5s ease both;
    }

    .app-icon {
      width: 70px;
      aspect-ratio: 1 / 1;
      border-radius: 19px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
      box-shadow:
        0 12px 26px rgba(15, 23, 42, 0.12),
        inset 0 1px 0 rgba(255,255,255,.48);
      border: 1px solid rgba(255,255,255,.42);
    }

    .app-icon::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,.52), transparent 28%),
        radial-gradient(circle at 75% 88%, rgba(255,255,255,.14), transparent 26%);
      pointer-events: none;
    }

    .app-icon::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 42%;
      background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.12));
      pointer-events: none;
    }

    .app-link:hover .app-icon {
      transform: translateY(-4px) scale(1.025);
      box-shadow:
        0 18px 34px rgba(15, 23, 42, 0.15),
        inset 0 1px 0 rgba(255,255,255,.52);
    }

    .app-link:active .app-icon {
      transform: translateY(-1px) scale(.98);
    }

    .app-icon svg {
      width: 30px;
      height: 30px;
      display: block;
      color: #fff;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.12));
    }

    .app-icon.has-image {
      background: transparent;
      border: none;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.12);
    }

    .app-icon.has-image::before,
    .app-icon.has-image::after {
      display: none;
    }

    .app-icon.has-image img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-icon.has-image svg {
      display: none;
    }

    .icon-photo {
      background: linear-gradient(160deg, #78c7ff 0%, #3b82f6 54%, #2563eb 100%);
    }

    .icon-days {
      background: linear-gradient(160deg, #9ad7ff 0%, #54b4d3 52%, #2f80ed 100%);
    }

    .icon-message {
      background: linear-gradient(160deg, #9de7d7 0%, #34c759 48%, #10a37f 100%);
    }

    .icon-game {
      background: linear-gradient(160deg, #ffc1d6 0%, #ff5f8f 50%, #d946ef 100%);
    }

    .icon-drink {
      background: linear-gradient(160deg, #ffe0a6 0%, #ff9f0a 48%, #ff6b35 100%);
    }

    .icon-pet {
      background: linear-gradient(160deg, #c7b9ff 0%, #8b5cf6 52%, #5e5ce6 100%);
    }

    .icon-video {
      background: linear-gradient(160deg, #8ee9ff 0%, #0a84ff 48%, #0057d9 100%);
    }

    @keyframes appIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .app-link:nth-child(1) { animation-delay: .04s; }
    .app-link:nth-child(2) { animation-delay: .08s; }
    .app-link:nth-child(3) { animation-delay: .12s; }
    .app-link:nth-child(4) { animation-delay: .16s; }
    .app-link:nth-child(5) { animation-delay: .20s; }
    .app-link:nth-child(6) { animation-delay: .24s; }
    .app-link:nth-child(7) { animation-delay: .28s; }

    .app-label {
      font-size: 13px;
      font-weight: 650;
      color: #1f2328;
      letter-spacing: 0;
      text-align: center;
    }

    .bottom-space {
      flex: 1;
      min-height: 120px;
      background:
        radial-gradient(circle at 50% 85%, rgba(170, 255, 200, 0.10), transparent 25%);
      border-radius: 24px;
    }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .auth-status {
      font-size: 13px;
      color: var(--subtext);
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(0, 0, 0, 0.05);
      white-space: nowrap;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .btn {
      border: none;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, background .2s ease, box-shadow .2s ease, opacity .2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      font-size: 14px;
    }

    .btn:hover { transform: translateY(-1px); }

    .primary-btn {
      background: linear-gradient(180deg, #0a84ff 0%, #0071e3 100%);
      color: #fff;
      box-shadow: 0 10px 22px rgba(0,113,227,.24);
    }

    .ghost-btn {
      background: rgba(0,0,0,.06);
      color: var(--text);
    }

    .danger-btn {
      background: rgba(255,59,48,.92);
      color: #fff;
      box-shadow: 0 8px 18px rgba(255,59,48,.18);
    }

    .logout-btn {
      padding: 8px 12px;
      min-width: 88px;
      width: auto;
      flex: 0 0 auto;
    }
    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .auth-modal.show { display: flex; }

    .auth-modal-card {
      width: min(92vw, 420px);
      border-radius: 24px;
      background: rgba(255,255,255,.95);
      border: 1px solid rgba(255,255,255,.3);
      box-shadow: 0 30px 80px rgba(0,0,0,.28);
      overflow: hidden;
      animation: modalIn .22s ease both;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(8px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-modal-head {
      padding: 18px 20px 12px;
      border-bottom: 1px solid rgba(0,0,0,.06);
    }

    .auth-modal-head h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .auth-modal-head p {
      margin: 8px 0 0;
      color: var(--subtext);
      font-size: 13px;
      line-height: 1.7;
    }

    .auth-modal-body {
      padding: 18px 20px 20px;
      display: grid;
      gap: 12px;
    }

    .auth-field {
      display: grid;
      gap: 8px;
    }

    .auth-field label {
      font-size: 13px;
      color: var(--subtext);
      font-weight: 700;
    }

    .auth-input {
      height: 46px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.08);
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      background: rgba(255,255,255,.96);
    }

    .auth-input:focus {
      border-color: rgba(0,113,227,.28);
      box-shadow: 0 0 0 4px rgba(0,113,227,.10);
    }

    .auth-modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .auth-modal-actions button {
      flex: 1 1 0;
      min-width: 120px;
      height: 44px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-modal-actions .ok {
      background: linear-gradient(180deg, #0a84ff 0%, #0071e3 100%);
      color: #fff;
    }

    .auth-modal-actions .cancel {
      background: rgba(0,0,0,.06);
      color: var(--text);
    }

    .auth-switch {
      font-size: 13px;
      color: var(--subtext);
      cursor: pointer;
      user-select: none;
      text-decoration: underline;
    }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .page {
        min-height: calc(100vh - 24px);
      }
      .topbar {
        border-radius: 22px;
        padding: 14px 16px;
      }
      .hero {
        border-radius: 24px;
        padding: 24px 18px 22px;
      }
      .hero h1 {
        font-size: 32px;
      }
      .hero p {
        font-size: 14px;
      }
      .app-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px 10px;
        max-width: 100%;
      }
      .app-icon {
        width: 62px;
        max-width: none;
        margin: 0 auto;
        border-radius: 18px;
      }
      .app-icon svg {
        width: 27px;
        height: 27px;
      }
      .app-label {
        font-size: 12px;
      }
      .bottom-space {
        min-height: 90px;
      }
      .auth-box {
        width: 100%;
      }
      .btn {
        width: 100%;
      }
      /* 手机上也保持“退出登录”按钮更短 */
      .auth-box .logout-btn {
        width: auto;
      }
    }

    @media (min-width: 721px) and (max-width: 900px) {
      .app-grid {
        grid-template-columns: repeat(4, minmax(80px, 1fr));
        max-width: 100%;
      }
    }

    @media (max-width: 380px) {
      .app-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    body.room-home {
      --mx: 0;
      --my: 0;
      --cursor-x: 50vw;
      --cursor-y: 50vh;
      padding: 0;
      min-height: 100dvh;
      background: #17110c;
      overflow: hidden;
    }

    .room-viewport {
      width: 100vw;
      height: 100dvh;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      background: #17110c;
      -webkit-overflow-scrolling: touch;
    }

    .room-viewport::-webkit-scrollbar {
      display: none;
    }

    .room-stage {
      width: max(100vw, calc(100dvh * 1.453125));
      height: 100dvh;
      min-width: 1180px;
      position: relative;
      margin: 0 auto;
      isolation: isolate;
      overflow: hidden;
      background: #17110c;
      scroll-snap-align: center;
      perspective: 1100px;
    }

    .room-world {
      position: absolute;
      inset: 0;
    }

    .room-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .room-3d {
      position: absolute;
      inset: 0;
      z-index: 4;
      width: 100%;
      height: 100%;
      pointer-events: none;
      filter: saturate(.96);
      opacity: 1;
    }

    .room-auth {
      position: fixed;
      top: clamp(14px, 2.5vh, 26px);
      right: clamp(18px, 3vw, 42px);
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 252, 245, .34);
      border: 1px solid rgba(255,255,255,.38);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #4d3826;
      font-family: Georgia, "Times New Roman", "Songti SC", serif;
      font-size: clamp(13px, 1.55vh, 16px);
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,.3);
    }

    .room-auth .auth-status {
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font-size: inherit;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .room-auth .btn {
      padding: 0 0 0 8px;
      min-width: 0;
      width: auto;
      height: auto;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: inherit;
      font: inherit;
      border-left: 1px solid rgba(77,56,38,.46);
    }

    .room-auth .btn:hover {
      transform: none;
      opacity: .72;
    }

    .room-auth .ghost-btn {
      display: inline-flex;
    }

    .room-hotspot {
      position: absolute;
      z-index: 10;
      width: clamp(54px, 6.6vh, 78px);
      height: clamp(54px, 6.6vh, 78px);
      border-radius: 999px;
      transform: translate(-50%, -50%);
      cursor: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      outline: none;
    }

    .room-hotspot::before {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: transparent;
      box-shadow: none;
      transition: transform .18s ease, opacity .18s ease;
    }

    .room-hotspot::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      border: 1px solid transparent;
    }

    .room-hotspot:focus-visible::after {
      border-color: rgba(255,255,255,.9);
      box-shadow: 0 0 0 6px rgba(255,255,255,.24);
    }

    .room-hotspot:active::after {
      background: rgba(255,255,255,.16);
    }

    @keyframes roomPulse {
      0%, 100% { opacity: .42; transform: translate(-50%, -50%) scale(.86); }
      50% { opacity: .82; transform: translate(-50%, -50%) scale(1.12); }
    }

    .hotspot-photo { left: 12.25%; top: 19.45%; }
    .hotspot-days { left: 23.95%; top: 47.85%; }
    .hotspot-message { left: 8.55%; top: 60.1%; }
    .hotspot-game { left: 42.15%; top: 66.15%; }
    .hotspot-pet { left: 68.0%; top: 67.9%; }
    .hotspot-drink { left: 91.0%; top: 67.15%; }
    .hotspot-video { left: 83.5%; top: 35.7%; }

    .room-cursor {
      position: fixed;
      left: var(--cursor-x);
      top: var(--cursor-y);
      z-index: 40;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      opacity: 0;
      mix-blend-mode: screen;
      background:
        radial-gradient(circle, rgba(255,255,255,.98) 0 13%, rgba(255,255,255,.46) 14% 30%, transparent 62%);
      box-shadow: 0 0 18px rgba(255,255,255,.72), 0 0 38px rgba(255,255,255,.38);
      transition: opacity .16s ease, width .16s ease, height .16s ease;
      animation: cursorBlink 1.25s ease-in-out infinite;
    }

    .room-home.has-cursor .room-cursor {
      opacity: .86;
    }

    .room-home.hotspot-hover .room-cursor {
      width: 46px;
      height: 46px;
      opacity: 1;
    }

    @keyframes cursorBlink {
      0%, 100% { filter: brightness(1); }
      45% { filter: brightness(1.38); }
      62% { filter: brightness(.78); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;

  <script>
    const SECRET_ID = 'AKIDhojT7ey61jEkHhw0830qVyGUWSDpFnEW';
    const SECRET_KEY = 'GNIAMaieZyOehhWBi9QWUL4czCHAsQuG';
    const BUCKET = 'photoalbum-123456-1395234423';
    const REGION = 'ap-beijing';

    const AUTH_USER_PREFIX = 'users/';
    const LS_CURRENT_USER = 'site_current_user_v1';

    const cos = new COS({
      SecretId: SECRET_ID,
      SecretKey: SECRET_KEY,
    });

    const authBox = document.getElementById('authBox');
    const authModal = document.getElementById('authModal');
    const authTitle = document.getElementById('authTitle');
    const authDesc = document.getElementById('authDesc');
    const authUsername = document.getElementById('authUsername');
    const authPassword = document.getElementById('authPassword');
    const authPassword2 = document.getElementById('authPassword2');
    const authPassword2Wrap = document.getElementById('authPassword2Wrap');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authCancelBtn = document.getElementById('authCancelBtn');
    const authSwitchBtn = document.getElementById('authSwitchBtn');

    let pendingRedirect = null;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizeUsername(name) {
      return String(name || '').trim();
    }

    const PASSWORD_ITERATIONS = 120000;

    function bytesToBase64(bytes) {
      let binary = '';
      bytes.forEach((byte) => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function hashPassword(password, saltBase64) {
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(password),
        'PBKDF2',
        false,
        ['deriveBits']
      );
      const bits = await crypto.subtle.deriveBits({
        name: 'PBKDF2',
        hash: 'SHA-256',
        salt: base64ToBytes(saltBase64),
        iterations: PASSWORD_ITERATIONS,
      }, keyMaterial, 256);
      return bytesToBase64(new Uint8Array(bits));
    }

    async function createPasswordRecord(password) {
      const salt = new Uint8Array(16);
      crypto.getRandomValues(salt);
      const passwordSalt = bytesToBase64(salt);
      return {
        passwordAlgo: 'PBKDF2-SHA256',
        passwordIterations: PASSWORD_ITERATIONS,
        passwordSalt,
        passwordHash: await hashPassword(password, passwordSalt),
      };
    }

    async function verifyPassword(user, password) {
      if (!user) return false;
      if (user.passwordHash && user.passwordSalt) {
        return await hashPassword(password, user.passwordSalt) === user.passwordHash;
      }
      return typeof user.password === 'string' && user.password === password;
    }

    async function upgradePasswordIfNeeded(user, password) {
      if (!user || user.passwordHash || user.password !== password) return;
      const upgradedUser = {
        ...user,
        ...(await createPasswordRecord(password)),
      };
      delete upgradedUser.password;
      await putJsonToCos(makeUserKey(user.username), upgradedUser);
    }

    function getCurrentUser() {
      try {
        const raw = localStorage.getItem(LS_CURRENT_USER);
        if (!raw) return null;
        const user = JSON.parse(raw);
        if (!user || !user.username) return null;
        return user;
      } catch {
        return null;
      }
    }

    function setCurrentUser(user) {
      if (!user) {
        localStorage.removeItem(LS_CURRENT_USER);
      } else {
        localStorage.setItem(LS_CURRENT_USER, JSON.stringify(user));
      }
      renderAuthState();
    }

    function makeUserKey(username) {
      return `${AUTH_USER_PREFIX}${encodeURIComponent(username)}.json`;
    }

    function putJsonToCos(key, obj) {
      return new Promise((resolve, reject) => {
        cos.putObject({
          Bucket: BUCKET,
          Region: REGION,
          Key: key,
          Body: JSON.stringify(obj, null, 2),
          ContentType: 'application/json; charset=utf-8',
        }, function (err, data) {
          if (err) return reject(err);
          resolve(data);
        });
      });
    }

    function getObjectText(key) {
      return new Promise((resolve, reject) => {
        cos.getObject({
          Bucket: BUCKET,
          Region: REGION,
          Key: key,
        }, async function (err, data) {
          if (err) return reject(err);
          try {
            const body = data.Body;
            if (typeof body === 'string') return resolve(body);
            if (body instanceof Blob) return resolve(await body.text());
            if (body && typeof body.text === 'function') return resolve(await body.text());
            if (body instanceof ArrayBuffer) {
              return resolve(new TextDecoder('utf-8').decode(body));
            }
            if (ArrayBuffer.isView(body)) {
              return resolve(new TextDecoder('utf-8').decode(body));
            }
            resolve(String(body || ''));
          } catch (e) {
            reject(e);
          }
        });
      });
    }

    async function getUserByName(username) {
      const key = makeUserKey(username);
      try {
        const text = await getObjectText(key);
        return JSON.parse(text);
      } catch (err) {
        if (err && (err.statusCode === 404 || (err.error && err.error.Code === 'NoSuchKey'))) {
          return null;
        }
        if (String(err && err.message || '').includes('404')) return null;
        throw err;
      }
    }

    function setAuthMode(mode) {
      const isRegister = mode === 'register';
      authModal.dataset.mode = mode;
      authTitle.textContent = isRegister ? '注册' : '登录';
      authDesc.textContent = isRegister
        ? '注册后即可使用同一账号进入各个页面。'
        : '登录后可打开小游戏并保存你的进度。';
      authSubmitBtn.textContent = isRegister ? '注册' : '登录';
      authSwitchBtn.textContent = isRegister ? '已有账号？去登录' : '没有账号？去注册';
      authPassword2Wrap.style.display = isRegister ? '' : 'none';
      authPassword.value = '';
      authPassword2.value = '';
    }

    function openAuthModal(mode = 'login') {
      setAuthMode(mode);
      authModal.classList.add('show');
      authModal.setAttribute('aria-hidden', 'false');
      setTimeout(() => authUsername.focus(), 0);
    }

    function closeAuthModal() {
      authModal.classList.remove('show');
      authModal.setAttribute('aria-hidden', 'true');
    }

    function renderAuthState() {
      const user = getCurrentUser();

      if (user) {
        authBox.innerHTML = `
          <div class="auth-status">当前登录：${escapeHtml(user.username)}</div>
          <button class="btn danger-btn logout-btn" id="logoutBtn" type="button">退出登录</button>
        `;
      } else {
        authBox.innerHTML = `
          <div class="auth-status">未登录</div>
          <button class="btn primary-btn" id="loginBtn" type="button">登录</button>
          <button class="btn ghost-btn" id="registerBtn" type="button">注册</button>
        `;
      }

      const loginBtn = document.getElementById('loginBtn');
      const registerBtn = document.getElementById('registerBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      if (loginBtn) loginBtn.onclick = () => openAuthModal('login');
      if (registerBtn) registerBtn.onclick = () => openAuthModal('register');
      if (logoutBtn) {
        logoutBtn.onclick = () => {
          if (!confirm('确定要退出登录吗？')) return;
          setCurrentUser(null);
          alert('已退出登录');
        };
      }
    }

    // 只有标记了 data-requires-auth="true" 的入口才需要登录
    document.querySelectorAll('.app-link[data-requires-auth="true"]').forEach(link => {
      link.addEventListener('click', (e) => {
        if (getCurrentUser()) return;
        e.preventDefault();
        pendingRedirect = link.getAttribute('href');
        openAuthModal('login');
      });
    });

    authCancelBtn.addEventListener('click', () => {
      pendingRedirect = null;
      closeAuthModal();
    });

    authSwitchBtn.addEventListener('click', () => {
      const mode = authModal.dataset.mode === 'register' ? 'login' : 'register';
      setAuthMode(mode);
    });

    authSubmitBtn.addEventListener('click', async () => {
      const mode = authModal.dataset.mode || 'login';
      const username = sanitizeUsername(authUsername.value);
      const password = authPassword.value;
      const password2 = authPassword2.value;

      if (!username || !password) {
        alert('请输入用户名和密码');
        return;
      }

      if (username.length < 2) {
        alert('用户名至少 2 个字符');
        return;
      }

      if (mode === 'register') {
        if (password.length < 4) {
          alert('密码至少 4 位');
          return;
        }
        if (password !== password2) {
          alert('两次密码不一致');
          return;
        }

        try {
          const oldUser = await getUserByName(username);
          if (oldUser) {
            alert('这个用户名已经存在了');
            return;
          }

          const userData = {
            username,
            ...(await createPasswordRecord(password)),
            createdAt: new Date().toISOString()
          };

          await putJsonToCos(makeUserKey(username), userData);
          setCurrentUser({ username });
          closeAuthModal();
          alert('注册成功，已自动登录');

          if (pendingRedirect) {
            const target = pendingRedirect;
            pendingRedirect = null;
            setTimeout(() => {
              location.href = target;
            }, 120);
          }
        } catch (err) {
          console.error(err);
          alert('注册失败，请检查密钥、Bucket、Region、CORS 或网络');
        }
        return;
      }

      try {
        const userData = await getUserByName(username);
        if (!userData || !(await verifyPassword(userData, password))) {
          alert('用户名或密码错误');
          return;
        }
        try {
          await upgradePasswordIfNeeded(userData, password);
        } catch (upgradeErr) {
          console.warn('密码记录升级失败，将继续登录', upgradeErr);
        }
        setCurrentUser({ username });
        closeAuthModal();
        alert('登录成功');

        if (pendingRedirect) {
          const target = pendingRedirect;
          pendingRedirect = null;
          setTimeout(() => {
            location.href = target;
          }, 120);
        }
      } catch (err) {
        console.error(err);
        alert('登录失败，请检查密钥、Bucket、Region、CORS 或网络');
      }
    });

    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) {
        pendingRedirect = null;
        closeAuthModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        pendingRedirect = null;
        closeAuthModal();
      }
    });

    function centerRoomViewport() {
      const viewport = document.getElementById('roomViewport');
      if (!viewport || viewport.scrollWidth <= viewport.clientWidth) return;
      viewport.scrollLeft = (viewport.scrollWidth - viewport.clientWidth) / 2;
    }

    function setupRoomDepth() {
      const body = document.body;
      const viewport = document.getElementById('roomViewport');
      const stage = document.querySelector('.room-stage');
      const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (!viewport || !stage || !finePointer) return;

      let raf = 0;
      let lastEvent = null;
      let activeHotspot = null;

      const applyDepth = () => {
        raf = 0;
        if (!lastEvent) return;
        const rect = viewport.getBoundingClientRect();
        const x = (lastEvent.clientX - rect.left) / rect.width;
        const y = (lastEvent.clientY - rect.top) / rect.height;
        const mx = Math.max(-1, Math.min(1, (x - .5) * 2));
        const my = Math.max(-1, Math.min(1, (y - .5) * 2));
        body.style.setProperty('--mx', mx.toFixed(3));
        body.style.setProperty('--my', my.toFixed(3));
        if (activeHotspot) {
          const hotspotRect = activeHotspot.getBoundingClientRect();
          body.style.setProperty('--cursor-x', `${hotspotRect.left + hotspotRect.width / 2}px`);
          body.style.setProperty('--cursor-y', `${hotspotRect.top + hotspotRect.height / 2}px`);
        } else {
          body.style.setProperty('--cursor-x', `${lastEvent.clientX}px`);
          body.style.setProperty('--cursor-y', `${lastEvent.clientY}px`);
        }
      };

      viewport.addEventListener('pointermove', (event) => {
        lastEvent = event;
        body.classList.add('has-cursor');
        if (!raf) raf = requestAnimationFrame(applyDepth);
      });

      viewport.addEventListener('pointerleave', () => {
        body.classList.remove('has-cursor', 'hotspot-hover');
        body.style.setProperty('--mx', '0');
        body.style.setProperty('--my', '0');
      });

      document.querySelectorAll('.room-hotspot').forEach((hotspot) => {
        hotspot.addEventListener('pointerenter', () => {
          activeHotspot = hotspot;
          body.classList.add('hotspot-hover');
          if (!raf) raf = requestAnimationFrame(applyDepth);
        });
        hotspot.addEventListener('pointerleave', () => {
          activeHotspot = null;
          body.classList.remove('hotspot-hover');
        });
      });
    }

    window.addEventListener('load', centerRoomViewport, { once: true });
    window.addEventListener('resize', centerRoomViewport);
    setupRoomDepth();
    renderAuthState();
  </script>

        g.add(box(.78, .08, .08, wood, 0, .58, .04));
        g.add(box(.08, .9, .08, wood, -.46, -.18, -.05));
        g.add(box(.08, .9, .08, wood, .46, -.18, -.05));
        for (let i = 0; i < 3; i++) {
          const ring = new THREE.Mesh(new THREE.TorusGeometry(.065, .012, 10, 20), brass);
          ring.position.set((i - 1) * .18, .62, .08);
          ring.rotation.x = Math.PI / 2;
          g.add(ring);
        }
        g.rotation.y = -.18;
        dot(g);
        return g;
      }

      function makeGame() {
        const g = new THREE.Group();
        const pad = new THREE.Mesh(new THREE.CapsuleGeometry(.16, .38, 8, 16), dark);
        pad.rotation.z = Math.PI / 2;
        pad.scale.set(1.45, .75, .28);
        g.add(pad);
        g.add(box(.11, .025, .035, white, -.16, .02, .14));
        g.add(box(.025, .11, .035, white, -.16, .02, .14));
        const btn1 = new THREE.Mesh(new THREE.SphereGeometry(.045, 12, 8), white);
        btn1.position.set(.2, .05, .14);
        const btn2 = btn1.clone();
        btn2.position.set(.28, -.02, .14);
        g.add(btn1, btn2);
        g.rotation.x = -.85;
        g.rotation.z = -.03;
        dot(g);
        return g;
      }

      function makePet() {
        const g = new THREE.Group();
        const bed = new THREE.Mesh(new THREE.TorusGeometry(.38, .11, 14, 40), fabric);
        bed.rotation.x = Math.PI / 2;
        g.add(bed);
        const cushion = new THREE.Mesh(new THREE.SphereGeometry(.28, 24, 14), fabric);
        cushion.scale.set(1.1, .24, .82);
        cushion.position.z = -.02;
        g.add(cushion);
        g.rotation.x = -.8;
        dot(g);
        return g;
      }

      function makeDrink() {
        const g = new THREE.Group();
        g.add(box(.82, .08, .42, brass, 0, .18, 0));
        g.add(box(.82, .08, .42, brass, 0, -.18, 0));
        for (const x of [-.35, .35]) {
          for (const y of [-.22, .22]) g.add(box(.045, .72, .045, brass, x, 0, y));
        }
        for (let i = 0; i < 3; i++) {
          const glass = new THREE.Mesh(new THREE.CylinderGeometry(.055, .075, .28, 16), new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: .36,
            roughness: .08,
            transmission: .45
          }));
          glass.position.set((i - 1) * .18, .02, .08);
          g.add(glass);
        }
        g.rotation.y = -.38;
        dot(g);
        return g;
      }

      function makeVideo() {
        const g = new THREE.Group();
        g.add(box(.95, .55, .055, new THREE.MeshStandardMaterial({ color: 0x1b1715, roughness: .34, metalness: .26 }), 0, 0, 0));
        const play = new THREE.Shape();
        play.moveTo(-.08, -.11);
        play.lineTo(-.08, .11);
        play.lineTo(.12, 0);
        play.lineTo(-.08, -.11);
        const mesh = new THREE.Mesh(new THREE.ShapeGeometry(play), white);
        mesh.position.z = .04;
        g.add(mesh);
        g.rotation.y = -.28;
        dot(g);
        return g;
      }

      const makers = {
        photo: makePhotoWall,
        message: makeMemoBoard,
        days: makeCalendar,
        game: makeGame,
        pet: makePet,
        drink: makeDrink,
        video: makeVideo
      };

      for (const item of hotspots) {
        const group = makers[item.id]();
        group.userData.baseScale = item.id === 'drink' ? .46 : item.id === 'video' ? .42 : .38;
        group.userData.depth = item.z;
        groups.set(item.id, group);
        scene.add(group);
      }

      function resize() {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
        renderer.setPixelRatio(dpr);
        renderer.setSize(rect.width, rect.height, false);
        camera.aspect = rect.width / rect.height;
        camera.updateProjectionMatrix();
        view.h = 11;
        view.w = view.h * camera.aspect;
        for (const item of hotspots) {
          const group = groups.get(item.id);
          const pos = toWorld(item.x, item.y, item.z);
          group.position.copy(pos);
          group.userData.basePosition = pos.clone();
          group.userData.baseRotationZ = group.rotation.z;
          const s = group.userData.baseScale * Math.min(1.1, Math.max(.84, rect.height / 900));
          group.scale.setScalar(s);
        }
      }

      function animate() {
        currentX += (targetX - currentX) * .08;
        currentY += (targetY - currentY) * .08;
        camera.position.x = currentX * .75;
        camera.position.y = currentY * -.36;
        camera.lookAt(currentX * .22, currentY * -.12, 0);
        for (const [id, group] of groups) {
          const depth = group.userData.depth || 1;
          const base = group.userData.basePosition;
          if (base) {
            group.position.set(base.x + currentX * depth * .08, base.y - currentY * depth * .04, base.z);
          }
          group.rotation.z = (group.userData.baseRotationZ || 0) + Math.sin(performance.now() / 1200 + depth) * .015;
        }
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      const viewport = document.getElementById('roomViewport');
      viewport.addEventListener('pointermove', (event) => {
        const rect = viewport.getBoundingClientRect();
        targetX = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - .5) * 2));
        targetY = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - .5) * 2));
      });
      viewport.addEventListener('pointerleave', () => {
        targetX = 0;
        targetY = 0;
      });

      window.addEventListener('resize', resize);
      resize();
      animate();
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const canvas3d = document.getElementById('room3d');
    const stage3d = document.querySelector('.room-stage');

    if (canvas3d && stage3d) {
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas3d,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.03;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe9f4fb);
      scene.fog = new THREE.Fog(0xe9f4fb, 26, 58);

      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 90);
      camera.position.set(0, 2.35, 8.8);
      camera.lookAt(0, 1.25, 0);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x6b523e, 1.45);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xfff3df, 3.2);
      sun.position.set(-6, 8, 8);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 30;
      sun.shadow.camera.left = -10;
      sun.shadow.camera.right = 10;
      sun.shadow.camera.top = 8;
      sun.shadow.camera.bottom = -8;
      scene.add(sun);

      const warmLamp = new THREE.PointLight(0xffc98d, 1.15, 12);
      warmLamp.position.set(5.7, 2.2, -1.1);
      scene.add(warmLamp);

      const mat = {
        floor: new THREE.MeshStandardMaterial({ color: 0xb7aa9d, roughness: .62, metalness: .05 }),
        wall: new THREE.MeshStandardMaterial({ color: 0xe9e2da, roughness: .84, metalness: .02 }),
        ceiling: new THREE.MeshStandardMaterial({ color: 0xf2eee8, roughness: .9 }),
        wood: new THREE.MeshStandardMaterial({ color: 0x8f6a45, roughness: .48, metalness: .08 }),
        stone: new THREE.MeshStandardMaterial({ color: 0xcac3bb, roughness: .68, metalness: .04 }),
        glass: new THREE.MeshPhysicalMaterial({ color: 0xdff4ff, roughness: .04, metalness: 0, transmission: .45, transparent: true, opacity: .36 }),
        ocean: new THREE.MeshStandardMaterial({ color: 0x5d9fc2, roughness: .34, metalness: .02 }),
        dark: new THREE.MeshStandardMaterial({ color: 0x151413, roughness: .5, metalness: .18 }),
        paper: new THREE.MeshStandardMaterial({ color: 0xf4eadc, roughness: .75 }),
        cork: new THREE.MeshStandardMaterial({ color: 0xb8a188, roughness: .88 }),
        brass: new THREE.MeshStandardMaterial({ color: 0xb58a52, roughness: .34, metalness: .72 }),
        glow: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .82 })
      };

      function mesh(geometry, material, position, rotation = [0, 0, 0], scale = [1, 1, 1]) {
        const object = new THREE.Mesh(geometry, material);
        object.position.set(...position);
        object.rotation.set(...rotation);
        object.scale.set(...scale);
        object.castShadow = true;
        object.receiveShadow = true;
        scene.add(object);
        return object;
      }

      function box(w, h, d, material, position, rotation, scale) {
        return mesh(new THREE.BoxGeometry(w, h, d), material, position, rotation, scale);
      }

      function addGlow(position, size = .13) {
        const core = mesh(new THREE.SphereGeometry(size, 32, 16), mat.glow, position);
        core.castShadow = false;
        core.receiveShadow = false;
        const halo = mesh(new THREE.SphereGeometry(size * 2.6, 32, 16), new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: .16,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        }), position);
        halo.castShadow = false;
        halo.receiveShadow = false;
      }

      function addRoomShell() {
        box(15, .12, 12, mat.floor, [0, -.05, 0]);
        box(15, .18, 12, mat.ceiling, [0, 5.05, 0]);
        box(.16, 5.2, 12, mat.wall, [-7.45, 2.5, 0]);
        box(.16, 5.2, 12, mat.wall, [7.45, 2.5, 0]);
        box(15, 5.2, .16, mat.wall, [0, 2.5, -5.95]);
        box(2.2, 4.2, .12, mat.wall, [-6.35, 2.3, -5.86]);
        box(2.2, 4.2, .12, mat.wall, [6.35, 2.3, -5.86]);

        const windowGlass = box(8.6, 3.25, .06, mat.glass, [0, 2.55, -5.76]);
        windowGlass.castShadow = false;
        box(.08, 3.42, .12, mat.stone, [-4.3, 2.55, -5.7]);
        box(.08, 3.42, .12, mat.stone, [0, 2.55, -5.7]);
        box(.08, 3.42, .12, mat.stone, [4.3, 2.55, -5.7]);
        box(8.85, .08, .12, mat.stone, [0, 4.28, -5.7]);
        box(8.85, .08, .12, mat.stone, [0, .86, -5.7]);

        const ocean = mesh(new THREE.PlaneGeometry(28, 8, 48, 8), mat.ocean, [0, 1.25, -8.7], [-Math.PI / 2.8, 0, 0]);
        ocean.castShadow = false;
        ocean.receiveShadow = false;
        for (let i = 0; i < 8; i++) {
          const wave = box(2.2 + i * .25, .018, .015, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .23 }), [-5 + i * 1.4, 1.4 + Math.sin(i) * .18, -7.45 - i * .08]);
          wave.castShadow = false;
          wave.receiveShadow = false;
        }

        box(4.1, .12, 2.4, mat.wood, [0, .34, 1.75]);
        box(3.1, .11, 1.2, mat.wood, [0, .5, 1.05]);
      }

      function addEntryObjects() {
        const photoGroup = new THREE.Group();
        photoGroup.position.set(-6.9, 2.9, -2.4);
        photoGroup.rotation.y = Math.PI / 2;
        for (let i = 0; i < 7; i++) {
          const frame = new THREE.Mesh(new THREE.BoxGeometry(.44, .58, .045), mat.wood);
          frame.position.set((i % 2) * .54, Math.floor(i / 2) * -.66, 0);
          const face = new THREE.Mesh(new THREE.BoxGeometry(.34, .46, .052), mat.paper);
          face.position.copy(frame.position);
          face.position.z += .035;
          photoGroup.add(frame, face);
        }
        scene.add(photoGroup);
        addGlow([-6.82, 3.35, -2.05]);

        box(1.18, 1.45, .08, mat.cork, [-7.18, 1.75, .5], [0, Math.PI / 2, 0]);
        for (let i = 0; i < 5; i++) {
          box(.28, .2, .05, mat.paper, [-7.1, 2.18 - Math.floor(i / 2) * .38, .17 + (i % 2) * .42], [0, Math.PI / 2, 0]);
        }
        addGlow([-6.96, 1.55, .72]);

        box(.78, 1.18, .08, mat.paper, [-3.85, 2.25, -3.85], [0, -.25, 0]);
        box(.88, .08, .12, mat.wood, [-3.85, 2.9, -3.85], [0, -.25, 0]);
        box(.08, 1.2, .08, mat.wood, [-4.24, 1.68, -3.84], [0, -.25, 0]);
        box(.08, 1.2, .08, mat.wood, [-3.46, 1.68, -3.84], [0, -.25, 0]);
        addGlow([-3.85, 1.55, -3.55]);

        box(.72, .06, .42, mat.dark, [-1.12, .78, 1.25], [0, .15, 0]);
        mesh(new THREE.SphereGeometry(.09, 16, 10), mat.glow, [-1.38, .84, 1.02]);
        mesh(new THREE.SphereGeometry(.07, 16, 10), mat.glow, [-.84, .84, 1.1]);
        addGlow([-1.0, .88, 1.24], .09);

        box(1.9, 1.05, .1, mat.dark, [5.3, 2.75, -3.82], [0, -.28, 0]);
        addGlow([5.3, 2.75, -3.5]);

        box(.85, .05, .55, mat.brass, [6.5, 1.0, 1.25], [0, -.35, 0]);
        box(.85, .05, .55, mat.brass, [6.5, 1.55, 1.25], [0, -.35, 0]);
        addGlow([6.48, 1.2, 1.0]);

        const petBed = mesh(new THREE.TorusGeometry(.48, .14, 18, 48), mat.paper, [3.1, .66, 1.6], [Math.PI / 2, 0, .08]);
        petBed.scale.set(1.15, .82, 1);
        addGlow([3.1, .82, 1.58]);
      }

      const loader = new GLTFLoader();
      function loadModel(url, position, scale, rotation = [0, 0, 0]) {
        loader.load(url, (gltf) => {
          const root = gltf.scene;
          root.position.set(...position);
          root.rotation.set(...rotation);
          root.scale.setScalar(scale);
          root.traverse((node) => {
            if (node.isMesh) {
              node.castShadow = true;
              node.receiveShadow = true;
              if (node.material) {
                node.material.roughness = Math.min(1, (node.material.roughness ?? .6) + .08);
              }
            }
          });
          scene.add(root);
        }, undefined, (error) => console.warn('模型加载失败', url, error));
      }

      addRoomShell();
      addEntryObjects();
      loadModel('./assets/models/polyhaven/Sofa_01/Sofa_01_1k.gltf', [-.25, .12, 3.75], .022, [0, Math.PI, 0]);
      loadModel('./assets/models/polyhaven/coffee_table_round_01/coffee_table_round_01_1k.gltf', [.1, .42, 1.45], .017, [0, .15, 0]);
      loadModel('./assets/models/polyhaven/CoffeeCart_01/CoffeeCart_01_1k.gltf', [6.35, .08, 1.35], .013, [0, -1.35, 0]);

      let target = { x: 0, y: 0 };
      let current = { x: 0, y: 0 };

      function resize() {
        const rect = stage3d.getBoundingClientRect();
        const isSmall = rect.width < 720;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isSmall ? 1.15 : 1.7));
        renderer.setSize(rect.width, rect.height, false);
        camera.aspect = rect.width / rect.height;
        camera.position.set(0, isSmall ? 2.1 : 2.35, isSmall ? 9.7 : 8.8);
        camera.updateProjectionMatrix();
      }

      function animate() {
        current.x += (target.x - current.x) * .075;
        current.y += (target.y - current.y) * .075;
        camera.position.x = current.x * .7;
        camera.position.y = 2.35 - current.y * .28;
        camera.lookAt(current.x * .22, 1.25 - current.y * .16, -.8);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      const viewport = document.getElementById('roomViewport');
      const motionOK = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (motionOK && viewport) {
        viewport.addEventListener('pointermove', (event) => {
          const rect = viewport.getBoundingClientRect();
          target.x = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - .5) * 2));
          target.y = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - .5) * 2));
        });
        viewport.addEventListener('pointerleave', () => {
          target.x = 0;
          target.y = 0;
        });
      }

      window.addEventListener('resize', resize);
      resize();
      animate();
    }
  </script>
