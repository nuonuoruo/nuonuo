<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>nuonuo小窝</title>
  <link rel="preload" href="./assets/work/photo-wall.webp" as="image" />
  <link rel="preload" href="./assets/work/anniversary.webp" as="image" />
  <link rel="preload" href="./assets/work/message-wall.webp" as="image" />
  <link rel="preload" href="./assets/work/heart-game.webp" as="image" />
  <link rel="preload" href="./assets/work/coco-diary.webp" as="image" />
  <link rel="preload" href="./assets/work/drink-game.webp" as="image" />
  <link rel="preload" href="./assets/work/nuonuo-academy.webp" as="image" />
  <style>
    :root {
      color-scheme: light;
      --ink: #0c1422;
      --text: #142036;
      --muted: rgba(36, 48, 70, .66);
      --soft: rgba(255, 255, 255, .66);
      --strong: rgba(255, 255, 255, .86);
      --line: rgba(116, 135, 160, .24);
      --blue: #7199c9;
      --blue-2: #dfeaf8;
      --gold: #c4a66f;
      --shadow: 0 28px 90px rgba(92, 111, 138, .18);
      --shadow-strong: 0 36px 120px rgba(73, 92, 118, .26);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: #f4f8fd;
    }

    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(180, 210, 244, .72), transparent 30%),
        radial-gradient(circle at 88% 18%, rgba(255, 250, 235, .9), transparent 28%),
        radial-gradient(circle at 42% 92%, rgba(212, 227, 246, .9), transparent 36%),
        linear-gradient(140deg, #f9fbff 0%, #eef5fb 48%, #ffffff 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
    }

    body::before {
      background:
        linear-gradient(90deg, rgba(126, 149, 178, .07) 1px, transparent 1px),
        linear-gradient(rgba(126, 149, 178, .06) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at 50% 36%, rgba(0,0,0,.68), transparent 70%);
    }

    body::after {
      z-index: -1;
      background:
        radial-gradient(circle at calc(50% + var(--mx, 0) * 10%) calc(36% + var(--my, 0) * 8%), rgba(255,255,255,.9), transparent 26%),
        linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0));
      opacity: .72;
    }

    button,
    input {
      font: inherit;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 34% 30%, rgba(255,255,255,1), transparent 28%),
        linear-gradient(135deg, #f8fbff, #e8f1fb);
      transition: opacity .55s ease, visibility .55s ease;
    }

    .loader.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(380px, 88vw);
      padding: 26px;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: var(--radius);
      background: rgba(255,255,255,.5);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
    }

    .loader-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: rgba(23, 32, 51, .78);
      font-size: 13px;
      letter-spacing: 0;
    }

    .loader-title {
      font-weight: 720;
    }

    .loader-track {
      height: 3px;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(105, 128, 156, .15);
    }

    .loader-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #9bb9d8, #ffffff, #c4a66f);
      box-shadow: 0 0 18px rgba(113, 153, 201, .42);
      transition: width .24s ease;
    }

    .site-shell {
      position: relative;
      min-height: 100dvh;
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s ease;
    }

    body.site-ready .site-shell {
      opacity: 1;
      visibility: visible;
    }

    .topbar {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      pointer-events: none;
    }

    .brand,
    .auth-box,
    .section-nav {
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.76);
      background: rgba(255,255,255,.52);
      box-shadow: 0 18px 58px rgba(77, 97, 123, .13);
      backdrop-filter: blur(22px) saturate(155%);
      -webkit-backdrop-filter: blur(22px) saturate(155%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 0 13px;
      border-radius: 999px;
      color: rgba(12, 20, 34, .9);
      font-weight: 760;
      line-height: 1;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #fff;
      box-shadow:
        0 0 0 1px rgba(113,153,201,.18),
        0 0 15px rgba(113,153,201,.5),
        0 0 34px rgba(196,166,111,.24);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .section-nav {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 42px;
      padding: 0 9px;
      border-radius: 999px;
    }

    .nav-dot {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      color: rgba(23, 32, 51, .48);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .nav-dot.is-active {
      color: #fff;
      background: rgba(23, 32, 51, .78);
      transform: scale(1.04);
    }

    .auth-box {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      color: var(--ink);
    }

    .auth-status {
      max-width: min(28vw, 170px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-left: 8px;
      color: rgba(23, 32, 51, .66);
      font-size: 13px;
      line-height: 1;
    }

    .btn {
      min-height: 30px;
      border: 0;
      border-radius: 999px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      background: rgba(255,255,255,.48);
      box-shadow: inset 0 0 0 1px rgba(23,32,51,.08);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.82);
      box-shadow: inset 0 0 0 1px rgba(23,32,51,.12), 0 10px 24px rgba(77,97,123,.12);
    }

    .primary-btn {
      color: #fff;
      background: rgba(23, 32, 51, .86);
    }

    .danger-btn {
      color: #7e2730;
      background: rgba(255,255,255,.54);
    }

    .scroll-stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .scroll-stage::before {
      content: "";
      position: absolute;
      inset: 11vh 4vw auto auto;
      width: min(46vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.86), rgba(221,235,250,.38) 38%, transparent 70%);
      filter: blur(8px);
      transform: translate3d(calc(var(--mx, 0) * 22px), calc(var(--my, 0) * 18px), 0);
      opacity: .8;
      pointer-events: none;
    }

    .text-track {
      position: relative;
      z-index: 4;
      pointer-events: none;
    }

    .text-scene {
      min-height: 100dvh;
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(94px, 13vh, 136px) clamp(18px, 5vw, 70px) clamp(36px, 8vh, 78px);
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(360px, 1.08fr);
      gap: clamp(30px, 6vw, 86px);
      align-items: center;
    }

    .hero-text {
      width: 100%;
      margin: 0;
      padding-top: clamp(92px, 12vh, 120px);
      grid-template-columns: minmax(0, 860px);
      justify-content: start;
      align-items: start;
    }

    .text-copy {
      grid-column: 1;
      color: var(--ink);
    }

    .entry-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: var(--layer-opacity, 0);
      transition: opacity .18s linear;
      pointer-events: none;
    }

    .entry-layer {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(94px, 13vh, 136px) clamp(18px, 5vw, 70px) clamp(36px, 8vh, 78px);
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(360px, 1.08fr);
      gap: clamp(30px, 6vw, 86px);
      align-items: center;
      left: 50%;
      transform: translateX(-50%);
      z-index: var(--layer-z, 1);
    }

    .entry-layer.is-active {
      pointer-events: auto;
    }

    .entry-layer.is-active .visual {
      pointer-events: auto;
    }

    h1,
    h2 {
      margin: 0;
      color: var(--ink);
      letter-spacing: 0;
      font-weight: 760;
      line-height: .95;
    }

    h1 {
      max-width: 790px;
      font-size: clamp(54px, 8.8vw, 128px);
      text-shadow: 0 22px 70px rgba(73, 92, 118, .18);
    }

    h1 span {
      display: block;
    }

    h2 {
      font-size: clamp(50px, 8.4vw, 122px);
    }

    .copy {
      max-width: 540px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.6vw, 21px);
      line-height: 1.75;
    }

    .visual {
      position: relative;
      grid-column: 2;
      min-height: clamp(420px, 60vh, 650px);
      padding: 0;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: var(--radius);
      background: rgba(255,255,255,.45);
      box-shadow: var(--shadow-strong);
      overflow: hidden;
      backdrop-filter: blur(28px) saturate(145%);
      -webkit-backdrop-filter: blur(28px) saturate(145%);
      cursor: pointer;
      transform:
        translate3d(calc(var(--mx, 0) * -10px), 0, 0)
        rotateX(calc(var(--my, 0) * -2deg))
        rotateY(calc(var(--mx, 0) * 2.5deg))
        scale(var(--visual-scale, 1));
      transform-style: preserve-3d;
      opacity: var(--visual-opacity, 0);
      pointer-events: none;
      transition: transform .75s cubic-bezier(.19, 1, .22, 1), opacity .55s ease, box-shadow .35s ease, filter .35s ease;
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.48), transparent 42%),
        var(--section-image) center / cover no-repeat;
      transform: scale(1.06);
      transition: transform 1.2s cubic-bezier(.19, 1, .22, 1), filter .75s ease;
      filter: saturate(.94) contrast(.98);
    }

    .entry-layer.is-active .visual::before {
      transform: scale(1);
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.15), transparent 44%, rgba(255,255,255,.26)),
        radial-gradient(circle at 22% 20%, rgba(255,255,255,.74), transparent 24%);
      pointer-events: none;
    }

    .visual:hover,
    .visual:focus-visible {
      box-shadow:
        0 42px 130px rgba(73, 92, 118, .3),
        inset 0 0 0 1px rgba(255,255,255,.88);
      filter: saturate(1.04) contrast(1.02);
      outline: none;
    }

    .visual:hover::before,
    .visual:focus-visible::before {
      transform: scale(1.035);
      filter: saturate(1.03) contrast(1.02);
    }

    .visual:active {
      transform:
        translate3d(calc(var(--mx, 0) * -6px), 2px, 0)
        rotateX(calc(var(--my, 0) * -1.2deg))
        rotateY(calc(var(--mx, 0) * 1.6deg))
        scale(.985);
    }

    .visual-card {
      position: absolute;
      left: clamp(18px, 3vw, 34px);
      right: clamp(18px, 3vw, 34px);
      bottom: clamp(18px, 3vw, 34px);
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: var(--radius);
      background: rgba(255,255,255,.56);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      box-shadow: 0 18px 50px rgba(73, 92, 118, .16);
    }

    .visual-card strong {
      display: block;
      color: var(--ink);
      font-size: clamp(20px, 2.3vw, 32px);
      line-height: 1.05;
    }

    .visual-card span {
      display: block;
      margin-top: 8px;
      color: rgba(23,32,51,.58);
      font-size: 13px;
      line-height: 1.45;
    }

    .index-number {
      color: rgba(23,32,51,.34);
      font-size: clamp(36px, 5vw, 78px);
      font-weight: 760;
      line-height: .9;
      white-space: nowrap;
    }

    .section-copy {
      opacity: 1;
    }

    .section-image-1 { --section-image: url("./assets/work/photo-wall.webp"); }
    .section-image-2 { --section-image: url("./assets/work/anniversary.webp"); }
    .section-image-3 { --section-image: url("./assets/work/message-wall.webp"); }
    .section-image-4 { --section-image: url("./assets/work/heart-game.webp"); }
    .section-image-5 { --section-image: url("./assets/work/coco-diary.webp"); }
    .section-image-6 { --section-image: url("./assets/work/drink-game.webp"); }
    .section-image-7 { --section-image: url("./assets/work/nuonuo-academy.webp"); }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(237, 244, 251, .58);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .auth-modal.show {
      display: flex;
    }

    .auth-modal-card {
      width: min(420px, 100%);
      border: 1px solid rgba(255,255,255,.84);
      border-radius: var(--radius);
      background: rgba(255,255,255,.72);
      color: var(--ink);
      box-shadow: var(--shadow-strong);
      overflow: hidden;
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
    }

    .auth-modal-head {
      padding: 24px 24px 10px;
    }

    .auth-modal-head h3 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 760;
    }

    .auth-modal-head p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .auth-modal-body {
      padding: 12px 24px 24px;
    }

    .auth-field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    .auth-field label {
      color: rgba(23,32,51,.64);
      font-size: 13px;
    }

    .auth-input {
      width: 100%;
      border: 1px solid rgba(23,32,51,.12);
      border-radius: var(--radius);
      min-height: 43px;
      padding: 0 12px;
      background: rgba(255,255,255,.62);
      color: var(--ink);
      outline: none;
    }

    .auth-input:focus {
      border-color: rgba(113,153,201,.7);
      box-shadow: 0 0 0 4px rgba(113,153,201,.14);
    }

    .auth-modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .auth-modal-actions button {
      flex: 1;
      min-height: 42px;
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--ink);
    }

    .auth-modal-actions .ok {
      background: rgba(23,32,51,.9);
      color: #fff;
    }

    .auth-modal-actions .cancel {
      background: rgba(255,255,255,.62);
    }

    .auth-switch {
      margin-top: 14px;
      color: rgba(67, 106, 152, .92);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    @media (max-width: 920px) {
      .section-nav {
        display: none;
      }

      .text-scene {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .entry-layer {
        grid-template-columns: 1fr;
        display: block;
        width: 100%;
        left: 0;
        transform: none;
        padding: 0 16px 28px;
      }

      .visual {
        position: absolute;
        grid-column: auto;
        left: 16px;
        right: 16px;
        bottom: max(28px, env(safe-area-inset-bottom));
        min-height: clamp(330px, 44vh, 520px);
      }

    }

    @media (max-width: 640px) {
      .topbar {
        align-items: flex-start;
        gap: 8px;
      }

      .topbar-right {
        display: contents;
        position: static;
        max-width: none;
        gap: 6px;
      }

      .brand {
        min-height: 38px;
        padding: 0 11px;
        font-size: 14px;
      }

      .auth-box {
        position: fixed;
        top: 14px;
        right: auto;
        left: 118px;
        width: 78px;
        min-height: 38px;
        gap: 6px;
        padding: 5px;
        max-width: 78px;
        overflow: visible;
        justify-content: center;
      }

      .auth-status {
        display: none;
      }

      .auth-box .ghost-btn {
        display: none;
      }

      .btn {
        min-height: 29px;
        padding: 0 10px;
        font-size: 12px;
      }

      .auth-box .btn {
        min-width: 58px;
      }

      .text-scene {
        min-height: 100svh;
        align-items: start;
        padding: 112px 16px 60svh;
      }

      .hero-text {
        padding-top: 104px;
        padding-bottom: 34px;
      }

      h1 {
        font-size: clamp(48px, 15vw, 66px);
      }

      h2 {
        max-width: 92vw;
        font-size: clamp(42px, 14.5vw, 64px);
        line-height: .98;
      }

      .copy {
        margin-top: 18px;
        font-size: 15px;
        line-height: 1.72;
      }

      .visual {
        top: 39svh;
        bottom: auto;
        min-height: min(300px, 35svh);
      }

      .visual-card {
        display: grid;
        padding: 14px;
      }

      .index-number {
        font-size: 34px;
      }

      .visual:hover::before,
      .visual:focus-visible::before {
        transform: scale(1.015);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader" aria-live="polite">
    <div class="loader-card">
      <div class="loader-top">
        <span class="loader-title">正在加载 nuonuo</span>
        <span id="loaderPercent">0%</span>
      </div>
      <div class="loader-track"><div class="loader-bar" id="loaderBar"></div></div>
    </div>
  </div>

  <div class="site-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span><span>nuonuo</span></div>
      <div class="topbar-right">
        <nav class="section-nav" id="sectionNav" aria-label="章节导航"></nav>
        <div class="auth-box" id="authBox"></div>
      </div>
    </header>

    <div class="scroll-stage" id="scrollStage" aria-label="入口图片舞台"></div>
    <main class="text-track" id="textTrack">
      <section class="text-scene hero-text" id="top">
        <div class="text-copy">
          <h1><span>nuonuo</span><span>小窝</span></h1>
        </div>
      </section>
    </main>
  </div>

  <div id="authModal" class="auth-modal" aria-hidden="true">
    <div class="auth-modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="auth-modal-head">
        <h3 id="authTitle">登录</h3>
        <p id="authDesc">登录后进入需要权限的内容就不用再次登录了。</p>
      </div>
      <div class="auth-modal-body">
        <div class="auth-field">
          <label for="authUsername">用户名</label>
          <input id="authUsername" class="auth-input" type="text" maxlength="20" placeholder="请输入用户名" autocomplete="username" autocapitalize="off" spellcheck="false" />
        </div>
        <div class="auth-field">
          <label for="authPassword">密码</label>
          <input id="authPassword" class="auth-input" type="password" maxlength="50" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <div class="auth-field" id="authPassword2Wrap" style="display:none;">
          <label for="authPassword2">确认密码</label>
          <input id="authPassword2" class="auth-input" type="password" maxlength="50" placeholder="再次输入密码" autocomplete="new-password" />
        </div>
        <div class="auth-modal-actions">
          <button class="ok" id="authSubmitBtn" type="button">登录</button>
          <button class="cancel" id="authCancelBtn" type="button">取消</button>
        </div>
        <div class="auth-switch" id="authSwitchBtn">没有账号？去注册</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5/dist/cos-js-sdk-v5.min.js"></script>
  <script src="./assets/site-auth.js"></script>
  <script>
    const shared = window.NuonuoShared;
    const getCurrentUser = shared.getCurrentUser;
    const getUserByName = shared.getUserByName;
    const createPasswordRecord = shared.createPasswordRecord;
    const verifyPassword = shared.verifyPassword;
    const upgradePasswordIfNeeded = shared.upgradePasswordIfNeeded;
    const putJsonToCos = shared.putJsonToCos;
    const makeUserKey = shared.makeUserKey;
    const setCurrentUser = (user) => {
      shared.setCurrentUser(user, { notify: false });
      renderAuthState();
    };

    const sectionImageSources = [
      './assets/work/photo-wall.webp',
      './assets/work/anniversary.webp',
      './assets/work/message-wall.webp',
      './assets/work/heart-game.webp',
      './assets/work/coco-diary.webp',
      './assets/work/drink-game.webp',
      './assets/work/nuonuo-academy.webp'
    ];

    const sections = [
      { key: 'photo', title: '照片墙', lead: '把喜欢的瞬间铺成一面会发光的墙。', href: './photo.html', detail: '影像收藏', image: 1 },
      { key: 'days', title: '纪念日', lead: '记录在一起的天数，也记录每一次被想起的日期。', href: './days.html', detail: '时间纪念', image: 2 },
      { key: 'message', title: '留言墙', lead: '把想说的话留在这里，像一张张贴在玻璃上的便签。', href: './message.html', detail: '留言收集', image: 3 },
      { key: 'game', title: '爱心小游戏', lead: '进入轻松一点的互动，把心情变成游戏里的分数。', href: './game.html', detail: '互动游戏', image: 4, requiresAuth: true },
      { key: 'pet', title: 'CoCo日记', lead: '给 CoCo 留一页柔软的日记，放下那些小小的日常。', href: './pet.html', detail: '日常记录', image: 5, requiresAuth: true },
      { key: 'drink', title: '酒桌游戏', lead: '聚会时打开，规则、节奏和气氛都放在同一屏里。', href: './drinkgame.html', detail: '聚会玩法', image: 6 },
      { key: 'video', title: 'nuonuo学堂', lead: '把学习、资料和视频课程收进一块轻薄的玻璃屏幕。', href: './video.html', detail: '学习空间', image: 7 }
    ];

    const authBox = document.getElementById('authBox');
    const authModal = document.getElementById('authModal');
    const authTitle = document.getElementById('authTitle');
    const authDesc = document.getElementById('authDesc');
    const authUsername = document.getElementById('authUsername');
    const authPassword = document.getElementById('authPassword');
    const authPassword2 = document.getElementById('authPassword2');
    const authPassword2Wrap = document.getElementById('authPassword2Wrap');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authCancelBtn = document.getElementById('authCancelBtn');
    const authSwitchBtn = document.getElementById('authSwitchBtn');
    const scrollStage = document.getElementById('scrollStage');
    const textTrack = document.getElementById('textTrack');
    const sectionNav = document.getElementById('sectionNav');
    const loader = document.getElementById('loader');
    const loaderBar = document.getElementById('loaderBar');
    const loaderPercent = document.getElementById('loaderPercent');
    let pendingRedirect = null;
    let progress = 0;

    function setProgress(value) {
      progress = Math.max(progress, Math.min(100, value));
      loaderBar.style.width = `${progress}%`;
      loaderPercent.textContent = `${Math.round(progress)}%`;
    }

    function finishLoading() {
      setProgress(100);
      setTimeout(() => loader.classList.add('is-done'), 180);
      setTimeout(() => document.body.classList.add('site-ready'), 760);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizeUsername(name) {
      return String(name || '').trim();
    }

    function setAuthMode(mode) {
      const isRegister = mode === 'register';
      authModal.dataset.mode = mode;
      authTitle.textContent = isRegister ? '注册' : '登录';
      authDesc.textContent = isRegister ? '注册后即可使用同一账号进入各个页面。' : '登录后可打开小游戏并保存你的进度。';
      authSubmitBtn.textContent = isRegister ? '注册' : '登录';
      authSwitchBtn.textContent = isRegister ? '已有账号？去登录' : '没有账号？去注册';
      authPassword2Wrap.style.display = isRegister ? '' : 'none';
      authPassword.value = '';
      authPassword2.value = '';
    }

    function openAuthModal(mode = 'login') {
      setAuthMode(mode);
      authModal.classList.add('show');
      authModal.setAttribute('aria-hidden', 'false');
      setTimeout(() => authUsername.focus(), 0);
    }

    function closeAuthModal() {
      authModal.classList.remove('show');
      authModal.setAttribute('aria-hidden', 'true');
    }

    function renderAuthState() {
      const user = getCurrentUser();
      if (user) {
        authBox.innerHTML = `
          <div class="auth-status">当前登录：${escapeHtml(user.username)}</div>
          <button class="btn danger-btn logout-btn" id="logoutBtn" type="button">退出登录</button>
        `;
      } else {
        authBox.innerHTML = `
          <div class="auth-status">未登录</div>
          <button class="btn primary-btn" id="loginBtn" type="button">登录</button>
          <button class="btn ghost-btn" id="registerBtn" type="button">注册</button>
        `;
      }

      const loginBtn = document.getElementById('loginBtn');
      const registerBtn = document.getElementById('registerBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      if (loginBtn) loginBtn.onclick = () => openAuthModal('login');
      if (registerBtn) registerBtn.onclick = () => openAuthModal('register');
      if (logoutBtn) {
        logoutBtn.onclick = () => {
          if (!confirm('确定要退出登录吗？')) return;
          setCurrentUser(null);
          alert('已退出登录');
        };
      }
    }

    function enterSection(section) {
      if (section.requiresAuth && !getCurrentUser()) {
        pendingRedirect = section.href;
        openAuthModal('login');
        return;
      }
      location.href = section.href;
    }

    function buildSections() {
      sections.forEach((section, index) => {
        const layer = document.createElement('section');
        layer.className = 'entry-layer';
        layer.id = section.key;
        layer.dataset.key = section.key;
        layer.setAttribute('aria-label', section.title);
        layer.innerHTML = `
          <div class="visual section-image-${section.image}" role="button" tabindex="-1" aria-label="进入${section.title}">
            <div class="visual-card">
              <div><strong>${section.title}</strong></div>
              <div class="index-number">${String(index + 1).padStart(2, '0')}</div>
            </div>
          </div>
        `;
        const visual = layer.querySelector('.visual');
        visual.addEventListener('click', () => enterSection(section));
        visual.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          enterSection(section);
        });
        scrollStage.appendChild(layer);

        const textScene = document.createElement('section');
        textScene.className = 'text-scene';
        textScene.dataset.key = section.key;
        textScene.innerHTML = `
          <div class="text-copy section-copy">
            <h2>${section.title}</h2>
          </div>
        `;
        textTrack.appendChild(textScene);

        const dot = document.createElement('button');
        dot.className = 'nav-dot';
        dot.type = 'button';
        dot.textContent = String(index + 1);
        dot.setAttribute('aria-label', section.title);
        dot.addEventListener('click', () => {
          textScene.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        sectionNav.appendChild(dot);
        section.layer = layer;
        section.visual = visual;
        section.textScene = textScene;
        section.dot = dot;
      });
    }

    function clamp(value, min = 0, max = 1) {
      return Math.min(max, Math.max(min, value));
    }

    function smoothstep(edge0, edge1, value) {
      const x = clamp((value - edge0) / (edge1 - edge0));
      return x * x * (3 - 2 * x);
    }

    function setupScrollStory() {
      let ticking = false;

      const update = () => {
        const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
        const viewportCenter = viewportHeight * .5;
        let activeIndex = 0;
        let nearestDistance = Infinity;

        sections.forEach((section, index) => {
          const rect = section.textScene.getBoundingClientRect();
          const sceneCenter = rect.top + rect.height * .5;
          const distance = Math.abs(sceneCenter - viewportCenter);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            activeIndex = index + 1;
          }
        });

        sections.forEach((section, index) => {
          const rect = section.textScene.getBoundingClientRect();
          const sceneCenter = rect.top + rect.height * .5;
          const normalizedDistance = Math.abs(sceneCenter - viewportCenter) / Math.max(1, viewportHeight);
          const visualOpacity = 1 - smoothstep(.28, .68, normalizedDistance);
          const isActive = activeIndex === index + 1 && visualOpacity > .42;
          section.layer.style.setProperty('--layer-opacity', visualOpacity.toFixed(3));
          section.layer.style.setProperty('--visual-opacity', visualOpacity.toFixed(3));
          section.layer.style.setProperty('--visual-scale', (0.992 + visualOpacity * .008).toFixed(3));
          section.layer.style.setProperty('--layer-z', String(Math.round(visualOpacity * 100) + 1));
          section.layer.classList.toggle('is-active', isActive);
          section.visual.tabIndex = isActive ? 0 : -1;
          section.dot.classList.toggle('is-active', isActive);
        });
        ticking = false;
      };

      const requestUpdate = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(update);
      };

      update();
      window.addEventListener('scroll', requestUpdate, { passive: true });
      window.addEventListener('resize', requestUpdate, { passive: true });
      window.addEventListener('load', requestUpdate, { once: true });
    }

    function setupMotion() {
      window.addEventListener('pointermove', (event) => {
        const mx = (event.clientX / window.innerWidth - .5) * 2;
        const my = (event.clientY / window.innerHeight - .5) * 2;
        document.body.style.setProperty('--mx', mx.toFixed(3));
        document.body.style.setProperty('--my', my.toFixed(3));
      }, { passive: true });
    }

    authCancelBtn.addEventListener('click', () => {
      pendingRedirect = null;
      closeAuthModal();
    });

    authSwitchBtn.addEventListener('click', () => {
      const mode = authModal.dataset.mode === 'register' ? 'login' : 'register';
      setAuthMode(mode);
    });

    authSubmitBtn.addEventListener('click', async () => {
      const mode = authModal.dataset.mode || 'login';
      const username = sanitizeUsername(authUsername.value);
      const password = authPassword.value;
      const password2 = authPassword2.value;

      if (!username || !password) {
        alert('请输入用户名和密码');
        return;
      }
      if (username.length < 2) {
        alert('用户名至少 2 个字符');
        return;
      }

      if (mode === 'register') {
        if (password.length < 4) {
          alert('密码至少 4 位');
          return;
        }
        if (password !== password2) {
          alert('两次密码不一致');
          return;
        }
        try {
          const oldUser = await getUserByName(username);
          if (oldUser) {
            alert('这个用户名已经存在了');
            return;
          }
          const userData = {
            username,
            ...(await createPasswordRecord(password)),
            createdAt: new Date().toISOString()
          };
          await putJsonToCos(makeUserKey(username), userData);
          setCurrentUser({ username });
          closeAuthModal();
          alert('注册成功，已自动登录');
          if (pendingRedirect) {
            const target = pendingRedirect;
            pendingRedirect = null;
            setTimeout(() => { location.href = target; }, 120);
          }
        } catch (err) {
          console.error(err);
          alert('注册失败，请检查密钥、Bucket、Region、CORS 或网络');
        }
        return;
      }

      try {
        const userData = await getUserByName(username);
        if (!userData || !(await verifyPassword(userData, password))) {
          alert('用户名或密码错误');
          return;
        }
        try {
          await upgradePasswordIfNeeded(userData, password);
        } catch (upgradeErr) {
          console.warn('密码记录升级失败，将继续登录', upgradeErr);
        }
        setCurrentUser({ username });
        closeAuthModal();
        alert('登录成功');
        if (pendingRedirect) {
          const target = pendingRedirect;
          pendingRedirect = null;
          setTimeout(() => { location.href = target; }, 120);
        }
      } catch (err) {
        console.error(err);
        alert('登录失败，请检查密钥、Bucket、Region、CORS 或网络');
      }
    });

    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) {
        pendingRedirect = null;
        closeAuthModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        pendingRedirect = null;
        closeAuthModal();
      }
    });

    setProgress(18);
    buildSections();
    setProgress(42);
    renderAuthState();
    setupScrollStory();
    setupMotion();
    setProgress(68);

    let loadedImages = 0;
    let loadFinished = false;

    function finishLoadingOnce() {
      if (loadFinished) return;
      loadFinished = true;
      finishLoading();
    }

    const imagePreloads = sectionImageSources.map((src) => new Promise((resolve) => {
      const image = new Image();
      image.decoding = 'async';
      image.onload = async () => {
        try {
          if (image.decode) await image.decode();
        } catch {}
        loadedImages += 1;
        setProgress(68 + Math.round((loadedImages / sectionImageSources.length) * 22));
        resolve();
      };
      image.onerror = () => {
        loadedImages += 1;
        setProgress(68 + Math.round((loadedImages / sectionImageSources.length) * 22));
        resolve();
      };
      image.src = src;
    }));

    Promise.all(imagePreloads).then(finishLoadingOnce);
    window.addEventListener('load', () => setProgress(86), { once: true });
  </script>
</body>
</html>
