<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>视频快放</title>
  <style>
    :root {
      --text: #1d1d1f;
      --subtext: #6e6e73;
      --primary: #0071e3;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.06);
      --radius-xl: 28px;
      --radius-lg: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      background:
        radial-gradient(circle at top left, rgba(0, 113, 227, 0.10), transparent 28%),
        radial-gradient(circle at top right, rgba(255, 59, 48, 0.08), transparent 24%),
        linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 100%);
    }

    body {
      padding: 24px;
    }

    body.no-scroll {
      overflow: hidden;
      padding: 0;
      background: #000;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .back {
      text-decoration: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.05);
      transition: background .2s ease, transform .15s ease;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .back:hover {
      background: rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.03em;
    }

    .title-wrap p {
      margin: 6px 0 0;
      color: var(--subtext);
      font-size: 14px;
    }

    .video-card {
      margin-top: 18px;
      background: rgba(255, 255, 255, 0.54);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .player {
      position: relative;
      overflow: hidden;
      min-height: 480px;
      border-radius: 24px;
      background: #000;
      box-shadow: var(--shadow-soft);
    }

    video {
      width: 100%;
      height: 100%;
      min-height: 480px;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .choose-empty {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f5f5f7;
      text-align: center;
      background: #000;
    }

    .choose-empty[hidden] {
      display: none;
    }

    .empty-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .empty-copy {
      margin: 10px 0 18px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 14px;
      line-height: 1.7;
    }

    .choose-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .picker-note {
      margin: 12px auto 0;
      max-width: 260px;
      color: rgba(255, 255, 255, 0.58);
      font-size: 12px;
      line-height: 1.6;
    }

    .top-controls,
    .control-panel {
      position: absolute;
      z-index: 5;
      left: 14px;
      right: 14px;
    }

    .top-controls {
      top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .top-controls > * {
      pointer-events: auto;
    }

    .video-title {
      min-width: 0;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 8px rgba(0,0,0,.6);
    }

    .control-panel {
      bottom: 14px;
      display: grid;
      gap: 11px;
      padding: 12px;
      border-radius: 22px;
      background: rgba(20, 20, 22, 0.72);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .time-row,
    .button-row,
    .speed-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-row {
      justify-content: space-between;
      color: rgba(255,255,255,.76);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .progress {
      width: 100%;
      accent-color: #fff;
    }

    .button-row {
      justify-content: center;
      flex-wrap: wrap;
    }

    .speed-row {
      padding: 3px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.16);
    }

    .btn,
    .file-label,
    .speed-btn {
      border: none;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, background .2s ease, opacity .2s ease;
      white-space: nowrap;
    }

    .btn:hover,
    .speed-btn:hover {
      transform: translateY(-1px);
    }

    .btn,
    .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 14px;
      font-weight: 800;
    }

    .primary {
      color: #fff;
      background: linear-gradient(180deg, #0a84ff 0%, #0071e3 100%);
      box-shadow: 0 10px 22px rgba(0, 113, 227, 0.22);
    }

    .glass {
      color: #fff;
      background: rgba(255, 255, 255, 0.18);
    }

    .light {
      color: var(--text);
      background: rgba(255, 255, 255, 0.88);
    }

    .speed-btn {
      flex: 1;
      height: 34px;
      min-width: 0;
      border-radius: 9px;
      color: #fff;
      background: transparent;
      font-size: 14px;
      font-weight: 800;
    }

    .speed-btn.active {
      color: #111;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.16);
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .hint {
      margin: 12px 2px 0;
      color: var(--subtext);
      font-size: 13px;
      line-height: 1.7;
    }

    .is-fullscreen .topbar,
    .is-fullscreen .hint {
      display: none;
    }

    .is-fullscreen .page,
    .is-fullscreen .video-card {
      max-width: none;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: #000;
    }

    .is-fullscreen .video-card {
      position: fixed;
      inset: 0;
      z-index: 1000;
    }

    .is-fullscreen .player {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }

    .is-fullscreen video {
      height: 100vh;
      min-height: 100vh;
    }

    .exit-fullscreen {
      display: none;
    }

    .is-fullscreen .enter-fullscreen {
      display: none;
    }

    .is-fullscreen .exit-fullscreen {
      display: inline-flex;
    }

    .is-fullscreen.controls-hidden .top-controls,
    .is-fullscreen.controls-hidden .control-panel {
      opacity: 0;
      pointer-events: none;
    }

    .is-fullscreen.controls-hidden .control-panel {
      transform: translateY(14px);
    }

    @media (max-width: 720px) {
      body { padding: 12px; }

      .topbar {
        border-radius: 22px;
        padding: 14px 16px;
      }

      .title-wrap h1 {
        font-size: 21px;
      }

      .title-wrap p {
        font-size: 13px;
      }

      .video-card {
        border-radius: 24px;
        padding: 10px;
      }

      .player,
      video {
        min-height: min(78vh, 620px);
      }

      .top-controls {
        left: 10px;
        right: 10px;
        top: 10px;
      }

      .control-panel {
        left: 10px;
        right: 10px;
        bottom: 10px;
        border-radius: 20px;
      }

      .btn {
        flex: 1 1 58px;
        min-height: 36px;
        padding: 8px 9px;
        font-size: 13px;
      }

      .speed-btn {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="back" href="./index.html">返回主页</a>
      <div class="title-wrap">
        <h1>视频快放</h1>
        <p>选择本机相册视频，直接倍速播放和快进。</p>
      </div>
    </header>

    <main class="video-card" id="videoCard">
      <section class="player" id="player">
        <video id="video" playsinline webkit-playsinline x-webkit-airplay="deny" preload="metadata"></video>

        <div class="choose-empty" id="emptyState">
          <div>
            <h2 class="empty-title">选择一个视频</h2>
            <p class="empty-copy" id="emptyCopy">视频只在本机播放，不上传到网络。</p>
            <div class="choose-actions">
              <label class="file-label primary" for="photoInput">从相册选择</label>
              <label class="file-label glass" for="fileInput">从文件选择</label>
            </div>
            <div class="picker-note">相册界面如果只出现缩略图对勾但不返回网页，请改用“从文件选择”。</div>
          </div>
        </div>

        <div class="top-controls">
          <div class="video-title" id="videoTitle">未选择视频</div>
          <div>
            <label class="file-label light" for="photoInput">换视频</label>
            <button class="btn light enter-fullscreen" type="button" id="enterFullBtn">全屏</button>
            <button class="btn light exit-fullscreen" type="button" id="exitFullBtn">完成</button>
          </div>
        </div>

        <div class="control-panel">
          <div class="time-row">
            <span id="currentTime">00:00</span>
            <span id="duration">00:00</span>
          </div>
          <input id="progress" class="progress" type="range" min="0" max="100" value="0" step="0.1" />

          <div class="button-row">
            <button class="btn glass" type="button" data-seek="-5">-5s</button>
            <button class="btn primary" type="button" id="playBtn">播放</button>
            <button class="btn glass" type="button" data-seek="5">+5s</button>
            <button class="btn glass" type="button" data-seek="10">+10s</button>
            <button class="btn glass" type="button" data-seek="30">+30s</button>
          </div>

          <div class="speed-row" aria-label="播放速度">
            <button class="speed-btn" type="button" data-speed="0.5">0.5x</button>
            <button class="speed-btn active" type="button" data-speed="1">1x</button>
            <button class="speed-btn" type="button" data-speed="1.5">1.5x</button>
            <button class="speed-btn" type="button" data-speed="2">2x</button>
            <button class="speed-btn" type="button" data-speed="4">4x</button>
          </div>
        </div>

        <input id="photoInput" type="file" accept="video/mp4,video/quicktime,video/x-m4v,.mp4,.mov,.m4v" />
        <input id="fileInput" type="file" />
      </section>
      <p class="hint">点“全屏”会进入页面内全屏，仍可使用倍速和快进按钮。iPad 上请用 Safari 打开。</p>
    </main>
  </div>

  <script>
    const body = document.body;
    const video = document.getElementById('video');
    const photoInput = document.getElementById('photoInput');
    const fileInput = document.getElementById('fileInput');
    const emptyState = document.getElementById('emptyState');
    const emptyCopy = document.getElementById('emptyCopy');
    const videoTitle = document.getElementById('videoTitle');
    const playBtn = document.getElementById('playBtn');
    const enterFullBtn = document.getElementById('enterFullBtn');
    const exitFullBtn = document.getElementById('exitFullBtn');
    const player = document.getElementById('player');
    const controlPanel = document.querySelector('.control-panel');
    const topControls = document.querySelector('.top-controls');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    let objectUrl = '';
    let currentSpeed = 1;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
      const total = Math.floor(seconds);
      const minutes = Math.floor(total / 60);
      const rest = total % 60;
      return `${String(minutes).padStart(2, '0')}:${String(rest).padStart(2, '0')}`;
    }

    function hasVideo() {
      return Boolean(video.currentSrc || video.src);
    }

    function syncPlayButton() {
      playBtn.textContent = video.paused ? '播放' : '暂停';
    }

    function syncTime() {
      const duration = Number.isFinite(video.duration) ? video.duration : 0;
      const current = Number.isFinite(video.currentTime) ? video.currentTime : 0;
      const percent = duration ? (current / duration) * 100 : 0;

      currentTimeEl.textContent = formatTime(current);
      durationEl.textContent = formatTime(duration);
      progress.value = String(percent);
    }

    function setSpeed(speed) {
      currentSpeed = speed;
      video.defaultPlaybackRate = speed;
      video.playbackRate = speed;
      syncSpeedButtons(speed);
    }

    function syncSpeedButtons(speed) {
      document.querySelectorAll('[data-speed]').forEach(button => {
        button.classList.toggle('active', Number(button.dataset.speed) === speed);
      });
    }

    async function playVideo() {
      try {
        video.playbackRate = currentSpeed;
        await video.play();
      } catch {
        syncPlayButton();
      }
    }

    function requestVideoFile() {
      photoInput.value = '';
      fileInput.value = '';
      emptyCopy.textContent = '正在等待系统相册确认。如果不能返回网页，请用“从文件选择”。';
      photoInput.click();
    }

    function togglePlay() {
      if (!hasVideo()) {
        requestVideoFile();
        return;
      }

      if (video.paused) {
        void playVideo();
      } else {
        video.pause();
      }
      syncPlayButton();
    }

    function seekBy(seconds) {
      if (!hasVideo()) return;
      const end = Number.isFinite(video.duration) ? video.duration : video.currentTime + seconds;
      video.currentTime = Math.min(Math.max(video.currentTime + seconds, 0), end);
      syncTime();
    }

    function seekToPercent(value) {
      if (!hasVideo() || !Number.isFinite(video.duration)) return;
      video.currentTime = (Number(value) / 100) * video.duration;
      syncTime();
    }

    function enterFullScreen() {
      if (!hasVideo()) {
        requestVideoFile();
        return;
      }
      body.classList.add('is-fullscreen', 'no-scroll');
      body.classList.remove('controls-hidden');
    }

    function exitFullScreen() {
      body.classList.remove('is-fullscreen', 'no-scroll', 'controls-hidden');
    }

    function toggleFullScreenControls() {
      if (!body.classList.contains('is-fullscreen') || !hasVideo()) return;
      body.classList.toggle('controls-hidden');
    }

    playBtn.addEventListener('click', togglePlay);
    enterFullBtn.addEventListener('click', enterFullScreen);
    exitFullBtn.addEventListener('click', exitFullScreen);
    player.addEventListener('click', event => {
      if (event.target.closest('.control-panel, .top-controls, input, button, label')) return;
      toggleFullScreenControls();
    });
    controlPanel.addEventListener('click', event => event.stopPropagation());
    topControls.addEventListener('click', event => event.stopPropagation());
    photoInput.addEventListener('click', () => {
      emptyCopy.textContent = '正在等待系统相册确认。如果不能返回网页，请用“从文件选择”。';
    });

    fileInput.addEventListener('click', () => {
      emptyCopy.textContent = '正在等待文件选择。';
    });

    function loadSelectedFile(input) {
      const file = input.files && input.files[0];
      if (!file) {
        emptyCopy.textContent = '视频只在本机播放，不上传到网络。';
        return;
      }

      if (!file.type.startsWith('video/') && !/\.(mp4|mov|m4v)$/i.test(file.name || '')) {
        emptyCopy.textContent = '请选择 MP4、MOV 或 M4V 视频文件。';
        return;
      }

      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      video.src = objectUrl;
      videoTitle.textContent = file.name || '相册视频';
      emptyCopy.textContent = '正在载入视频...';
      emptyState.hidden = true;
      setSpeed(currentSpeed);
      video.load();
      void playVideo();
    }

    photoInput.addEventListener('change', () => loadSelectedFile(photoInput));
    fileInput.addEventListener('change', () => loadSelectedFile(fileInput));

    document.querySelectorAll('[data-seek]').forEach(button => {
      button.addEventListener('click', () => seekBy(Number(button.dataset.seek)));
    });

    document.querySelectorAll('[data-speed]').forEach(button => {
      button.addEventListener('click', () => setSpeed(Number(button.dataset.speed)));
    });

    progress.addEventListener('input', event => seekToPercent(event.target.value));
    video.addEventListener('loadedmetadata', () => {
      setSpeed(currentSpeed);
      syncTime();
    });
    video.addEventListener('ratechange', () => {
      currentSpeed = video.playbackRate || currentSpeed;
      syncSpeedButtons(currentSpeed);
    });
    video.addEventListener('timeupdate', syncTime);
    video.addEventListener('play', syncPlayButton);
    video.addEventListener('pause', syncPlayButton);
    video.addEventListener('ended', syncPlayButton);

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') exitFullScreen();
      if (event.key === ' ') {
        event.preventDefault();
        togglePlay();
      }
      if (event.key === 'ArrowLeft') seekBy(-5);
      if (event.key === 'ArrowRight') seekBy(5);
    });

    syncTime();
    syncPlayButton();
  </script>
</body>
</html>
