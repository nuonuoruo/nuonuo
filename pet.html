<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>CoCo 日记</title>
  <link rel="stylesheet" href="./assets/site-motion.css" />
  <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="18" fill="%23eaf4ff"/%3E%3Cpath fill="%237199c9" d="M32 49 15 32c-6-6-2-17 7-17 5 0 8 3 10 7 2-4 5-7 10-7 9 0 13 11 7 17L32 49z"/%3E%3C/svg%3E' />
  <style>
    :root {
      color-scheme: light;
      --ink: #162033;
      --muted: rgba(46, 58, 80, .68);
      --line: rgba(105, 128, 158, .18);
      --glass: rgba(255,255,255,.68);
      --glass-strong: rgba(255,255,255,.84);
      --blue: #6da8e8;
      --pink: #ff8fb0;
      --gold: #d7a85d;
      --green: #66c47c;
      --shadow: 0 28px 90px rgba(84, 103, 128, .17);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      background:
        radial-gradient(circle at 14% 10%, rgba(255, 209, 222, .42), transparent 28%),
        radial-gradient(circle at 84% 16%, rgba(255, 229, 190, .62), transparent 30%),
        radial-gradient(circle at 56% 92%, rgba(177, 216, 248, .7), transparent 42%),
        linear-gradient(145deg, #fffafd 0%, #eef7ff 48%, #fffdf7 100%);
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      padding: 18px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(126,149,178,.06) 1px, transparent 1px),
        linear-gradient(rgba(126,149,178,.055) 1px, transparent 1px);
      background-size: 68px 68px;
      mask-image: radial-gradient(circle at 50% 34%, rgba(0,0,0,.55), transparent 72%);
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .topbar,
    .hero,
    .panel,
    .login-card {
      border: 1px solid rgba(255,255,255,.78);
      border-radius: var(--radius);
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
    }

    .topbar {
      position: sticky;
      top: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .back-btn,
    .brand-row,
    .chip,
    .btn {
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 999px;
      background: rgba(255,255,255,.58);
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 12px 32px rgba(84, 103, 128, .1);
    }

    .back-btn,
    .brand-row,
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 13px;
      gap: 8px;
      font-size: 13px;
      font-weight: 760;
      white-space: nowrap;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(109,168,232,.2), 0 0 18px rgba(109,168,232,.55);
    }

    .chip strong {
      font-size: 16px;
    }

    .btn {
      min-height: 42px;
      border: 0;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 780;
      transition: transform .16s ease, opacity .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(1px) scale(.985); }
    .btn:disabled { opacity: .48; cursor: not-allowed; }

    .primary-btn {
      color: #fff;
      background: linear-gradient(180deg, #2794ff, #0874dc);
      box-shadow: 0 14px 34px rgba(49, 137, 226, .22);
    }

    .danger-btn {
      color: #fff;
      background: linear-gradient(180deg, #ff6a74, #f04452);
      box-shadow: 0 14px 34px rgba(240, 68, 82, .2);
    }

    .ghost-btn {
      background: rgba(255,255,255,.62);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(18px, 3vw, 34px);
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 999px;
    }

    .hero::before {
      right: -110px;
      top: -120px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 226, 190, .52), transparent 68%);
    }

    .hero::after {
      left: -90px;
      bottom: -130px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(189, 222, 250, .56), transparent 70%);
    }

    .hero-head {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .hero-title h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 92px);
      line-height: .92;
      letter-spacing: 0;
      font-weight: 880;
    }

    .hero-title p {
      max-width: 560px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .mood-card {
      min-width: min(100%, 280px);
      padding: 16px;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: var(--radius);
      background: rgba(255,255,255,.54);
      box-shadow: 0 18px 54px rgba(84, 103, 128, .12);
    }

    .mood-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .mood-card div {
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .pet-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(320px, 1.08fr) minmax(300px, .92fr);
      gap: 16px;
      align-items: stretch;
    }

    .room {
      position: relative;
      min-height: 560px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255,255,255,.84), rgba(255,255,255,.42)),
        radial-gradient(circle at 25% 22%, rgba(255,255,255,.78), transparent 24%),
        radial-gradient(circle at 70% 18%, rgba(255, 231, 190, .38), transparent 28%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.82), 0 20px 70px rgba(84, 103, 128, .13);
    }

    .window {
      position: absolute;
      left: 24px;
      top: 24px;
      width: 150px;
      height: 112px;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.7) 50%, transparent calc(50% + 1px)),
        linear-gradient(180deg, transparent calc(50% - 1px), rgba(255,255,255,.7) 50%, transparent calc(50% + 1px)),
        linear-gradient(180deg, #e9f7ff, #fff3e7);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 20px 54px rgba(84, 103, 128, .1);
    }

    .sun {
      position: absolute;
      right: 36px;
      top: 38px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7ca, #ffd77d 58%, transparent 70%);
      opacity: .72;
    }

    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 168px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.28)),
        repeating-linear-gradient(90deg, rgba(207,174,128,.18) 0 1px, transparent 1px 56px),
        linear-gradient(180deg, rgba(232, 211, 181, .28), rgba(211, 182, 142, .18));
      border-top: 1px solid rgba(185, 151, 102, .14);
    }

    .dog-area {
      position: absolute;
      left: 50%;
      bottom: 52px;
      width: min(92%, 520px);
      height: 390px;
      transform: translateX(-50%);
    }

    .dog-caption {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 5;
      transform: translateX(-50%);
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 14px 36px rgba(84, 103, 128, .12);
      color: rgba(69, 52, 32, .86);
      font-weight: 820;
    }

    .dog-button {
      position: absolute;
      left: 50%;
      bottom: 24px;
      width: min(88vw, 330px);
      height: 300px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      transform: translateX(-50%);
      -webkit-tap-highlight-color: transparent;
      transform-origin: 50% 90%;
    }

    .dog-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 26px 28px rgba(91, 65, 38, .14));
      transition: transform .18s ease;
    }

    .dog-button:hover .dog-svg { transform: translateY(-2px); }
    .dog-button.bounce .dog-svg { animation: dogBounce .38s ease; }
    .dog-button.sleepy .dog-svg { animation: sleepy 2.8s ease-in-out infinite; }
    .dog-button.hungry .dog-svg { animation: hungry 1.8s ease-in-out infinite; }
    .dog-button.happy .dog-svg { animation: happyWiggle 1.8s ease-in-out infinite; }

    .tail {
      transform-origin: 47px 118px;
      animation: wag 1.2s ease-in-out infinite;
    }

    .ear-left { transform-origin: 89px 94px; }
    .ear-right { transform-origin: 231px 94px; }
    .dog-button.happy .ear-left { animation: earFlop 1.8s ease-in-out infinite; }
    .dog-button.happy .ear-right { animation: earFlop 1.8s ease-in-out infinite reverse; }

    .eye-sleep { opacity: 0; }
    .dog-button.sleepy .eye-open { opacity: 0; }
    .dog-button.sleepy .eye-sleep { opacity: 1; }

    .bowl,
    .cup,
    .toy {
      position: absolute;
      z-index: 6;
      bottom: 14px;
      width: 112px;
      height: 98px;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .16s ease;
    }

    .bowl { left: 20px; }
    .cup { right: 20px; }
    .toy { left: 50%; bottom: 0; width: 88px; height: 72px; transform: translateX(-50%); }
    .bowl:hover,
    .cup:hover { transform: translateY(-2px); }
    .toy:hover { transform: translateX(-50%) translateY(-2px); }

    .object-label {
      position: absolute;
      left: 50%;
      bottom: -16px;
      transform: translateX(-50%);
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      color: rgba(69, 52, 32, .74);
      font-size: 12px;
      font-weight: 820;
      white-space: nowrap;
    }

    .bowl-shape,
    .cup-shape,
    .toy-shape {
      position: absolute;
      inset: 14px 8px 22px;
      border: 1px solid rgba(255,255,255,.48);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.64), 0 14px 28px rgba(91, 65, 38, .12);
    }

    .bowl-shape {
      border-radius: 18px 18px 42px 42px;
      background: linear-gradient(180deg, #ffd995, #ffb85d);
    }

    .bowl-shape::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -12px;
      width: 92px;
      height: 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe9bd, #ffd68c);
      transform: translateX(-50%);
    }

    .bowl-food {
      position: absolute;
      left: 24px;
      right: 24px;
      top: 36px;
      height: 22px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 22% 42%, #fff 0 16%, transparent 17%),
        radial-gradient(circle at 52% 35%, #fff 0 15%, transparent 16%),
        radial-gradient(circle at 78% 44%, #fff 0 15%, transparent 16%),
        linear-gradient(180deg, #fff7dc, #ffe7a5);
    }

    .cup-shape {
      inset: 12px 18px 22px;
      border-radius: 16px 16px 12px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.58)), linear-gradient(180deg, #ccefff, #69bfff);
    }

    .cup-shape::before {
      content: "";
      position: absolute;
      right: -14px;
      top: 20px;
      width: 28px;
      height: 40px;
      border: 5px solid #78c7ff;
      border-left: 0;
      border-radius: 0 20px 20px 0;
    }

    .cup-water {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 16px;
      height: 42px;
      border-radius: 9px;
      background: linear-gradient(180deg, #c7edff, #56b3ff);
    }

    .toy-shape {
      inset: 18px 9px 16px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 32% 34%, rgba(255,255,255,.8), transparent 18%),
        linear-gradient(135deg, #ff8fb0, #ffb46d);
    }

    .panels {
      display: grid;
      gap: 12px;
    }

    .panel {
      padding: 16px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 840;
    }

    .state-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .meter {
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,.66);
      background: rgba(255,255,255,.52);
    }

    .meter-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      color: rgba(22,32,51,.78);
      font-size: 13px;
      font-weight: 760;
    }

    .bar {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(112, 132, 158, .14);
    }

    .fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      transition: width .32s ease;
    }

    .fill.affection { background: linear-gradient(90deg, #ff87aa, #ff4d8d); }
    .fill.hunger { background: linear-gradient(90deg, #8fe08f, #39b864); }
    .fill.thirst { background: linear-gradient(90deg, #8cdbff, #3aa0ff); }
    .fill.energy { background: linear-gradient(90deg, #ffe08f, #ffb84d); }
    .fill.clean { background: linear-gradient(90deg, #b9e8ff, #8fb3ff); }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .action {
      min-height: 64px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: var(--radius);
      background: rgba(255,255,255,.54);
      color: var(--ink);
      cursor: pointer;
      display: grid;
      align-content: center;
      gap: 4px;
      padding: 10px;
      text-align: left;
      box-shadow: 0 14px 34px rgba(84,103,128,.1);
      transition: transform .16s ease, background .2s ease;
    }

    .action:hover { transform: translateY(-1px); background: rgba(255,255,255,.72); }
    .action strong { font-size: 14px; }
    .action span { color: var(--muted); font-size: 12px; }

    .name-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .name-input {
      min-width: 0;
      height: 42px;
      border: 1px solid rgba(105,128,158,.2);
      border-radius: var(--radius);
      background: rgba(255,255,255,.72);
      color: var(--ink);
      outline: none;
      padding: 0 12px;
    }

    .log-list {
      display: grid;
      gap: 8px;
      max-height: 162px;
      overflow: auto;
      padding-right: 2px;
    }

    .log-item {
      padding: 10px 11px;
      border-radius: var(--radius);
      background: rgba(255,255,255,.52);
      color: rgba(22,32,51,.72);
      font-size: 13px;
      line-height: 1.55;
    }

    .care-line {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .pet-float {
      position: absolute;
      z-index: 30;
      pointer-events: none;
      font-size: 22px;
      animation: floatUp .95s ease forwards;
      filter: drop-shadow(0 8px 10px rgba(84,103,128,.12));
    }

    .login-gate {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(28, 36, 52, .48);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .login-gate.show { display: flex; }

    .login-card {
      width: min(94vw, 460px);
      overflow: hidden;
      background: rgba(255,255,255,.88);
    }

    .login-card .head {
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--line);
    }

    .login-card h3 {
      margin: 0;
      font-size: 20px;
    }

    .login-card p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .login-card .body {
      display: grid;
      gap: 14px;
      padding: 18px 20px 20px;
    }

    .login-card .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    @keyframes dogBounce {
      0% { transform: scale(1); }
      38% { transform: scale(1.045) translateY(-4px); }
      100% { transform: scale(1); }
    }

    @keyframes wag {
      0%, 100% { transform: rotate(-9deg); }
      50% { transform: rotate(13deg); }
    }

    @keyframes happyWiggle {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(2px); }
    }

    @keyframes hungry {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }

    @keyframes sleepy {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(3px) scale(.99); }
    }

    @keyframes earFlop {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(.82); }
      16% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-96px) scale(1.28); }
    }

    @media (max-width: 900px) {
      .pet-grid { grid-template-columns: 1fr; }
      .room { min-height: 520px; }
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      body::before { opacity: .45; mask-image: none; }

      .topbar,
      .hero,
      .panel,
      .login-card {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .topbar { position: relative; top: auto; }
      .topbar-right,
      .topbar-left { width: 100%; }
      .hero { padding: 16px; }
      .hero-title h1 { font-size: clamp(42px, 15vw, 64px); }
      .room { min-height: 470px; }
      .dog-area { width: 100%; height: 340px; bottom: 42px; }
      .dog-button { width: min(86vw, 280px); height: 250px; bottom: 34px; }
      .bowl, .cup { width: 92px; height: 82px; bottom: 18px; }
      .bowl { left: 8px; }
      .cup { right: 8px; }
      .toy { bottom: -2px; }
      .state-grid { grid-template-columns: 1fr; }
      .action-grid { grid-template-columns: 1fr; }
      .name-row { grid-template-columns: 1fr; }
      .name-row .btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body data-page-key="pet" class="nuonuo-page-enter">
  <div class="page">
    <header class="topbar">
      <div class="topbar-left">
        <a class="back-btn" href="./index.html" aria-label="返回主页">← 返回主页</a>
        <a class="brand-row" href="./index.html" aria-label="返回主页">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>CoCo 日记</span>
        </a>
      </div>
      <div class="topbar-right">
        <span class="chip">用户：<strong id="userText">未登录</strong></span>
        <span class="chip">好感：<strong id="affectionTopText">0</strong></span>
        <button class="btn danger-btn" id="logoutBtn" type="button">退出登录</button>
      </div>
    </header>

    <main class="hero">
      <div class="hero-head">
        <div class="hero-title">
          <h1>像真的养了一只小狗</h1>
          <p>每天喂食、喂水、陪玩、散步、洗澡。CoCo 会根据你的照顾状态变开心、撒娇、犯困，也会把每次互动记在日记里。</p>
        </div>
        <div class="mood-card">
          <strong id="moodTitle">今天的心情</strong>
          <div id="moodText">正在看看 CoCo 的状态...</div>
        </div>
      </div>

      <section class="pet-grid" aria-label="CoCo 互动区">
        <div class="room">
          <div class="window" aria-hidden="true"></div>
          <div class="sun" aria-hidden="true"></div>
          <div class="floor" aria-hidden="true"></div>
          <div class="dog-area">
            <div class="dog-caption" id="dogCaption">CoCo</div>
            <button id="dogBtn" class="dog-button" type="button" aria-label="摸摸 CoCo">
              <svg class="dog-svg" viewBox="0 0 320 300" aria-hidden="true">
                <path class="tail" d="M62 172 C26 150 32 106 72 110 C102 113 102 149 76 154" fill="none" stroke="#c88447" stroke-width="24" stroke-linecap="round"/>
                <ellipse cx="160" cy="190" rx="96" ry="82" fill="#efbd75"/>
                <ellipse cx="160" cy="220" rx="76" ry="46" fill="#fff4e8"/>
                <path class="ear-left" d="M94 104 C65 58 82 26 121 36 C138 41 142 62 132 84 C120 96 108 104 94 104Z" fill="#c88447"/>
                <path class="ear-right" d="M226 104 C255 58 238 26 199 36 C182 41 178 62 188 84 C200 96 212 104 226 104Z" fill="#c88447"/>
                <circle cx="160" cy="136" r="84" fill="#f3c77d"/>
                <ellipse cx="160" cy="159" rx="56" ry="39" fill="#fff7ed"/>
                <circle class="eye-open" cx="126" cy="126" r="8" fill="#241b16"/>
                <circle class="eye-open" cx="194" cy="126" r="8" fill="#241b16"/>
                <path class="eye-sleep" d="M116 126 C122 132 132 132 138 126" fill="none" stroke="#241b16" stroke-width="5" stroke-linecap="round"/>
                <path class="eye-sleep" d="M184 126 C190 132 200 132 206 126" fill="none" stroke="#241b16" stroke-width="5" stroke-linecap="round"/>
                <circle cx="160" cy="154" r="8" fill="#241b16"/>
                <path d="M160 162 C150 174 137 172 130 164" fill="none" stroke="#241b16" stroke-width="5" stroke-linecap="round"/>
                <path d="M160 162 C170 174 183 172 190 164" fill="none" stroke="#241b16" stroke-width="5" stroke-linecap="round"/>
                <path d="M118 188 C138 204 182 204 202 188" fill="none" stroke="#dd9965" stroke-width="7" stroke-linecap="round" opacity=".65"/>
                <ellipse cx="102" cy="260" rx="28" ry="16" fill="#d99a5c"/>
                <ellipse cx="218" cy="260" rx="28" ry="16" fill="#d99a5c"/>
              </svg>
            </button>

            <button id="feedBtn" class="bowl" type="button" aria-label="喂食">
              <span class="bowl-shape"><span class="bowl-food"></span></span>
              <span class="object-label">喂食</span>
            </button>
            <button id="waterBtn" class="cup" type="button" aria-label="喂水">
              <span class="cup-shape"><span class="cup-water"></span></span>
              <span class="object-label">喂水</span>
            </button>
            <button id="playBtn" class="toy" type="button" aria-label="陪玩">
              <span class="toy-shape"></span>
              <span class="object-label">陪玩</span>
            </button>
          </div>
        </div>

        <aside class="panels" aria-label="CoCo 状态">
          <section class="panel">
            <div class="panel-title">
              <span>状态仪表</span>
              <span class="care-line" id="petNameText">CoCo</span>
            </div>
            <div class="state-grid">
              <div class="meter">
                <div class="meter-top"><span>好感度</span><span id="affectionText">0 / 100</span></div>
                <div class="bar"><div id="affectionBar" class="fill affection"></div></div>
              </div>
              <div class="meter">
                <div class="meter-top"><span>饱食度</span><span id="hungerText">0 / 100</span></div>
                <div class="bar"><div id="hungerBar" class="fill hunger"></div></div>
              </div>
              <div class="meter">
                <div class="meter-top"><span>饮水度</span><span id="thirstText">0 / 100</span></div>
                <div class="bar"><div id="thirstBar" class="fill thirst"></div></div>
              </div>
              <div class="meter">
                <div class="meter-top"><span>精力</span><span id="energyText">0 / 100</span></div>
                <div class="bar"><div id="energyBar" class="fill energy"></div></div>
              </div>
              <div class="meter">
                <div class="meter-top"><span>干净度</span><span id="cleanText">0 / 100</span></div>
                <div class="bar"><div id="cleanBar" class="fill clean"></div></div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">照顾 CoCo</div>
            <div class="action-grid">
              <button class="action" id="walkBtn" type="button"><strong>出门散步</strong><span>提升精力和好感</span></button>
              <button class="action" id="cleanBtn" type="button"><strong>洗澡梳毛</strong><span>让 CoCo 香香的</span></button>
              <button class="action" id="napBtn" type="button"><strong>陪它午睡</strong><span>恢复一点状态</span></button>
              <button class="action" id="treatBtn" type="button"><strong>奖励零食</strong><span>小小惊喜</span></button>
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">名字和日记</div>
            <div class="name-row">
              <input id="nameInput" class="name-input" type="text" maxlength="20" placeholder="给小狗取个名字" />
              <button class="btn primary-btn" id="saveNameBtn" type="button">保存</button>
            </div>
            <div style="height:8px"></div>
            <button class="btn ghost-btn" id="resetNameBtn" type="button">恢复 CoCo</button>
            <div style="height:12px"></div>
            <div class="log-list" id="logList"></div>

        </aside>
      </section>
    </main>
  </div>

  <div class="login-gate" id="loginGate">
    <div class="login-card">
      <div class="head">
        <h3>需要先登录</h3>
        <p>先在主页注册或登录，CoCo 的状态会保存在云端，之后回来还能继续照顾它。</p>
      </div>
      <div class="body">
        <div class="care-line">当前还没有登录，或者登录状态已经失效。</div>
        <div class="actions">
          <button class="btn primary-btn" id="goHomeBtn" type="button">返回主页登录</button>
          <button class="btn ghost-btn" id="refreshBtn" type="button">重新检测</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5/dist/cos-js-sdk-v5.min.js"></script>
  <script src="./assets/site-auth.js"></script>
  <script src="./assets/vendor/gsap/gsap.min.js"></script>
  <script src="./assets/site-motion.js"></script>
  <script>
    const shared = window.NuonuoShared;
    const getCurrentUser = shared.getCurrentUser;
    const getObjectText = shared.getObjectText;
    const putJson = shared.putJsonToCos;
    const isNotFound = shared.isNotFound;

    const PET_KEY = 'petdata/shared_pet.json';
    const DECAY_MS = 24 * 60 * 60 * 1000;
    const SLOW_DECAY_MS = 36 * 60 * 60 * 1000;
    const DEFAULT_PET_NAME = 'CoCo';
    const SYNC_INTERVAL_MS = 8000;

    const els = {
      userText: document.getElementById('userText'),
      petNameText: document.getElementById('petNameText'),
      nameInput: document.getElementById('nameInput'),
      affectionTopText: document.getElementById('affectionTopText'),
      affectionText: document.getElementById('affectionText'),
      hungerText: document.getElementById('hungerText'),
      thirstText: document.getElementById('thirstText'),
      energyText: document.getElementById('energyText'),
      cleanText: document.getElementById('cleanText'),
      affectionBar: document.getElementById('affectionBar'),
      hungerBar: document.getElementById('hungerBar'),
      thirstBar: document.getElementById('thirstBar'),
      energyBar: document.getElementById('energyBar'),
      cleanBar: document.getElementById('cleanBar'),
      dogBtn: document.getElementById('dogBtn'),
      feedBtn: document.getElementById('feedBtn'),
      waterBtn: document.getElementById('waterBtn'),
      playBtn: document.getElementById('playBtn'),
      walkBtn: document.getElementById('walkBtn'),
      cleanBtn: document.getElementById('cleanBtn'),
      napBtn: document.getElementById('napBtn'),
      treatBtn: document.getElementById('treatBtn'),
      logoutBtn: document.getElementById('logoutBtn'),
      moodTitle: document.getElementById('moodTitle'),
      moodText: document.getElementById('moodText'),
      dogCaption: document.getElementById('dogCaption'),
      loginGate: document.getElementById('loginGate'),
      goHomeBtn: document.getElementById('goHomeBtn'),
      refreshBtn: document.getElementById('refreshBtn'),
      saveNameBtn: document.getElementById('saveNameBtn'),
      resetNameBtn: document.getElementById('resetNameBtn'),
      logList: document.getElementById('logList')
    };

    let state = null;
    let saving = false;
    let loading = false;
    let currentUser = null;
    let syncTimer = null;

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function nowISO() {
      return new Date().toISOString();
    }

    function toMs(ts) {
      if (!ts) return null;
      const t = new Date(ts).getTime();
      return Number.isFinite(t) ? t : null;
    }

    function defaultState() {
      return {
        petName: DEFAULT_PET_NAME,
        affection: 0,
        energy: 72,
        clean: 78,
        lastFedAt: null,
        lastWaterAt: null,
        lastPlayedAt: null,
        lastWalkAt: null,
        lastCleanAt: null,
        careLog: [],
        createdAt: nowISO(),
        updatedAt: nowISO()
      };
    }

    function normalizeState(data) {
      const base = defaultState();
      const merged = { ...base, ...(data || {}) };
      merged.petName = merged.petName || DEFAULT_PET_NAME;
      merged.affection = clamp(Number(merged.affection || 0), 0, 100);
      merged.energy = clamp(Number(merged.energy ?? 72), 0, 100);
      merged.clean = clamp(Number(merged.clean ?? 78), 0, 100);
      merged.careLog = Array.isArray(merged.careLog) ? merged.careLog.slice(0, 8) : [];
      return merged;
    }

    function decayPercent(updatedAt, ms = DECAY_MS) {
      const t = toMs(updatedAt);
      if (!t) return 0;
      const elapsed = Date.now() - t;
      if (elapsed <= 0) return 100;
      return clamp(Math.round((1 - elapsed / ms) * 100), 0, 100);
    }

    function currentHunger() {
      return state ? decayPercent(state.lastFedAt) : 0;
    }

    function currentThirst() {
      return state ? decayPercent(state.lastWaterAt) : 0;
    }

    function currentEnergy() {
      if (!state) return 0;
      const playedDrain = state.lastPlayedAt ? Math.max(0, 12 - Math.floor((Date.now() - toMs(state.lastPlayedAt)) / (60 * 60 * 1000))) : 0;
      return clamp((state.energy || 0) - playedDrain, 0, 100);
    }

    function currentClean() {
      if (!state) return 0;
      const cleanDecay = decayPercent(state.lastCleanAt, SLOW_DECAY_MS);
      return state.lastCleanAt ? Math.min(clamp(state.clean || 0, 0, 100), cleanDecay) : clamp(state.clean || 0, 0, 100);
    }

    function addLog(text) {
      state.careLog = [
        { text, at: nowISO() },
        ...(state.careLog || [])
      ].slice(0, 8);
    }

    function moodInfo() {
      if (!state) return ['今天的心情', '正在看看 CoCo 的状态...'];
      const h = currentHunger();
      const w = currentThirst();
      const e = currentEnergy();
      const c = currentClean();
      const a = clamp(state.affection || 0, 0, 100);
      const name = state.petName || DEFAULT_PET_NAME;

      if (h < 18) return ['肚子咕咕叫', `${name} 正盯着饭碗看，想吃一点东西。`];
      if (w < 18) return ['有点口渴', `${name} 舔了舔嘴巴，水杯该续上啦。`];
      if (c < 22) return ['想洗香香', `${name} 玩了一圈，毛毛需要梳一梳。`];
      if (e < 18) return ['困困的', `${name} 想趴在你旁边睡一会儿。`];
      if (a >= 82 && h >= 55 && w >= 55) return ['超级黏人', `${name} 今天状态很好，看到你就摇尾巴。`];
      if (a >= 48) return ['越来越熟悉你', `${name} 已经会主动靠过来了。`];
      return ['慢慢亲近中', `摸摸 ${name}，它会一点点记住你的味道。`];
    }

    function dogMode() {
      const h = currentHunger();
      const w = currentThirst();
      const e = currentEnergy();
      const a = clamp(state?.affection || 0, 0, 100);
      if (e < 18) return 'sleepy';
      if (h < 18 || w < 18) return 'hungry';
      if (a >= 70) return 'happy';
      return '';
    }

    function renderLog() {
      const logs = state?.careLog || [];
      els.logList.innerHTML = logs.length
        ? logs.map(item => `<div class="log-item">${escapeHtml(item.text)}<br><span>${formatTime(item.at)}</span></div>`).join('')
        : '<div class="log-item">还没有日记。先摸摸 CoCo，第一条记录就会出现。</div>';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatTime(ts) {
      const t = toMs(ts);
      if (!t) return '';
      const d = new Date(t);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function render() {
      if (!state) return;
      const h = currentHunger();
      const w = currentThirst();
      const e = currentEnergy();
      const c = currentClean();
      const a = clamp(state.affection || 0, 0, 100);
      const petName = state.petName || DEFAULT_PET_NAME;
      const [title, mood] = moodInfo();

      els.userText.textContent = currentUser?.username || '未登录';
      els.petNameText.textContent = petName;
      els.dogCaption.textContent = petName;
      els.affectionTopText.textContent = a;
      els.moodTitle.textContent = title;
      els.moodText.textContent = mood;

      els.affectionText.textContent = `${a} / 100`;
      els.hungerText.textContent = `${h} / 100`;
      els.thirstText.textContent = `${w} / 100`;
      els.energyText.textContent = `${e} / 100`;
      els.cleanText.textContent = `${c} / 100`;

      els.affectionBar.style.width = `${a}%`;
      els.hungerBar.style.width = `${h}%`;
      els.thirstBar.style.width = `${w}%`;
      els.energyBar.style.width = `${e}%`;
      els.cleanBar.style.width = `${c}%`;

      els.feedBtn.disabled = h >= 100;
      els.waterBtn.disabled = w >= 100;

      els.dogBtn.classList.remove('sleepy', 'hungry', 'happy');
      const mode = dogMode();
      if (mode) els.dogBtn.classList.add(mode);

      if (document.activeElement !== els.nameInput) {
        els.nameInput.value = petName === DEFAULT_PET_NAME ? '' : petName;
      }
      renderLog();
    }

    async function saveState() {
      if (!state || saving) return;
      saving = true;
      try {
        state.updatedAt = nowISO();
        await putJson(PET_KEY, state);
      } catch (err) {
        console.error(err);
      } finally {
        saving = false;
      }
    }

    async function loadState() {
      if (loading) return;
      loading = true;
      currentUser = getCurrentUser();
      if (!currentUser) {
        els.loginGate.classList.add('show');
        loading = false;
        return;
      }

      try {
        const text = await getObjectText(PET_KEY);
        state = normalizeState(JSON.parse(text));
      } catch (err) {
        if (isNotFound(err)) {
          state = defaultState();
          addLog('CoCo 来到小窝，正在等你照顾它。');
          await saveState();
        } else {
          console.error(err);
          state = defaultState();
        }
      }

      els.loginGate.classList.remove('show');
      render();
      loading = false;
    }

    async function syncFromCloud() {
      if (!state || saving || loading) return;
      try {
        const text = await getObjectText(PET_KEY);
        const remote = normalizeState(JSON.parse(text));
        if ((toMs(remote.updatedAt) || 0) > (toMs(state.updatedAt) || 0)) {
          state = remote;
          render();
        }
      } catch (err) {
        if (!isNotFound(err)) console.error(err);
      }
    }

    function bounce() {
      els.dogBtn.classList.remove('bounce');
      void els.dogBtn.offsetWidth;
      els.dogBtn.classList.add('bounce');
    }

    function spawnFloat(icon, x = null, y = null) {
      const el = document.createElement('div');
      el.className = 'pet-float';
      el.textContent = icon;
      const host = document.querySelector('.dog-area');
      const rect = host.getBoundingClientRect();
      const px = x ?? rect.left + rect.width * .5;
      const py = y ?? rect.top + rect.height * .42;
      el.style.left = `${px - rect.left}px`;
      el.style.top = `${py - rect.top}px`;
      host.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }

    async function interact(icon, logText, changes = {}, event = null) {
      if (!state) return;
      state.affection = clamp((state.affection || 0) + (changes.affection || 0), 0, 100);
      state.energy = clamp((state.energy || 0) + (changes.energy || 0), 0, 100);
      state.clean = clamp((state.clean || 0) + (changes.clean || 0), 0, 100);
      if (changes.feed) state.lastFedAt = nowISO();
      if (changes.water) state.lastWaterAt = nowISO();
      if (changes.play) state.lastPlayedAt = nowISO();
      if (changes.walk) state.lastWalkAt = nowISO();
      if (changes.cleanNow) state.lastCleanAt = nowISO();
      addLog(logText);
      bounce();
      spawnFloat(icon, event?.clientX, event?.clientY);
      render();
      await saveState();
    }

    function petDog(event) {
      return interact('💗', `摸摸了 ${state.petName || DEFAULT_PET_NAME}，它把头靠了过来。`, { affection: 1 }, event);
    }

    function feedDog(event) {
      return interact('🍚', `${state.petName || DEFAULT_PET_NAME} 吃了一碗饭，尾巴摇得很快。`, { affection: 5, energy: 3, feed: true }, event);
    }

    function waterDog(event) {
      return interact('💧', `${state.petName || DEFAULT_PET_NAME} 喝了水，精神了一点。`, { affection: 4, water: true }, event);
    }

    function playDog(event) {
      return interact('🎾', `陪 ${state.petName || DEFAULT_PET_NAME} 玩了小球，它开心地转圈。`, { affection: 6, energy: -8, clean: -4, play: true }, event);
    }

    function walkDog(event) {
      return interact('🌿', `带 ${state.petName || DEFAULT_PET_NAME} 出门散步，闻了好多新味道。`, { affection: 7, energy: 8, clean: -7, walk: true }, event);
    }

    function cleanDog(event) {
      return interact('🫧', `给 ${state.petName || DEFAULT_PET_NAME} 洗澡梳毛，现在香香软软。`, { affection: 3, clean: 100, cleanNow: true }, event);
    }

    function napDog(event) {
      return interact('💤', `陪 ${state.petName || DEFAULT_PET_NAME} 睡了一会儿，它醒来很安心。`, { affection: 3, energy: 18 }, event);
    }

    function treatDog(event) {
      return interact('🦴', `奖励了 ${state.petName || DEFAULT_PET_NAME} 一块小零食。`, { affection: 4, energy: 2, feed: true }, event);
    }

    async function savePetName() {
      if (!state) return;
      const value = els.nameInput.value.trim();
      if (!value) {
        alert('请输入小狗名字');
        return;
      }
      state.petName = value.slice(0, 20);
      addLog(`给小狗起名叫 ${state.petName}。`);
      render();
      await saveState();
    }

    async function resetName() {
      if (!state) return;
      state.petName = DEFAULT_PET_NAME;
      addLog('把名字恢复成 CoCo。');
      render();
      await saveState();
    }

    function logout() {
      shared.setCurrentUser(null, { notify: false });
      goHome();
    }

    function goHome() {
      if (window.NuonuoMotion?.returnHome) {
        window.NuonuoMotion.returnHome('pet');
        return;
      }
      location.href = './index.html';
    }

    els.logoutBtn.addEventListener('click', logout);
    els.goHomeBtn.addEventListener('click', goHome);
    els.refreshBtn.addEventListener('click', async () => {
      els.loginGate.classList.remove('show');
      await loadState();
    });

    els.dogBtn.addEventListener('click', petDog);
    els.feedBtn.addEventListener('click', feedDog);
    els.waterBtn.addEventListener('click', waterDog);
    els.playBtn.addEventListener('click', playDog);
    els.walkBtn.addEventListener('click', walkDog);
    els.cleanBtn.addEventListener('click', cleanDog);
    els.napBtn.addEventListener('click', napDog);
    els.treatBtn.addEventListener('click', treatDog);
    els.saveNameBtn.addEventListener('click', savePetName);
    els.resetNameBtn.addEventListener('click', resetName);
    els.nameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        savePetName();
      }
    });

    setInterval(() => {
      if (state) render();
    }, 60 * 1000);

    syncTimer = setInterval(syncFromCloud, SYNC_INTERVAL_MS);
    loadState();
  </script>
</body>
